  .true { color: #4caf7d; }

  .opt.tf.correct { background:#1e5140; border-color:#4caf7d; }

function shuf(arr){ var a=arr.slice(),i,j,t; for(i=a.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* tur -> kaba sinif (celdirici havuzunu gruplamak icin) */
function posClass(t){
  t=(t||'').toLowerCase();
  if(t.indexOf('czas')===0 || t==='dk' || t==='ndk') return 'v';
  if(t==='ż'||t==='n'||t==='m'||t==='lm'||t.indexOf('rzecz')===0) return 'n';
  if(t.indexOf('przym')===0) return 'adj';
  if(t.indexOf('przysł')===0 || t.indexOf('przysl')===0) return 'adv';
  if(t.indexOf('spój')===0 || t.indexOf('spoj')===0) return 'conj';
  if(t.indexOf('przyim')===0) return 'prep';
  if(t.indexOf('zaim')===0 || t==='ta' || t==='się' || t==='sie') return 'pron';
  if(t.indexOf('licz')===0) return 'num';
  return 'x';
}

/* havuzdan 'need' adet tekrarsiz celdirici; dogru cevap tek basina EN UZUN olmasin */
function pickDistractors(correct, pool, exclude, need){
  var ex={},i,v; for(i=0;i<exclude.length;i++) ex[exclude[i]]=1;
  var cand=[],seen={};
  for(i=0;i<pool.length;i++){ v=pool[i]; if(v && v!==correct && !ex[v] && !seen[v]){ seen[v]=1; cand.push(v); } }
  cand=shuf(cand);
  var out=cand.slice(0,need);
  if(out.length===need){
    var longest=true;
    for(i=0;i<out.length;i++){ if(out[i].length>=correct.length){ longest=false; break; } }
    if(longest){
      var longer=cand.slice(need).filter(function(x){ return x.length>=correct.length; });
      if(longer.length){ var si=0; for(i=1;i<out.length;i++) if(out[i].length<out[si].length) si=i; out[si]=longer[Math.floor(Math.random()*longer.length)]; }
    }
  }
  return out;
}
function fixLongest(opts, extraPool, used){
  var cl=opts[0].length,i,longest=true;
  for(i=1;i<opts.length;i++) if(opts[i].length>=cl){ longest=false; break; }
  if(longest){
    var pool=extraPool.filter(function(x){ return x && x.length>=cl && used.indexOf(x)===-1 && opts.indexOf(x)===-1; });
    if(pool.length){ var si=1; for(i=2;i<opts.length;i++) if(opts[i].length<opts[si].length) si=i; opts[si]=pool[Math.floor(Math.random()*pool.length)]; }
  }
  return opts;
}
/* dogru + 3 celdirici (pools sirayla: ayni tur -> ayni set -> yerlesik) -> 4 sik, karistir */
function buildOpts(correct, fileDist, pools){
  var opts=[correct], used=[correct], i, v, pi, pk;
  for(i=0;i<fileDist.length && opts.length<4;i++){ v=fileDist[i]; if(v && v!==correct && used.indexOf(v)===-1){ opts.push(v); used.push(v); } }
  for(pi=0; pi<pools.length && opts.length<4; pi++){
    pk=pickDistractors(correct, pools[pi]||[], used, 4-opts.length);
    for(i=0;i<pk.length;i++){ opts.push(pk[i]); used.push(pk[i]); }
  }
  while(opts.length<4) opts.push('\u2014');
  var extra=[]; for(pi=0;pi<pools.length;pi++) extra=extra.concat(pools[pi]||[]);
  fixLongest(opts, extra, used);
  var order=shuf([0,1,2,3]), shuffled=[], letter='A';
  for(i=0;i<4;i++){ shuffled.push(opts[order[i]]); if(order[i]===0) letter=LET[i]; }
  return { opts:shuffled, letter:letter };
}
function rebuildUploads(){
  var up=loadUP(); if(!up.length){ injectUploads(); return; }
  var G=globalPools(), i, j;
  for(i=0;i<up.length;i++){
    var st=up[i], ws=st.words||[], trAll=[], plAll=[], trCls={}, plCls={}, c;
    for(j=0;j<ws.length;j++){
      c=posClass(ws[j].typ); trAll.push(ws[j].tr); plAll.push(ws[j].pl);
      (trCls[c]=trCls[c]||[]).push(ws[j].tr); (plCls[c]=plCls[c]||[]).push(ws[j].pl);
    }
    for(j=0;j<ws.length;j++){
      var w=ws[j]; c=posClass(w.typ);
      var tb=buildOpts(w.tr, w.dtr||[], [ trCls[c]||[], trAll, G.tr ]);
      var pb=buildOpts(w.pl, w.dpl||[], [ plCls[c]||[], plAll, G.pl ]);
      w.trOpts=tb.opts; w.trLetter=tb.letter; w.plOpts=pb.opts; w.plLetter=pb.letter;
    }
  }
  saveUP(up); injectUploads();
}
function injectUploads(){
  if(Q.length>QBASE) Q.length=QBASE;
  var up=loadUP(), i, j, needBuild=false;
  for(i=0;i<up.length;i++){ var ws=up[i].words||[]; for(j=0;j<ws.length;j++){ if(!ws[j].trOpts||!ws[j].plOpts) needBuild=true; } }
  if(needBuild){ rebuildUploads(); return; }
  for(i=0;i<up.length;i++){ var st=up[i], w2=st.words||[]; for(j=0;j<w2.length;j++){ var w=w2[j];
    Q.push([ w.n, w.pl, (w.typ||st.name), w.trOpts, w.trLetter, w.plOpts, w.plLetter, st.name ]); } }
}

/* GLOBAL BICIM (her alan / ile ayrilir):
   pl / cins / tag / tr / ornekPL / ornekTR / plCel1 / plCel2 / trCel1 / trCel2
   Gecerli alan sayisi: 2 (pl/tr), 4, 6, ya da 10. Alan icinde / olan satirlar (kayik)
   sessizce bozulmasin diye atlanir ve kullaniciya bildirilir. */
function cleanTag(s){ return (s||'').replace(/^["'\s]+|["'\s]+$/g,'').trim(); }
function parseSetFile(text){
  var lines=text.split(/\r?\n/), rows=[], bad=[], i, k;
  for(i=0;i<lines.length;i++){
    var raw=lines[i].replace(/^\uFEFF/,'').trim();
    if(!raw) continue;
    var f=raw.split(/\s+\/\s+/); for(k=0;k<f.length;k++) f[k]=f[k].trim();
    var n=f.length;
    if(n!==2 && n!==4 && n!==6 && n!==10){ bad.push(f[0]||('sat\u0131r '+(i+1))); continue; }
    var pl=f[0], typ=(n>=4?f[1]:''), tag=(n>=4?cleanTag(f[2]):''), tr=(n>=4?f[3]:f[1]);
    var exPl=(n>=6?f[4]:''), exTr=(n>=6?f[5]:'');
    var dpl=[], dtr=[];
    if(n>=10){ if(f[6])dpl.push(f[6]); if(f[7])dpl.push(f[7]); if(f[8])dtr.push(f[8]); if(f[9])dtr.push(f[9]); }
    if(!pl || !tr){ bad.push(f[0]||('sat\u0131r '+(i+1))); continue; }
    rows.push({ pl:pl, tr:tr, typ:typ, tag:tag, exPl:exPl, exTr:exTr, dpl:dpl, dtr:dtr });
  }
  return { rows:rows, bad:bad };
}
function setMsg(m){ var e=$('upMsg'); if(e) e.innerHTML=m; }
function handleFile(file){
  var reader=new FileReader();
  reader.onload=function(){ ingestText(String(reader.result||''), file.name); };
  reader.onerror=function(){ setMsg('Dosya okunamadı.'); };
  reader.readAsText(file,'utf-8');
}
/* Dosya ya da web'ten gelen metni ayrıştırıp yeni set olarak ekle (ortak) */
function ingestText(text, srcName){
  var pr=parseSetFile(String(text||''));
  var recs=pr.rows, bad=pr.bad;
  if(!recs.length){ setMsg('Geçerli satır yok. Biçim: pl / cins / tag / tr / örnekPL / örnekTR / çePL1 / çePL2 / çeTR1 / çeTR2 (her alan / ile).'); return false; }
  var up=loadUP();
  /* set adi: dosyadaki tek tutarli etiket varsa onu, yoksa kaynak adini kullan */
  var tset={},ti; for(ti=0;ti<recs.length;ti++){ if(recs[ti].tag) tset[recs[ti].tag]=1; }
  var tkeys=Object.keys(tset);
  var base;
  if(tkeys.length===1){ base=tkeys[0]; }
  else { base=(srcName||'set').replace(/\.[^.]+$/,''); }
  base=base.replace(/[^0-9A-Za-z\u00c0-\u024f _\-]/g,'').trim(); if(!base) base='set';
  var taken=allTags().concat(up.map(function(x){ return x.name; })), name=base, kk=2;
  while(taken.indexOf(name)!==-1){ name=base+'-'+kk; kk++; }
  var mx=0,i,z; for(i=0;i<Q.length;i++) if(Q[i][0]>mx) mx=Q[i][0];
  for(i=0;i<up.length;i++){ var ww=up[i].words||[]; for(z=0;z<ww.length;z++) if(ww[z].n>mx) mx=ww[z].n; }
  for(i=0;i<recs.length;i++) recs[i].n=++mx;
  up.push({ name:name, words:recs });
  saveUP(up); rebuildUploads();
  var warn = bad.length ? ' <span style="color:#e0a96c">⚠ '+bad.length+' satır atlandı (alan içinde / var): '+bad.slice(0,8).join(', ')+(bad.length>8?'…':'')+'</span>' : '';
  setMsg(recs.length+' kelime yüklendi — “'+name+'”.'+warn+' Aşağıdan işaretleyip <b>Uygula</b>.');
  renderSets();
  return true;
}
/* github.com/.../blob/... bağlantısını otomatik olarak raw'a çevir */
function normUrl(u){
  u=(u||'').trim();
  var m=u.match(/^https?:\/\/github\.com\/([^\/]+)\/([^\/]+)\/blob\/(.+)$/);
  if(m){ u='https://raw.githubusercontent.com/'+m[1]+'/'+m[2]+'/'+m[3]; }
  return u;
}
/* URL'den metin çek (XHR; eski Android tarayıcılarında da çalışır) */
function fetchText(url){
  return new Promise(function(resolve,reject){
    try{
      var xhr=new XMLHttpRequest();
      xhr.open('GET', url, true);
      try{ xhr.responseType='text'; }catch(e){}
      xhr.timeout=20000;
      xhr.onload=function(){
        var ok=(xhr.status>=200 && xhr.status<300) || xhr.status===0;
        if(ok) resolve(xhr.responseText||xhr.response||'');
        else reject(new Error('HTTP '+xhr.status));
      };
      xhr.onerror=function(){ reject(new Error('ağ/CORS hatası')); };
      xhr.ontimeout=function(){ reject(new Error('zaman aşımı')); };
      xhr.send();
    }catch(e){ reject(e); }
  });
}
function escAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function loadFromWeb(){
  var inp=$('webUrl');
  var url=normUrl(inp?inp.value:'');
  if(!url){ setMsg('<span style="color:#e06c6c">Önce bir .txt bağlantısı yapıştır.</span>'); return; }
  if(!/^https?:\/\//i.test(url)){ setMsg('<span style="color:#e06c6c">Bağlantı http(s):// ile başlamalı.</span>'); return; }
  try{ localStorage.setItem(WEBKEY, url); }catch(e){}
  if(inp) inp.value=url;
  setMsg('Yükleniyor…');
  fetchText(url).then(function(text){
    var nm=(url.split('?')[0].split('#')[0].split('/').pop())||'web';
    ingestText(text, nm);

    setMsg('<span style="color:#e06c6c">Yüklenemedi: '+((err&&err.message)||err)+'. Bağlantıyı ve internet erişimini kontrol et. GitHub için <b>raw</b> bağlantı kullan.</span>');
  });
}

function shuffled(n){

  for (i = 0; i < n; i++) a.push(i);
  for (i = n - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

function makeTF(qi, fromRetry, tries, avoid){
  var d = Q[qi];
  if (avoid === undefined) avoid = lastCand[qi];   /* aynı kelime tekrar sorulursa önceki çeviriyi tekrarlama */
  var correctText = d[3][LET.indexOf(d[4])];
  var distract = [];
  for (var j = 0; j < 4; j++) if (LET[j] !== d[4]) distract.push(d[3][j]);

  var showCorrect = Math.random() < 0.5;
  var candidate;
  if (showCorrect) {
    candidate = correctText;
    if (candidate === avoid) showCorrect = false;   /* doğru olan bir önce gösterildiyse çeldirici göster */
  }
  if (!showCorrect) {
    var pool = distract.filter(function(t){ return t !== avoid; });
    if (!pool.length) pool = distract;
    candidate = pool[Math.floor(Math.random() * pool.length)];
  }
  lastCand[qi] = candidate;
  return { qi: qi, fromRetry: fromRetry, tries: tries, correctAns: showCorrect ? 'D' : 'Y', candidate: candidate };
}

function nextTF(){
  var moreRetry = S.retry && S.retry.length;
  if (moreRetry && sinceRetry >= 6) { sinceRetry = 0; return makeTF(S.retry.shift(), true, 0); }
  if (S.i < S.order.length) { sinceRetry++; return makeTF(S.order[S.i], false, 0); }
  if (moreRetry) { sinceRetry = 0; return makeTF(S.retry.shift(), true, 0); }
  return null;
}

  if (!tf) tf = nextTF();

function pickTF(){
  if (locked) return;
  locked = true;
  var wasArmed = armExclude; armExclude = false;
  var ans = this.getAttribute('data-a');
  var ok = (ans === tf.correctAns);
  var bs = $('quiz').getElementsByClassName('opt');
  for (var k = 0; k < bs.length; k++) {
    var a = bs[k].getAttribute('data-a');
    bs[k].disabled = true;
    if (a === tf.correctAns) bs[k].className = 'opt tf correct';
    else if (a === ans) bs[k].className = 'opt tf wrong';
  }

  var isFresh = !tf.fromRetry;
  var d = Q[tf.qi];

  if (ok) {
    if (isFresh && tf.tries === 0) { S.ok++; S.i++; }
    else if (isFresh && tf.tries === 1) { S.i++; }        /* wrong daha önce sayıldı, şimdi ilerle */
    /* fromRetry doğru: kuyruktan zaten çıktı, istatistik değişmez */
    if (wasArmed) { EX[d[0]] = Date.now(); if (S.retry) S.retry = S.retry.filter(function(x){ return x !== tf.qi; }); saveEX(); }
    save(); meta();
    setTimeout(afterTF, 180);
    return;
  }

  /* YANLIŞ */
  if (isFresh && tf.tries === 0) {
    var myChoice = (tf.correctAns === 'D') ? 'RED' : LET[d[3].indexOf(tf.candidate)];
    S.wrong.push([d[0], d[1], myChoice, d[4], S.i + 1, 'tf']);
    if (tf.correctAns === 'D') {
      /* doğru çeviriyi yanlış sandın: düzeltmede öğrendin → hemen sorma, ileride sor */
      if (!S.retry) S.retry = [];
      S.retry.push(tf.qi);
      S.i++;
      save(); meta();
      setTimeout(afterTF, 1100);
    } else {
      /* yanlış çeviriyi doğru sandın: hemen bir kez daha sor */
      save(); meta();
      setTimeout(function(){ tf = makeTF(tf.qi, false, 1); renderTF(); }, 1100);
    }
    return;
  }
  if (isFresh && tf.tries === 1) {
    /* ikinci kez yanlış: ileride tekrar sor */
    if (!S.retry) S.retry = [];
    S.retry.push(tf.qi);
    S.i++;
    save(); meta();
    setTimeout(afterTF, 1100);
    return;
  }
  /* fromRetry yanlış: kuyruğa geri koy, ileride yine sor (istatistik değişmez) */
  if (!S.retry) S.retry = [];
  S.retry.push(tf.qi);
  save(); meta();
  setTimeout(function(){ tf = null; render(); }, 1100);
}

  var done = S.i;
  if (done === 0) {
    r.innerHTML = '<h2>DEĞERLENDİRME</h2><div class="empty">Henüz soru cevaplamadın.</div>' +
                  '<button class="btn" id="cont">Teste dön</button>';
    $('cont').onclick = function(){ render(); window.scrollTo(0, 0); };
    return;
  }

  var blockStart = Math.floor((done - 1) / 50) * 50 + 1;
  var blockWrong = [];
  for (var i = 0; i < S.wrong.length; i++) {
    var ap = S.wrong[i][4];
    if (ap >= blockStart && ap <= done) blockWrong.push(S.wrong[i]);
  }
  var blockCount = done - blockStart + 1;
  var blockOk = blockCount - blockWrong.length;

  var totOk = done - S.wrong.length;
  var pct  = Math.round(totOk / done * 1000) / 10;
  var bpct = Math.round(blockOk / blockCount * 1000) / 10;

  var h = '<h2>' + (fin ? 'TEST TAMAMLANDI'
                        : 'ARA DEĞERLENDİRME · ' + blockStart + '–' + done + '. cevap') + '</h2>';

  h += '<div class="sect">Bu bölüm (' + blockStart + '–' + done + '. cevap)</div>';
  h += grid(blockOk, blockWrong.length, bpct);

  h += '<div class="sect">Genel · toplam ' + done + ' cevap</div>';
  h += grid(totOk, S.wrong.length, pct);

  h += '<div class="sect">Baştan itibaren TÜM yanlışlar (' + S.wrong.length + ')</div>';
  if (!S.wrong.length) {
    h += '<div class="empty">Hiç yanlışın yok. Doskonale!</div>';
  } else {
    var ws = S.wrong.slice().sort(function(a, b){ return a[0] - b[0]; });
    h += '<table><tr><th>Soru</th><th>Kelime</th><th>Senin seçimin</th><th>Doğrusu</th></tr>';
    for (var j = 0; j < ws.length; j++) {
      var w = ws[j], d = byNum(w[0]); var wm = w[5] || 'mc';
      var kel = (wm === 'mr' && d) ? d[3][LET.indexOf(d[4])] : w[1];
      h += '<tr><td class="n">' + w[0] + '</td><td class="w">' + kel + '</td>' +
           '<td class="mine">' + letterText(d, w[2], wm) + '</td>' +
           '<td class="true">' + letterText(d, w[3], wm) + '</td></tr>';
    }
    h += '</table>';
  }

  if (S.wrong.length) h += '<button class="btn sec" id="exp">Yanlışları dışarı aktar (.txt)</button>';
  if (fin) h += '<button class="btn" id="again">Baştan başla (yeni karışık sıra)</button>';
  else     h += '<button class="btn" id="cont">Devam et</button>';

  r.innerHTML = h;
  if (S.wrong.length) $('exp').onclick = exportWrong;
  if (fin) $('again').onclick = reset;
  else     $('cont').onclick = function(){ render(); window.scrollTo(0, 0); };
}

/* ---------- KONTROL ---------- */
function reset(){
  rebuildUploads();
  S = fresh();
  tf = null; sinceRetry = 0; lastCand = {};
  save();
  render();
  window.scrollTo(0, 0);
}
function setMode(m){
  if (S.mode === m) return;
  S.mode = m; tf = null; sinceRetry = 0; lastCand = {};
  save();
  render(); window.scrollTo(0, 0);
}

$('mMc').onclick   = function(){ setMode('mc'); };
$('mMr').onclick   = function(){ setMode('mr'); };
$('mTf').onclick   = function(){ setMode('tf'); };
$('stop').onclick  = function(){ report(false); };
$('reset').onclick = function(){ if (confirm('Tüm ilerleme silinsin, yeni karışık sıra başlasın mı?')) reset(); };
$('openExcl').onclick = openExclPanel;
$('openSets').onclick = openSetPanel;

loadEX();
injectUploads();
loadSets();
load();
render();
</script>
