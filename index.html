<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uygulamalar</title>

<!-- ===== AYARLAR / SETTINGS ===== -->
<!-- Liste dosyası (TR + EN tek dosyada) / List file (TR + EN in one file): apps.txt -->
<!-- Satır / Line:  TR kısa | EN short  /  dosya.html  /  TR uzun | EN long -->
<!-- Bölüm / Section:  - Türkçe | English -  -->
<!-- Arayüz metinleri aşağıda, <script> içindeki UI nesnesinde. / UI texts are in the UI object in <script>. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#F5F4F0;
    --ink:#1A1A17;
    --muted:#6B6A62;
    --hair:#DEDCD4;
    --accent:#B23A2E;
    --wash:#EDEBE4;
    --maxw:44rem;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"JetBrains Mono",ui-monospace,monospace;
    line-height:1.5;
    padding:clamp(1.5rem,5vw,4rem) clamp(1.25rem,5vw,2rem) 5rem;
    display:flex;
    justify-content:center;
  }

  .shell{width:100%;max-width:var(--maxw);}

  /* --- Başlık --- */
  header{
    margin-bottom:clamp(2rem,6vw,3.25rem);
    padding-bottom:1.25rem;
    border-bottom:1px solid var(--hair);
    position:relative;
  }
  header h1{
    font-family:"Space Grotesk",sans-serif;
    font-weight:600;
    font-size:clamp(1.75rem,6vw,2.5rem);
    letter-spacing:-0.02em;
    margin:0;
    padding-right:6.5rem;
  }
  header p{
    font-size:0.8rem;
    color:var(--muted);
    margin:0.6rem 0 0;
    max-width:34rem;
  }

  /* --- Dil seçici --- */
  .lang{
    position:absolute;
    top:0.35rem;
    right:0;
    display:flex;
    border:1px solid var(--ink);
    border-radius:6px;
    overflow:hidden;
  }
  .lang button{
    font:inherit;
    font-size:0.78rem;
    font-weight:500;
    background:transparent;
    color:var(--ink);
    border:0;
    padding:0.4rem 0.7rem;
    cursor:pointer;
    min-width:2.6rem;
  }
  .lang button + button{border-left:1px solid var(--ink);}
  .lang button[aria-pressed="true"]{
    background:var(--ink);
    color:var(--paper);
    font-weight:600;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .lang button:focus-visible{outline:2px solid var(--ink);outline-offset:-4px;}

  /* --- Liste --- */
  .list{
    opacity:0;
    transition:opacity .5s ease;
  }
  .list.ready{opacity:1;}

  a.entry{
    display:block;
    text-decoration:none;
    color:inherit;
    padding:1.15rem clamp(0.6rem,3vw,1.1rem);
    margin:0 clamp(-0.6rem,-3vw,-1.1rem);
    border-radius:6px;
    border-bottom:1px solid var(--hair);
    transition:background-color .18s ease;
  }
  a.entry:last-child{border-bottom:0;}
  a.entry:hover,
  a.entry:focus-visible{
    background:var(--wash);
    outline:none;
  }
  a.entry:focus-visible{box-shadow:inset 3px 0 0 var(--accent);}

  .entry .short{
    font-family:"Space Grotesk",sans-serif;
    font-weight:500;
    font-size:clamp(1.15rem,4vw,1.5rem);
    letter-spacing:-0.01em;
    line-height:1.25;
    transition:color .18s ease;
  }
  a.entry:hover .short,
  a.entry:focus-visible .short{color:var(--accent);}

  .entry .long{
    font-size:0.82rem;
    color:var(--muted);
    margin-top:0.4rem;
    max-width:38rem;
  }

  /* --- Bölüm başlığı --- */
  .section{
    margin:2.25rem 0 0;
    padding-bottom:0.5rem;
    border-bottom:1px solid var(--hair);
    font-family:"Space Grotesk",sans-serif;
    font-weight:600;
    font-size:0.9rem;
    letter-spacing:0.04em;
    color:var(--accent);
  }
  .list > .section:first-child{margin-top:0;}

  /* --- Boş / hata durumu --- */
  .note{
    font-size:0.85rem;
    color:var(--muted);
    padding:1.5rem 0;
    line-height:1.7;
  }
  .note code{
    background:var(--wash);
    padding:0.12em 0.4em;
    border-radius:4px;
    color:var(--ink);
  }

  @media (prefers-reduced-motion:reduce){
    .list{opacity:1;transition:none;}
    a.entry,.entry .short{transition:none;}
  }
</style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="lang" role="group" aria-label="Dil / Language">
        <button type="button" data-lang="tr" aria-pressed="true">TR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <h1 id="title">Uygulamalar</h1>
      <p id="subtitle">Bir uygulamayı açmak için satıra dokun.</p>
    </header>

    <main id="list" class="list" aria-live="polite"></main>
  </div>

<script>
  const KAYNAK = "apps.txt";
  const STORE_KEY = "apps-lang";

  const UI = {
    tr: {
      title: "Uygulamalar",
      subtitle: "Bir uygulamayı açmak için satıra dokun.",
      empty: (f) => `Henüz uygulama yok. <code>${esc(f)}</code> dosyasına satır ekle:<br>` +
                    `<code>kısa tarif | short / dosya.html / uzun tarif | long</code>`,
      error: (f) => `<code>${esc(f)}</code> okunamadı. Bu sayfanın bir sunucu üzerinden ` +
                    `(GitHub Pages) açılması gerekir — dosyadan doğrudan <code>file://</code> ile ` +
                    `açıldığında tarayıcı okumaya izin vermez.`
    },
    en: {
      title: "Apps",
      subtitle: "Tap a row to open an app.",
      empty: (f) => `No apps yet. Add a line to <code>${esc(f)}</code>:<br>` +
                    `<code>kısa tarif | short / file.html / uzun tarif | long</code>`,
      error: (f) => `Could not read <code>${esc(f)}</code>. This page must be served from a server ` +
                    `(GitHub Pages) — opening it directly with <code>file://</code> ` +
                    `blocks the browser from reading the file.`
    }
  };

  const list = document.getElementById("list");
  const buttons = document.querySelectorAll(".lang button");

  let lang = "tr";
  let items = null;      // yüklenen liste (iki dilli)
  let failed = false;

  function esc(s){
    return s.replace(/[&<>"']/g, c => (
      {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
    ));
  }

  // "Türkçe | English" -> {tr, en}. Ayraç yoksa aynı metin iki dilde.
  function bi(text){
    const i = text.indexOf("|");
    if (i === -1) return { tr: text.trim(), en: text.trim() };
    const tr = text.slice(0, i).trim();
    const en = text.slice(i + 1).trim();
    return { tr: tr || en, en: en || tr };
  }

  // kısa / dosya / uzun — ilk iki "/" ayraç.
  function parseLine(line){
    const i1 = line.indexOf("/");
    if (i1 === -1) return null;
    const i2 = line.indexOf("/", i1 + 1);

    const short = line.slice(0, i1).trim();
    const file  = (i2 === -1 ? line.slice(i1 + 1) : line.slice(i1 + 1, i2)).trim();
    const long  = (i2 === -1 ? "" : line.slice(i2 + 1)).trim();

    if (!short || !file) return null;
    return { short: bi(short), file, long: long ? bi(long) : null };
  }

  // "- Başlık | Title -"
  function parseSection(line){
    const m = line.match(/^-\s*(.+?)\s*-$/);
    if (!m) return null;
    const label = m[1].trim();
    if (!label || /^-+$/.test(label)) return null;
    return bi(label);
  }

  function showNote(html){
    list.innerHTML = `<div class="note">${html}</div>`;
    list.classList.add("ready");
  }

  function render(){
    if (failed){ showNote(UI[lang].error(KAYNAK)); return; }
    if (!items) return;
    if (!items.some(it => it.type === "entry")){
      showNote(UI[lang].empty(KAYNAK)); return;
    }

    list.innerHTML = "";
    for (const it of items){
      if (it.type === "section"){
        const h = document.createElement("div");
        h.className = "section";
        h.textContent = it.label[lang];
        list.appendChild(h);
        continue;
      }
      const a = document.createElement("a");
      a.className = "entry";
      a.href = it.file;
      a.innerHTML =
        `<div class="short">${esc(it.short[lang])}</div>` +
        (it.long ? `<div class="long">${esc(it.long[lang])}</div>` : "");
      list.appendChild(a);
    }
    requestAnimationFrame(() => list.classList.add("ready"));
  }

  function applyLang(l, save){
    lang = (l === "en") ? "en" : "tr";
    document.documentElement.lang = lang;
    document.title = UI[lang].title;
    document.getElementById("title").textContent = UI[lang].title;
    document.getElementById("subtitle").textContent = UI[lang].subtitle;
    buttons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    if (save){
      try { localStorage.setItem(STORE_KEY, lang); } catch(e){}
    }
    render();
  }

  buttons.forEach(b => b.addEventListener("click", () => applyLang(b.dataset.lang, true)));

  // Son seçimi hatırla; yoksa tarayıcı diline bak.
  let saved = null;
  try { saved = localStorage.getItem(STORE_KEY); } catch(e){}
  applyLang(
    saved || ((navigator.language || "tr").toLowerCase().startsWith("tr") ? "tr" : "en"),
    false
  );

  fetch(KAYNAK, { cache: "no-store" })
    .then(r => {
      if (!r.ok) throw new Error(r.status);
      return r.text();
    })
    .then(text => {
      const lines = text
        .split(/\r?\n/)
        .map(l => l.trim())
        .filter(l => l && !l.startsWith("#"));

      items = [];
      for (const line of lines){
        const section = parseSection(line);
        if (section){ items.push({ type: "section", label: section }); continue; }
        const entry = parseLine(line);
        if (entry){ items.push({ type: "entry", ...entry }); }
      }
      render();
    })
    .catch(() => { failed = true; render(); });
</script>
</body>
</html>
