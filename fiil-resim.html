<title>Czasowniki – obrazki</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f4f4f0;color:#1b1b1b}
#app{max-width:560px;margin:0 auto;padding:14px}
.top{display:flex;justify-content:space-between;font-size:15px;margin-bottom:10px}
.card{background:#fff;border:2px solid #2d6a3e;border-radius:14px;padding:14px}
.pair{background:#fff;border:1px solid #bbb;border-radius:10px;text-align:center;padding:6px}.pair img{max-width:100%;max-height:230px}.thumb img{height:52px;width:auto;max-width:110px;object-fit:contain;border:1px solid #bbb;border-radius:6px;background:#fff;display:block}.credit{font-size:11px;color:#555;text-align:center;margin-top:14px}
.pics{display:flex;gap:10px}
.pic{flex:1;text-align:center;border:1px solid #bbb;border-radius:10px;padding:10px 4px}
.pic .e{font-size:44px;line-height:1.2}
.pic .t{font-size:13px;margin-top:4px;color:#444}
.obj{text-align:center;font-size:20px;margin:12px 0}
.opt{display:block;width:100%;text-align:left;font-size:18px;padding:13px;margin-top:8px;border-radius:10px;border:2px solid #888;background:#fff;color:#1b1b1b}
.opt.ok{border-color:#2d6a3e;background:#e6f3e9;font-weight:700}
.opt.no{display:flex;align-items:center;gap:12px;border-style:dashed;border-color:#000;background:#eee;text-decoration:line-through}
.btns{display:flex;gap:8px;margin-top:12px}
button.go{flex:1;font-size:17px;padding:12px;border-radius:10px;border:2px solid #2d6a3e;background:#2d6a3e;color:#fff}
.fb{margin-top:10px;font-size:17px}

const Z=[["budzę się", ""], ["ścielę", "łóżko"], ["wchodzę", "do łazienki"], ["wchodzę", "do kuchni"], ["karmię", "kota"], ["smażę", "jajecznicę"], ["kroję", "chleb"], ["parzę i słodzę", "herbatę"], ["czyszczę", "buty"], ["wychodzę", "z domu"], ["spieszę się", "na autobus"], ["stoję", "na przystanku"], ["kończę", "pracę"], ["robię", "obiad"], ["siedzę", "przy kominku"], ["dzwonię", "do znajomych"], ["uczę się", "polskiego"], ["bawię się", "z kotem"], ["wynoszę", "śmieci"], ["gaszę", "światło"], ["myślę", "o kolejnym dniu"], ["śpię i śnię", ""]];
// ortak liste: label = seçenek metni, img, cap = resmin altındaki ek yazı, t = tür (seçenekler aynı türden gelir)
const ITEMS=[];
W.forEach((w,i)=>ITEMS.push({label:w[0]+" / "+w[1],img:IMG1[i],cap:"… "+w[2],t:1}));
Z.forEach((z,i)=>ITEMS.push({label:z[0],img:IMG2[i],cap:"… "+z[1],t:2}));
const LB=i=>typeof i==="string"?i.slice(1):ITEMS[i].label,IM=i=>typeof i==="string"?"":ITEMS[i].img;
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,r)=>p[0]-r[0]).map(p=>p[1]);
let q=[],cur=null,done=0,first=0,opts=[],tried=false,solved=false;
function makeOptions(c){
 const L=ITEMS[c].label.length,same0=[...ITEMS.keys()].filter(i=>i!==c&&ITEMS[i].t===ITEMS[c].t&&ITEMS[i].label!==ITEMS[c].label),seen={},same=same0.filter(i=>!seen[ITEMS[i].label]&&(seen[ITEMS[i].label]=1));
 for(let n=0;n<50;n++){
  const near=shuffle(same).sort((a,b)=>Math.abs(ITEMS[a].label.length-L)-Math.abs(ITEMS[b].label.length-L)).slice(0,7);
  const pick=shuffle(near).slice(0,3);
  if(L<=Math.max(...pick.map(i=>ITEMS[i].label.length))) return shuffle([c,...pick]);
 }
 // doğru seçenek kaçınılmaz olarak en uzunsa: iki fiili "i" ile birleştirip eşit uzunlukta çeldirici üret
 const vs=same.map(i=>ITEMS[i].label).filter(x=>x.indexOf(" i ")<0&&x.indexOf(" się")<0);
 const pk=shuffle(same).slice(0,2);
 for(let n=0;n<200;n++){
  const x=shuffle(vs),syn=x[0]+" i "+x[1];
  if(syn.length>=L){const rest=shuffle(same).slice(0,2);
   const id="s"+syn;
   return shuffle([c,...rest,id]);}
 }
 return shuffle([c,...shuffle(same).slice(0,3)]);
}
function start(){q=shuffle([...ITEMS.keys()]);done=0;first=0;next()}
function next(){
 if(!q.length){document.getElementById("app").innerHTML=
 `<div class="card"><h2>Koniec</h2><p>İlk denemede doğru: ${first} / ${ITEMS.length}</p><div class="btns"><button class="go" onclick="start()">Od nowa</button></div></div>`;return}

function render(){
 const it=ITEMS[cur];
 document.getElementById("app").innerHTML=`
 <div class="top"><span>Zrobione: ${done}/${ITEMS.length}</span><span>Zostało: ${q.length+1}</span></div>
 <div class="card">
  <div class="pair">${it.img}</div>
  ${it.cap?`<div class="obj">${it.cap}</div>`:`<div class="obj">&nbsp;</div>`}
  <div>${opts.map(i=>`<button class="opt" id="o${i}" onclick="pick('${i}')">${LB(i)}</button>`).join("")}</div>
  <div id="out"></div></div>`;
}
function pick(i){
 if(solved)return;
 if(!/^s/.test(i))i=+i;
 const b=document.getElementById("o"+i),out=document.getElementById("out");
 if(i===cur){
  solved=true;done++;if(!tried)first++;
  b.className="opt ok";b.textContent="✓ "+LB(i);
  out.innerHTML=`<div class="btns"><button class="go" onclick="next()">Sonraki</button></div>`;
 }else{
  if(!tried){q.push(cur);}
  tried=true;
  b.className="opt no";b.disabled=true;b.innerHTML=`<span class="thumb">${IM(i)}</span><span>✗ ${LB(i)}</span>`;
  out.innerHTML=`<div class="fb">✗ Yanlış, tekrar dene</div>`;
 }
}
