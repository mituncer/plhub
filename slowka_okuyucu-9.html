html,body{height:100%;overflow:hidden;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.open #sheetBg{display:block}.open #sheet{display:flex}

select,input[type=range]{max-width:55%}

<script>
const $=id=>document.getElementById(id);
const S=window.speechSynthesis;
let base=[],order=[],idx=0,shuffled=false,listName='',listText='',playing=false,runId=0,wake=null,voices=[];
const cfg={order:'pt',rep:1,gapR:0.8,loop:true,exOn:false,rateP:0.85,volP:1,gapP:1.2,plV:'',rateT:1,volT:1,gapT:1.5,trV:''};

/* ---------- kalıcı kayıt ---------- */
let STORE=null;
try{const k='__t';localStorage.setItem(k,'1');localStorage.removeItem(k);STORE=localStorage;}catch(e){STORE=null;}
const get=k=>{try{return STORE?JSON.parse(STORE.getItem(k)||'null'):null}catch(e){return null}};
const put=(k,v)=>{try{STORE&&STORE.setItem(k,JSON.stringify(v))}catch(e){}};
Object.assign(cfg,get('slowka.cfg')||{});
const saveCfg=()=>put('slowka.cfg',cfg);
const saveState=()=>put('slowka.state',{text:listText,name:listName,order,idx,shuffled});

/* ---------- liste ---------- */
function parse(txt){
  const out=[];
  for(let line of txt.split(/\r?\n/)){
    line=line.trim(); if(!line) continue;
    if(/^pl\s*\/\s*cins\s*\/\s*tag\s*\/\s*tercume/i.test(line)) continue;
    let f;
    if(/ \/( |$)/.test(line)) f=line.split(/ \/(?= |$)/).map(s=>s.trim());
    else if(line.includes('\t')) f=line.split('\t').map(s=>s.trim());
    else if(line.includes(' - ')) f=line.split(' - ').map(s=>s.trim());
    else f=line.split('/').map(s=>s.trim());
    const w=f.length>=4?{pl:f[0],tr:f[3],exPl:f[4]||'',exTr:f[5]||'',kisa:f[10]||''}:{pl:f[0],tr:f[1]||'',exPl:'',exTr:'',kisa:''};
    if(w.pl) out.push(w);
  }
  return out;
}
const W=i=>base[order[i]];
function setList(txt,name,st){
  listText=txt; listName=name; base=parse(txt);
  const ok=st&&Array.isArray(st.order)&&st.order.length===base.length;
  order=ok?st.order:base.map((_,i)=>i);
  shuffled=ok?!!st.shuffled:false;
  idx=ok?Math.min(st.idx||0,base.length-1):0;
  $('title').textContent=name;
  renderList(); show(); updShuf(); saveState();
}
function renderList(){
  const L=$('list'); L.innerHTML='';
  order.forEach((_,i)=>{const w=W(i),li=document.createElement('li');
    li.innerHTML='<span class="a"></span><span class="b"></span>';
    li.children[0].textContent=w.pl; li.children[1].textContent=w.tr;
    li.onclick=()=>jump(i); L.appendChild(li);});
}
let userScrollUntil=0;
function follow(cur){
  if(Date.now()<userScrollUntil) return;
  const L=$('list'),lr=L.getBoundingClientRect(),cr=cur.getBoundingClientRect();
  const d=(cr.top-lr.top)-(L.clientHeight-cr.height)/2;
  if(Math.abs(d)>2) L.scrollTop+=d;
}
function show(){
  const w=W(idx); if(!w) return;
  $('pl').textContent=w.pl; $('tr').textContent=w.tr;
  $('ex').textContent=w.exPl?(w.exPl+(w.exTr?' — '+w.exTr:'')):(w.kisa||'');
  $('cnt').textContent=(idx+1)+' / '+order.length;
  [...$('list').children].forEach((li,i)=>li.classList.toggle('cur',i===idx));
  const cur=$('list').children[idx]; if(cur) follow(cur);
  saveState();
}
function updShuf(){$('shuf').classList.toggle('on',shuffled);$('shufL').textContent=shuffled?'Karışık ✓':'Karışık';}
function toggleShuffle(){
  const was=playing; halt();
  const curOrig=order[idx];
  if(!shuffled){order=base.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}idx=0;}
  else{order=base.map((_,i)=>i);idx=curOrig;}
  shuffled=!shuffled; renderList(); show(); updShuf(); userScrollUntil=0;
  if(was) start();
}

/* ---------- sesler ---------- */
function loadVoices(){
  voices=S?S.getVoices():[];
  const fill=(sel,pre,key)=>{
    const vs=voices.filter(v=>v.lang.toLowerCase().replace('_','-').startsWith(pre));
    sel.innerHTML='<option value="">Varsayılan</option>'+vs.map(v=>`<option value="${v.voiceURI}">${v.name}</option>`).join('');
    sel.value=vs.some(v=>v.voiceURI===cfg[key])?cfg[key]:''; return vs.length;
  };
  const p=fill($('plV'),'pl','plV'),t=fill($('trV'),'tr','trV');
  const w=[];
  if(!S) w.push('Bu tarayıcı sesli okumayı desteklemiyor.');
  else if(voices.length){if(!p)w.push('Cihazda Polonca ses yok.');if(!t)w.push('Cihazda Türkçe ses yok.');}
  if(w.length) w.push('Android: Ayarlar → Sistem → Dil → Metin okuma → Google → dil verilerini yükle.');
  if(!STORE) w.push('⚠️ Bu açılış şeklinde tarayıcı kayıt izni vermiyor; ayarlar ve liste hatırlanmayacak.');
  $('warn').textContent=w.join(' ');
}
if(S){loadVoices();S.onvoiceschanged=loadVoices;}else loadVoices();

let keepU=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function speakOnce(text,lang){
  return new Promise(res=>{
    const u=new SpeechSynthesisUtterance(text); keepU=u;
    const pl=lang==='pl', rate=pl?cfg.rateP:cfg.rateT;
    u.lang=pl?'pl-PL':'tr-TR'; u.rate=rate; u.volume=pl?cfg.volP:cfg.volT;
    const vid=pl?cfg.plV:cfg.trV;
    const v=voices.find(v=>v.voiceURI===vid)||voices.find(v=>v.lang.toLowerCase().replace('_','-').startsWith(lang));
    if(v) u.voice=v;
    let done=false,started=false;
    const fin=ok=>{if(!done){done=true;clearTimeout(t1);clearTimeout(t2);res(ok);}};
    const t1=setTimeout(()=>{if(!started&&!S.speaking)fin(false);},1800);
    const t2=setTimeout(()=>fin(true),3000+text.length*170/rate);
    u.onstart=()=>{started=true}; u.onend=()=>fin(true); u.onerror=()=>fin(started);
    S.speak(u);
  });
}
async function speak(text,lang,token){
  if(!S||!text||token!==runId) return;
  for(let a=0;a<2&&token===runId;a++){
    S.cancel(); await sleep(120); if(token!==runId) return;
    if(await speakOnce(text,lang)) return;
  }
}
const wait=(ms,token)=>new Promise(r=>{const t0=Date.now();const iv=setInterval(()=>{if(token!==runId||Date.now()-t0>=ms){clearInterval(iv);r();}},50)});
function mark(x){$('pl').classList.toggle('speaking',x==='pl');$('tr').classList.toggle('speaking',x==='tr');}

/* ---------- oynatma ---------- */
async function run(token){
  while(token===runId){
    const w=W(idx); show();
    const PL=async()=>{for(let r=0;r<cfg.rep&&token===runId;r++){mark('pl');$('repI').textContent=cfg.rep>1?('tekrar '+(r+1)+' / '+cfg.rep):'';await speak(w.pl,'pl',token);mark('');if(r<cfg.rep-1)await wait(cfg.gapR*1000,token);}if(token===runId)await wait(cfg.gapP*1000,token);};
    const TR=async()=>{mark('tr');await speak(w.tr,'tr',token);mark('');if(token===runId)await wait(cfg.gapT*1000,token);};
    const steps={pt:[PL,TR],tp:[TR,PL],ptp:[PL,TR,PL],p:[PL]}[cfg.order]||[PL,TR];
    for(let i=0;i<steps.length&&token===runId;i++) await steps[i]();
    if(cfg.exOn&&w.exPl&&token===runId){mark('pl');await speak(w.exPl,'pl',token);mark('');await wait(cfg.gapP*1000,token);
      if(w.exTr&&cfg.order!=='p'&&token===runId){mark('tr');await speak(w.exTr,'tr',token);mark('');await wait(cfg.gapT*1000,token);}}
    $('repI').textContent='';
    if(token!==runId) return;
    if(idx<order.length-1) idx++;
    else if(cfg.loop) idx=0;
    else {pause(); idx=0; show(); return;}
  }
}
function setPlayUI(){$('play').textContent=playing?'⏸':'▶';$('play2').textContent=playing?'⏸ Duraklat':'▶ Başlat';$('playL').textContent=playing?'Duraklat':'Başlat';}
async function start(){
  if(!order.length) return;
  playing=true; setPlayUI(); const token=++runId;
  try{if('wakeLock' in navigator) wake=await navigator.wakeLock.request('screen');}catch(e){}
  run(token);
}
function halt(){runId++; S&&S.cancel(); mark(''); $('repI').textContent='';}
function pause(){playing=false; halt(); setPlayUI(); try{wake&&wake.release()}catch(e){} wake=null;}
function jump(i){const was=playing; halt(); idx=(i+order.length)%order.length; userScrollUntil=0; show(); if(was){const t=++runId;run(t);} }
document.addEventListener('visibilitychange',async()=>{if(playing&&document.visibilityState==='visible'){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}});

$('play').onclick=()=>playing?pause():start();
$('play2').onclick=()=>playing?pause():start();
$('stopB').onclick=()=>{pause(); idx=0; userScrollUntil=0; show();};
$('next').onclick=()=>jump(idx+1);
$('prev').onclick=()=>jump(idx-1);
$('shuf').onclick=toggleShuffle;
$('card').onclick=async()=>{if(playing)return;const w=W(idx);if(!w)return;const t=++runId;mark('pl');await speak(w.pl,'pl',t);mark('');if(t!==runId)return;await wait(cfg.gapP*1000,t);mark('tr');await speak(w.tr,'tr',t);mark('');};
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;pause();const r=new FileReader();r.onload=()=>setList(r.result,f.name.replace(/\.txt$/i,''),null);r.readAsText(f,'utf-8');e.target.value='';};
['touchstart','wheel'].forEach(ev=>$('list').addEventListener(ev,()=>{userScrollUntil=Date.now()+5000},{passive:true}));

/* ---------- GitHub: uygulamanın bulunduğu depodaki .txt dosyaları ---------- */
// Sayfa mituncer.github.io/... adresinden açıldığında depo ve klasör adresten otomatik bulunur.
// Dosya olarak (file://) açılırsa varsayılan depo denenir.
const GH_DEFAULT={owner:'mituncer',repo:'mituncer.github.io',path:''};
let curSrc=get('slowka.src')||'';
function ghCandidates(){
  const host=location.hostname;
  if(!/\.github\.io$/i.test(host)) return [GH_DEFAULT];
  const owner=host.split('.')[0];
  const d=location.pathname.split('/').filter(Boolean);
  if(d.length&&d[d.length-1].includes('.')) d.pop();          // dosya adını at
  const c=[];
  if(d.length) c.push({owner,repo:d[0],path:d.slice(1).join('/')});   // proje sitesi
  c.push({owner,repo:owner+'.github.io',path:d.join('/')});           // kullanıcı sitesi
  return c;
}
const natSort=(a,b)=>a.name.localeCompare(b.name,'tr',{numeric:true,sensitivity:'base'});
function msg(t,err){$('webMsg').style.color=err?'var(--pl)':'var(--soft)';$('webMsg').textContent=t;}
async function listRepo(){
  $('files').innerHTML=''; $('crumb').textContent=''; msg('⏳ Dosyalar listeleniyor…');
  let items=null,src=null,lastErr=null;
  for(const c of ghCandidates()){
    const url='https://api.github.com/repos/'+c.owner+'/'+c.repo+'/contents'+(c.path?'/'+c.path:'');
    try{
      const r=await fetch(url,{headers:{'Accept':'application/vnd.github+json'},cache:'no-store'});
      if(r.ok){const d=await r.json(); if(Array.isArray(d)){items=d;src=c;break;}}
      else lastErr=r.status===403?'GitHub geçici olarak sınırladı (saatte 60 istek). Biraz sonra tekrar deneyin.':'HTTP '+r.status;
    }catch(e){lastErr='Bağlanılamadı. İnternet bağlantısını kontrol edin.';}
  }
  if(!items){msg('⚠️ Liste alınamadı: '+(lastErr||'depo bulunamadı'),true);return;}
  const txts=items.filter(i=>i.type==='file'&&/\.txt$/i.test(i.name)).sort(natSort);
  $('crumb').textContent='📁 '+src.owner+'/'+src.repo+(src.path?'/'+src.path:'');
  if(!txts.length){msg('Bu klasörde .txt dosyası yok.');return;}
  msg(txts.length+' dosya — okumak için dokunun');
  const onPages=/\.github\.io$/i.test(location.hostname);
  txts.forEach(f=>{
    const url=onPages?new URL(f.name,location.href).href:f.download_url;
    const b=document.createElement('button');
    b.className='hbtn'+(url===curSrc?' cur':'');
    b.innerHTML='<span></span><span class="sz"></span>';
    b.children[0].textContent='📄 '+f.name.replace(/\.txt$/i,'');
    b.children[1].textContent=(f.size/1024).toFixed(1)+' KB';
    b.onclick=()=>loadRemote(url,f.name);
    $('files').appendChild(b);
  });
}
async function loadRemote(url,name){
  msg('⏳ “'+name+'” okunuyor…');
  try{
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok) throw new Error('Dosya okunamadı: HTTP '+r.status);
    const txt=await r.text();
    if(!parse(txt).length) throw new Error('Dosyada okunabilir kelime satırı yok.');
    pause(); setList(txt,name.replace(/\.txt$/i,''),null);
    curSrc=url; put('slowka.src',url);
    document.body.classList.remove('web');
  }catch(e){msg(e instanceof TypeError?'Bağlanılamadı. İnternet bağlantısını kontrol edin.':e.message,true);}
}
$('webBtn').onclick=()=>{document.body.classList.add('web');listRepo();};
$('webRe').onclick=listRepo;
$('webCancel').onclick=()=>document.body.classList.remove('web');
$('webBg').onclick=()=>document.body.classList.remove('web');
$('file').addEventListener('change',()=>{curSrc='';put('slowka.src','');});

/* ---------- ayarlar penceresi ---------- */
const openSheet=()=>document.body.classList.add('open');
const closeSheet=()=>document.body.classList.remove('open');
$('setBtn').onclick=openSheet; $('closeBtn').onclick=closeSheet; $('sheetBg').onclick=closeSheet;
function bind(){
  $('order').value=cfg.order; $('rep').value=cfg.rep; $('loop').checked=cfg.loop; $('exOn').checked=cfg.exOn;
  const lbl=()=>{
    $('ratePV').textContent=Number(cfg.rateP).toFixed(2)+'×'; $('rateTV').textContent=Number(cfg.rateT).toFixed(2)+'×';
    $('volPV').textContent=Math.round(cfg.volP*100)+'%'; $('volTV').textContent=Math.round(cfg.volT*100)+'%';
    $('gapPV').textContent=Number(cfg.gapP).toFixed(1)+' sn'; $('gapTV').textContent=Number(cfg.gapT).toFixed(1)+' sn'; $('gapRV').textContent=Number(cfg.gapR).toFixed(1)+' sn';
  };
  ['rateP','rateT','gapP','gapT','gapR','volP','volT'].forEach(k=>{$(k).value=cfg[k];$(k).oninput=e=>{cfg[k]=+e.target.value;lbl();saveCfg();};}); lbl();
  $('order').onchange=e=>{cfg.order=e.target.value;saveCfg();};
  $('rep').onchange=e=>{cfg.rep=+e.target.value;saveCfg();};
  $('loop').onchange=e=>{cfg.loop=e.target.checked;saveCfg();};
  $('exOn').onchange=e=>{cfg.exOn=e.target.checked;saveCfg();};
  $('plV').onchange=e=>{cfg.plV=e.target.value;saveCfg();};
  $('trV').onchange=e=>{cfg.trV=e.target.value;saveCfg();};
  $('storeInfo').textContent=STORE?'✓ Ayarlar, son yüklenen liste ve kaldığınız kelime bu cihazda otomatik hatırlanır.':'⚠️ Tarayıcı bu açılış şeklinde kayıt izni vermiyor; ayarlar ve liste hatırlanamıyor.';
}
bind(); setPlayUI();

const st=get('slowka.state');
if(st&&st.text) setList(st.text,st.name||'Liste',st);
else setList($('data').textContent,'2609132336',null);
