<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polonca Çalışma</title>
<style>
  :root{
    --bg:#f5f2ec;--ink:#1c1a17;--muted:#6b6459;--line:#ddd6ca;
    --accent:#2f6d5b;--accent-soft:#dcebe4;--warn:#b4532a;--gold:#ffe9a8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;padding:22px 16px 80px;max-width:720px;margin:0 auto}
  .kicker{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
  h1{font-size:1.5rem;font-weight:700;letter-spacing:-.01em}

  /* ---------- HOME ---------- */
  #home .sub{color:var(--muted);font-size:.9rem;margin:6px 0 18px}
  .card{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;cursor:pointer;transition:transform .06s ease,box-shadow .15s}
  .card:hover{box-shadow:0 6px 18px rgba(28,26,23,.08)}
  .card:active{transform:translateY(1px)}
  .card .ct{font-size:1.08rem;font-weight:700;color:var(--ink);margin-bottom:4px}
  .card .ct .cnum{color:var(--accent);font-weight:800}
  .card .cp{font-size:.85rem;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .card .badge{display:inline-block;margin-top:10px;font-size:.7rem;font-weight:700;letter-spacing:.05em;color:var(--accent);background:var(--accent-soft);border:1px solid #c4ddd1;border-radius:20px;padding:3px 10px}

  /* ---------- READER ---------- */
  #reader-screen{display:none}
  .sticky-wrap{position:sticky;top:0;z-index:40;background:var(--bg);padding:8px 0 8px;margin-bottom:6px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
  .chip{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:9px 13px}
  .chip:active{transform:translateY(1px)}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .segbtn{font:inherit;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--muted);padding:9px 13px}
  .segbtn.active{background:var(--accent);color:#fff}
  .rate{display:flex;align-items:center;gap:7px;margin-left:auto;font-size:.82rem;color:var(--muted)}
  .rate input[type=range]{width:92px}
  .rate output{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);min-width:2.3em}

  .controls{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:11px 13px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 18px rgba(28,26,23,.08)}
  button.act{font:inherit;font-weight:600;cursor:pointer;border:none;border-radius:9px;padding:10px 15px;background:var(--accent);color:#fff;transition:transform .06s ease,opacity .15s}
  button.act:active{transform:translateY(1px)}
  button.ghost{background:#eee9df;color:var(--ink)}
  button.act:disabled{opacity:.4;cursor:default}
  .loop{display:flex;align-items:center;gap:7px;font-size:.85rem;font-weight:600;color:var(--ink);cursor:pointer;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:#faf8f3}
  .loop input{width:17px;height:17px;accent-color:var(--accent)}
  .loop.on{background:var(--accent-soft);border-color:#c4ddd1}
  .counter{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);padding:0 6px;min-width:3.6em;text-align:center}

  .status{margin:2px 0 12px;font-size:.78rem;color:var(--muted)}
  .status.warn{color:var(--warn)}
  .howto{font-size:.8rem;color:var(--muted);background:var(--accent-soft);border:1px solid #c4ddd1;border-radius:10px;padding:9px 13px;margin-bottom:14px}
  .howto b{color:var(--ink)}

  .text{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;font-size:1.12rem;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .text h2{font-size:1rem;margin-bottom:12px;font-weight:700}
  .text p{margin-bottom:14px}.text p:last-child{margin-bottom:0}
  .s{border-radius:4px;transition:background .2s}
  .s.active{background:var(--gold);box-shadow:0 0 0 3px var(--gold)}
  .w{cursor:pointer;border-radius:3px;transition:background .12s}
  .w:hover{background:#eef3f0}.w.tapped{background:#cfe6db}

  #tip{position:fixed;z-index:50;max-width:80vw;background:#1c1a17;color:#fff;padding:8px 12px;border-radius:9px;font-size:.95rem;line-height:1.35;box-shadow:0 6px 24px rgba(0,0,0,.25);display:none;pointer-events:none}
  #tip .pl{color:var(--gold);font-weight:700}#tip .en{opacity:.95}#tip .none{color:#f0c0a8;font-style:italic;font-size:.85rem}
  #overlay{position:fixed;inset:0;background:rgba(28,26,23,.55);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
  #modal{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  #modal .lab{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
  #modal .pl{font-size:1.1rem;font-weight:600;margin-bottom:16px;line-height:1.5}
  #modal .en{font-size:1rem;color:#2a2721;line-height:1.55;padding-top:14px;border-top:1px solid var(--line)}
  #modal .close{margin-top:20px;width:100%;text-align:center}
</style>
</head>
<body>

<!-- HOME -->
<div id="home">
  <div class="kicker">Nauka polskiego</div>
  <h1>Polonca Çalışma</h1>
  <p class="sub">Çalışmak istediğin metni seç.</p>
  <div id="homeList"></div>
</div>

<!-- READER -->
<div id="reader-screen">
  <div class="sticky-wrap">
    <div class="bar">
      <button class="chip" id="home-btn">← Menü</button>
      <div class="seg">
        <button class="segbtn active" data-mode="listen">🎧 Dinleme</button>
        <button class="segbtn" data-mode="sentence">🗣️ Cümle cümle</button>
      </div>
      <label class="rate">Hız
        <input id="rate" type="range" min="0.5" max="1.2" step="0.05" value="0.9">
        <output id="rateVal">0.90</output>
      </label>
    </div>

    <div class="controls" id="listenCtrls">
      <button class="act" id="play">▶ Odtwórz</button>
      <button class="act ghost" id="pause" disabled>⏸ Pauza</button>
      <button class="act ghost" id="stop" disabled>⏹ Stop</button>
      <label class="loop" id="loopLab"><input type="checkbox" id="loop"> 🔁 Sürekli</label>
    </div>

    <div class="controls" id="sentCtrls" style="display:none">
      <button class="act ghost" id="prev">⏮ Geri</button>
      <button class="act" id="repeat">🔁 Tekrar</button>
      <button class="act" id="next">⏭ İleri</button>
      <span class="counter" id="counter">– / –</span>
    </div>
  </div>

  <div class="status" id="status"></div>
  <div class="howto">👆 <b>Kelimeye dokun</b> → İngilizcesi &nbsp;·&nbsp; ✋ <b>Uzun bas</b> → cümle çevirisi</div>

  <div class="text" id="reader"></div>
</div>

<div id="tip"></div>
<div id="overlay"><div id="modal">
  <div class="lab">Zdanie · Cümle</div>
  <div class="pl" id="mPl"></div>
  <div class="en" id="mEn"></div>
  <button class="act ghost close" id="mClose">Zamknij · Kapat</button>
</div></div>

    "zobaczyć":"to see",
    "zostają":"they stay, remain",
    "zostać":"to become",
    "zostałem":"I became",
    "zupy":"soups",
    "zupę":"soup (accus.)",
    "zużywamy":"we use up, we consume",
    "zwiedzać":"to visit, to sightsee",
    "zwierząt":"animals (dla zwierząt = for animals)",
    "związane":"connected, related (związane z)",
    "zwykle":"usually",
    "zęby":"teeth (myć zęby = to brush teeth)",
    "ćwiczyć":"to exercise",
    "łatwiejsze":"easier",
    "łyżwy":"ice skates, ice skating",
    "łączy":"connects, joins",
    "śmiech":"laughter",
    "śmieci":"rubbish, waste",
    "śpią":"they sleep",
    "świata":"world (genitive)",
    "światło":"light",
    "świecie":"world (na świecie = in the world)",
    "świetne":"great, excellent",
    "świeże":"fresh (świeże powietrze = fresh air)",
    "świeżym":"fresh (na świeżym powietrzu = in the open air)",
    "święta":"holidays, festivals",
    "źle":"badly",
    "źródło":"source",
    "żarówek":"light bulbs (żarówek energooszczędnych)",
    "żeby":"in order to, so that",
    "żeglowania":"sailing (genitive)",
    "życia":"life (genitive)",
    "żyją":"they live",
    "żyli":"they lived / would live"
  };

  /* ================= STORAGE ================= */
  const store={
    get(k){try{return localStorage.getItem(k);}catch(e){return null;}},
    set(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  };

  /* ================= ELEMENTS ================= */
  const homeScreen=document.getElementById('home');
  const homeList=document.getElementById('homeList');
  const readerScreen=document.getElementById('reader-screen');
  const reader=document.getElementById('reader');
  const statusEl=document.getElementById('status');
  const rate=document.getElementById('rate'),rateVal=document.getElementById('rateVal');
  const listenCtrls=document.getElementById('listenCtrls'),sentCtrls=document.getElementById('sentCtrls');
  const playBtn=document.getElementById('play'),pauseBtn=document.getElementById('pause'),stopBtn=document.getElementById('stop');
  const loopBox=document.getElementById('loop'),loopLab=document.getElementById('loopLab');
  const prevBtn=document.getElementById('prev'),repeatBtn=document.getElementById('repeat'),nextBtn=document.getElementById('next'),counter=document.getElementById('counter');
  const segBtns=[...document.querySelectorAll('.segbtn')];

  /* ================= STATE ================= */
  const synth=('speechSynthesis'in window)?window.speechSynthesis:null;
  let plVoice=null,gen=0;
  let currentText=null, sentences=[], curMode='listen', sIdx=0;
  const L={idx:0,playing:false,paused:false};

  /* ================= VOICE ================= */
  function pickVoice(){
    if(!synth)return;
    const vs=synth.getVoices();
    plVoice=vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith('pl'))||null;
    if(plVoice){statusEl.className='status';statusEl.innerHTML='Lehçe ses: <b>'+plVoice.name+'</b>';}
    else if(vs.length){statusEl.className='status warn';statusEl.textContent='Lehçe ses paketi bulunamadı — telaffuz yanlış olabilir. (Android: Ayarlar → Erişilebilirlik → Metin okuma çıkışı → Polski)';}
  }
  if(synth){ synth.onvoiceschanged=pickVoice; pickVoice(); setTimeout(pickVoice,400); }
  else { statusEl.className='status warn'; statusEl.textContent='Bu tarayıcı sesi desteklemiyor. (Çeviri yine çalışır.)'; }
  rate.addEventListener('input',()=>rateVal.textContent=(+rate.value).toFixed(2));

  /* ================= SPEECH HELPERS ================= */
  function clearHi(){document.querySelectorAll('.s.active').forEach(x=>x.classList.remove('active'));}
  function highlight(el){clearHi(); if(el){el.classList.add('active'); el.scrollIntoView({behavior:'smooth',block:'center'});}}
  function stopSpeech(){gen++; if(synth){try{synth.cancel();}catch(e){}}}
  function speakUtter(text,el,onEnd){
    if(!synth)return;
    const myGen=++gen;
    const u=new SpeechSynthesisUtterance(text);
    u.lang='pl-PL'; if(plVoice)u.voice=plVoice; u.rate=+rate.value;
    u.onstart=()=>{if(myGen!==gen)return; highlight(el);};
    u.onend=()=>{if(myGen!==gen)return; if(onEnd)onEnd();};
    u.onerror=()=>{if(myGen!==gen)return; if(onEnd)onEnd();};
    try{synth.cancel();}catch(e){}
    synth.speak(u);
  }

  /* ================= LISTEN MODE ================= */
  loopBox.addEventListener('change',()=>loopLab.classList.toggle('on',loopBox.checked));
  function listenNext(){
    if(!L.playing||L.paused)return;
    if(L.idx>=sentences.length){ if(loopBox.checked){L.idx=0;} else {listenFinish();return;} }
    const s=sentences[L.idx];
    speakUtter(s.pl,s.el,()=>{ if(!L.playing||L.paused)return; L.idx++; listenNext(); });
  }
  function listenFinish(){L.playing=false;L.paused=false;stopSpeech();clearHi();playBtn.disabled=false;pauseBtn.disabled=true;stopBtn.disabled=true;pauseBtn.textContent='⏸ Pauza';}
  playBtn.addEventListener('click',()=>{L.idx=0;L.playing=true;L.paused=false;playBtn.disabled=true;pauseBtn.disabled=false;stopBtn.disabled=false;pauseBtn.textContent='⏸ Pauza';listenNext();});
  pauseBtn.addEventListener('click',()=>{
    if(!L.playing)return;
    if(!L.paused){L.paused=true;stopSpeech();pauseBtn.textContent='▶ Wznów';}
    else{L.paused=false;pauseBtn.textContent='⏸ Pauza';listenNext();}
  });
  stopBtn.addEventListener('click',listenFinish);

  /* ================= SENTENCE MODE ================= */
  function sentenceGo(i,speak){
    if(!sentences.length)return;
    sIdx=Math.max(0,Math.min(i,sentences.length-1));
    if(currentText)store.set('pl_sidx_'+currentText.id,String(sIdx));
    counter.textContent=(sIdx+1)+' / '+sentences.length;
    const s=sentences[sIdx];
    if(speak)speakUtter(s.pl,s.el,null); else highlight(s.el);
  }
  prevBtn.addEventListener('click',()=>sentenceGo(sIdx-1,true));
  repeatBtn.addEventListener('click',()=>sentenceGo(sIdx,true));
  nextBtn.addEventListener('click',()=>sentenceGo(sIdx+1,true));

  /* ================= MODE SWITCH ================= */
  function setMode(mode,gesture){
    stopSpeech(); L.playing=false; L.paused=false;
    curMode=mode; store.set('pl_mode',mode);
    segBtns.forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
    if(mode==='listen'){
      listenCtrls.style.display='flex'; sentCtrls.style.display='none';
      playBtn.disabled=false; pauseBtn.disabled=true; stopBtn.disabled=true; pauseBtn.textContent='⏸ Pauza';
      clearHi();
    }else{
      listenCtrls.style.display='none'; sentCtrls.style.display='flex';
      sentenceGo(sIdx,!!gesture);   // gesture=true → okur; false (ilk açılış) → sadece vurgular
    }
  }
  segBtns.forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode,true)));

  /* ================= BUILD READER ================= */
  function buildReader(text){
    reader.innerHTML=''; sentences.length=0;
    const h2=document.createElement('h2'); h2.textContent=(TEXTS.indexOf(text)+1)+'. '+text.title; reader.appendChild(h2);
    text.paragraphs.forEach(par=>{
      const p=document.createElement('p');
      par.forEach(sent=>{
        const sEl=document.createElement('span'); sEl.className='s';
        const toks=sent.pl.match(/\p{L}+|[^\p{L}]+/gu)||[];
        toks.forEach(t=>{
          if(/\p{L}/u.test(t)){const w=document.createElement('span');w.className='w';w.textContent=t;w._key=t.toLowerCase();w._sent=sent;sEl.appendChild(w);}
          else sEl.appendChild(document.createTextNode(t));
        });
        p.appendChild(sEl); p.appendChild(document.createTextNode(' '));
        sentences.push({el:sEl,pl:sent.pl,en:sent.en});
      });
      reader.appendChild(p);
    });
  }

  /* ================= NAVIGATION ================= */
  function openText(id){
    const t=TEXTS.find(x=>x.id===id); if(!t)return;
    currentText=t; store.set('pl_last_text',id);
    buildReader(t);
    homeScreen.style.display='none'; readerScreen.style.display='block';
    sIdx=parseInt(store.get('pl_sidx_'+id)||'0',10)||0;
    if(sIdx>=sentences.length)sIdx=0;
    const savedMode=store.get('pl_mode')||'listen';
    setMode(savedMode,false);           // ilk açılışta ses çalmaz (tarayıcı politikası)
    window.scrollTo(0,0);
  }
  function showHome(){
    stopSpeech(); L.playing=false; L.paused=false;
    readerScreen.style.display='none'; homeScreen.style.display='block';
    renderHome(); window.scrollTo(0,0);
  }
  document.getElementById('home-btn').addEventListener('click',showHome);

  function renderHome(){
    homeList.innerHTML='';
    const last=store.get('pl_last_text');
    TEXTS.forEach((t,i)=>{
      const card=document.createElement('button'); card.className='card';
      const preview=(t.paragraphs[0]&&t.paragraphs[0][0])?t.paragraphs[0][0].pl:'';
      card.innerHTML='<div class="ct"><span class="cnum">'+(i+1)+'.</span> '+t.title+'</div><div class="cp">'+preview+'</div>'+(t.id===last?'<span class="badge">Son çalıştığın</span>':'');
      card.addEventListener('click',()=>openText(t.id));
      homeList.appendChild(card);
    });
  }

  /* ================= WORD TAP / LONG-PRESS ================= */
  const tip=document.getElementById('tip');
  const overlay=document.getElementById('overlay'),mPl=document.getElementById('mPl'),mEn=document.getElementById('mEn');
  let pressTimer=null,longFired=false,startX=0,startY=0,curWord=null;
  function showTip(w){
    const en=GLOSS[w._key];
    tip.innerHTML=en?'<span class="pl">'+w.textContent+'</span> → <span class="en">'+en+'</span>'
                    :'<span class="pl">'+w.textContent+'</span> <span class="none">(çeviri bulunamadı)</span>';
    tip.style.display='block';
    const r=w.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
    let left=Math.max(8,Math.min(r.left+r.width/2-tw/2,window.innerWidth-tw-8));
    let top=r.top-th-8; if(top<8)top=r.bottom+8;
    tip.style.left=left+'px'; tip.style.top=top+'px';
    document.querySelectorAll('.w.tapped').forEach(x=>x.classList.remove('tapped'));
    w.classList.add('tapped');
  }
  function hideTip(){tip.style.display='none';document.querySelectorAll('.w.tapped').forEach(x=>x.classList.remove('tapped'));}
  function openSentence(s){mPl.textContent=s.pl;mEn.textContent=s.en;overlay.style.display='flex';hideTip();}
  document.getElementById('mClose').addEventListener('click',()=>overlay.style.display='none');
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.style.display='none';});

  reader.addEventListener('pointerdown',e=>{
    const w=e.target.closest('.w'); if(!w)return;
    curWord=w; longFired=false; startX=e.clientX; startY=e.clientY;
    pressTimer=setTimeout(()=>{longFired=true; openSentence(w._sent);},480);
  });
  reader.addEventListener('pointermove',e=>{if(pressTimer&&(Math.abs(e.clientX-startX)>10||Math.abs(e.clientY-startY)>10)){clearTimeout(pressTimer);pressTimer=null;}});
  reader.addEventListener('pointerup',e=>{
    if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}
    if(longFired){longFired=false;return;}
    const w=e.target.closest('.w'); if(w&&w===curWord)showTip(w);
  });
  reader.addEventListener('pointercancel',()=>{if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}});
  reader.addEventListener('contextmenu',e=>{if(e.target.closest('.w'))e.preventDefault();});
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('.w')&&!e.target.closest('#tip'))hideTip();});
  window.addEventListener('scroll',hideTip,{passive:true});

  /* ================= START ================= */
  renderHome();
  const last=store.get('pl_last_text');
  if(last && TEXTS.some(t=>t.id===last)) openText(last);   // son metni hatırla ve aç
})();
</script>
</body>
</html>
