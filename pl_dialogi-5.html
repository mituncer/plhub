<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dialogi — trener ról</title>
<style>
  :root{
    --bg:#12151d;--bg2:#161a24;--surface:#1b2130;--surface2:#212838;--line:#2b3446;
    --ink:#eae7de;--ink-soft:#b7bccb;--muted:#7f889c;
    --lamp:#f0b64a;--lamp-soft:#f0b64a33;--known:#7fc79a;--known-soft:#7fc79a22;
    --you:#182635;--you-line:#2a3c4f;
    --font-display:Georgia,'Iowan Old Style','Times New Roman',serif;
    --font-ui:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--font-ui);background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh;padding:0 0 env(safe-area-inset-bottom)}
  .wrap{max-width:740px;margin:0 auto;padding:20px 16px 90px}

  header{position:relative;padding:20px 4px 6px;overflow:hidden}
  header::before{content:"";position:absolute;top:-120px;left:50%;transform:translateX(-50%);width:340px;height:300px;border-radius:50%;background:radial-gradient(circle,var(--lamp-soft),transparent 68%);pointer-events:none}
  .eyebrow{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--lamp);font-weight:600}
  h1{font-family:var(--font-display);font-weight:400;font-size:1.7rem;line-height:1.15;margin:8px 0 4px}
  h1 em{font-style:italic;color:var(--ink-soft)}
  .sub{color:var(--muted);font-size:.9rem}

  .btn{font-family:var(--font-ui);font-size:.85rem;font-weight:500;color:var(--ink-soft);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:7px}
  .btn:hover{border-color:var(--muted);color:var(--ink)}
  .btn svg{width:15px;height:15px;flex:0 0 auto}
  .btn.primary{background:var(--lamp);border-color:var(--lamp);color:#1a1408;font-weight:600}
  .hide{display:none!important}

  /* list */
  .dcard{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-top:11px;cursor:pointer;transition:.2s}
  .dcard:hover{border-color:var(--muted);transform:translateY(-1px)}
  .dnum{font-family:var(--font-display);font-size:1.2rem;color:var(--lamp);min-width:26px;line-height:1.2}
  .dbody{flex:1;min-width:0}
  .dtopic{font-size:.96rem;color:var(--ink);line-height:1.45}
  .dmeta{font-size:.76rem;color:var(--muted);margin-top:5px}
  .dmeta b{color:var(--ink-soft);font-weight:600}
  .dprog{font-size:.72rem;color:var(--known)}

  /* practice header */
  .pbar{display:flex;align-items:center;gap:10px;margin-top:4px}
  .pbar .topic{font-family:var(--font-display);font-size:1.02rem;line-height:1.4;flex:1;min-width:0}
  .rolepick{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-top:14px}
  .rolepick .lbl{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
  .roles{display:flex;gap:8px}
  .roles button{flex:1;font-family:var(--font-ui);font-size:.92rem;color:var(--ink-soft);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 10px;cursor:pointer;transition:.2s}
  .roles button.sel{background:var(--lamp);border-color:var(--lamp);color:#1a1408;font-weight:600}
  .rolehint{font-size:.8rem;color:var(--muted);margin-top:9px;line-height:1.5}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
  .toolbar .btn{padding:8px 11px;font-size:.8rem}
  .toolbar .spacer{flex:1}
  .progress{display:flex;align-items:center;gap:10px}
  .ring{position:relative;width:44px;height:44px}
  .ring svg{transform:rotate(-90deg)}
  .ring .track{stroke:var(--line)}
  .ring .fill{stroke:var(--lamp);stroke-linecap:round;transition:stroke-dashoffset .5s}
  .ring .count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:.82rem}

  .speedbar{display:flex;align-items:center;gap:12px;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
  .speedbar .speedlbl{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);flex:0 0 auto}
  .speedbar input[type=range]{flex:1;min-width:0;accent-color:var(--lamp);height:4px}
  .speedbar .rateval{font-family:var(--font-display);font-size:1rem;color:var(--lamp);min-width:46px;text-align:right;flex:0 0 auto}

  /* chat */
  .chat{margin-top:16px;display:flex;flex-direction:column;gap:12px}
  .turn{max-width:88%;display:flex;flex-direction:column}
  .turn.them{align-self:flex-start;align-items:flex-start}
  .turn.you{align-self:flex-end;align-items:flex-end}
  .rolelbl{display:flex;align-items:center;gap:8px;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 4px 4px}
  .turn.you .rolelbl{color:var(--lamp);cursor:pointer}
  .rolelbl .mini{font-size:.7rem;padding:2px 7px;border:1px solid var(--line);border-radius:7px;background:var(--surface2);color:var(--ink-soft);cursor:pointer}
  .rolelbl .mini.on{background:var(--known-soft);border-color:#34503f;color:var(--known)}
  .rolelbl .ico{width:14px;height:14px;cursor:pointer;color:var(--ink-soft)}
  .rolelbl .ico:hover{color:var(--lamp)}
  .bubble{border-radius:14px;padding:11px 14px;font-family:var(--font-display);font-size:1.1rem;line-height:1.7}
  .turn.them .bubble{background:var(--surface);border:1px solid var(--line);border-top-left-radius:5px}
  .turn.you .bubble{background:var(--you);border:1px solid var(--you-line);border-top-right-radius:5px}
  .fl{color:var(--lamp);font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  .dots{color:#9aa3b6;letter-spacing:.5px}
  .w{cursor:pointer;border-radius:5px;padding:0 1px}
  .w.masked{background:transparent}
  .w:active{background:var(--lamp-soft)}
  .tr{font-family:var(--font-ui);font-size:.85rem;color:var(--muted);margin:5px 6px 0;line-height:1.45}
  .turn.you .tr{text-align:right}
  .speaking{color:var(--lamp)!important}
  .turn.playing .bubble{box-shadow:0 0 0 2px var(--lamp);border-color:var(--lamp)}

  .foot{text-align:center;color:var(--muted);font-size:.74rem;margin-top:22px;line-height:1.7}
  .playbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:10px;justify-content:center;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--bg) 70%,transparent);
    border-top:1px solid var(--line);backdrop-filter:blur(6px)}
  .playbar .btn{flex:1;max-width:180px;padding:12px 10px;background:var(--surface2)}
  .playbar .btn.primary{background:var(--lamp);border-color:var(--lamp);color:#1a1408;font-weight:600}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  :focus-visible{outline:2px solid var(--lamp);outline-offset:2px;border-radius:6px}
</style>
</head>
<body>
<div class="wrap">

  <!-- LIST -->
  <section id="listView">
    <header>
      <div class="eyebrow">B1 · Dialogi ustne</div>
      <h1>Ćwicz rolę <em>— dialog po dialogu</em></h1>
      <div class="sub">Wybierz scenariusz, wybierz swoją rolę i mów z pamięci.</div>
    </header>
    <div id="dlgList"></div>
  </section>

  <!-- PRACTICE -->
  <section id="practiceView" class="hide">
    <header style="padding-bottom:0">
      <div class="pbar">
        <button class="btn" id="backBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div class="topic" id="curTopic">—</div>
      </div>
    </header>

    <div class="rolepick">
      <div class="lbl">Ćwiczę rolę (jej kwestie będą zakryte)</div>
      <div class="roles" id="roleBtns"></div>
      <div class="rolehint" id="roleHint"></div>
    </div>

    <div class="toolbar">
      <button class="btn" id="revealAll">Pokaż moje</button>
      <button class="btn" id="hideAll">Ukryj moje</button>
      <button class="btn" id="trBtn">Tłumaczenie</button>
      <div class="spacer"></div>
      <div class="progress">
        <div class="ring"><svg width="44" height="44" viewBox="0 0 52 52"><circle class="track" cx="26" cy="26" r="22" fill="none" stroke-width="4"></circle><circle id="ringFill" class="fill" cx="26" cy="26" r="22" fill="none" stroke-width="4" stroke-dasharray="138.2" stroke-dashoffset="138.2"></circle></svg><div class="count"><span id="ringN">0</span>/<span id="ringT">0</span></div></div>
      </div>
    </div>

    <div class="speedbar">
      <span class="speedlbl">Tempo</span>
      <input type="range" id="rate" min="0.5" max="1.5" step="0.1" value="0.9" aria-label="Tempo czytania">
      <span class="rateval" id="rateVal">0,9×</span>
    </div>

    <div class="chat" id="chat"></div>
    <div class="foot">Dotknij słowo → odkryj je · dotknij nazwy roli → cała kwestia · 🔊 słuchaj · ✓ umiem.</div>

    <div class="playbar">
      <button class="btn" id="playAll"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Odtwórz</button>
      <button class="btn" id="pauseBtn" title="Pauza"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>Pauza</button>
      <button class="btn" id="stopBtn" title="Zatrzymaj"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg>Stop</button>
    </div>
  </section>
</div>

<script>
const DIALOGS = [{"topic": "Pani/Pana koleżanka zaprosiła Panią/Pana na trzy dni do Krakowa. Proszę porozmawiać z nią o przyjeździe -- proszę zapytać, gdzie będzie Pani/Pan nocować i jeść oraz co będziecie robić w Krakowie.", "turns": [{"role": "Ty", "pl": "Cześć! Dziękuję za zaproszenie do Krakowa. Bardzo się cieszę.", "tr": "Merhaba! Kraków'a davet için teşekkür ederim. Çok sevindim."}, {"role": "Koleżanka", "pl": "Ja też się cieszę, że przyjedziesz.", "tr": "Ben de senin geleceğine çok seviniyorum."}, {"role": "Ty", "pl": "Powiedz, proszę, gdzie będę spać?", "tr": "Söyler misin, nerede kalacağım?"}, {"role": "Koleżanka", "pl": "Będziesz spać u mnie w domu. Mam wolny pokój dla Ciebie.", "tr": "Benim evimde kalacaksın. Senin için boş bir odam var."}, {"role": "Ty", "pl": "Super! A gdzie będziemy jeść?", "tr": "Harika! Peki nerede yemek yiyeceğiz?"}, {"role": "Koleżanka", "pl": "Czasami zjemy u mnie w domu. Ale pójdziemy też do restauracji. Chcę, żebyś spróbował pierogów i barszczu.", "tr": "Bazen benim evimde yiyeceğiz. Ama restorana da gideceğiz. Senin pierogi ve barszcz tatmanı istiyorum."}, {"role": "Ty", "pl": "Bardzo dobrze, lubię polskie jedzenie. A co będziemy robić w Krakowie?", "tr": "Çok güzel, ben Leh yemeklerini seviyorum. Peki Kraków'da ne yapacağız?"}, {"role": "Koleżanka", "pl": "Pójdziemy na Rynek Główny i na Wawel. Zobaczymy też kościół Mariacki.", "tr": "Ana Meydan'a ve Wawel'e gideceğiz. Mariacki Kilisesi'ni de göreceğiz."}, {"role": "Ty", "pl": "A może pójdziemy na spacer po Kazimierzu?", "tr": "Belki Kazimierz'de yürüyüş yaparız?"}, {"role": "Koleżanka", "pl": "Tak, w sobotę wieczorem pójdziemy tam. Jest tam dużo kawiarni i restauracji.", "tr": "Evet, cumartesi akşamı oraya gideceğiz. Orada çok kafe ve restoran var."}, {"role": "Ty", "pl": "A jak długo będę w Krakowie?", "tr": "Kraków'da ne kadar kalacağım?"}, {"role": "Koleżanka", "pl": "Będziesz trzy dni, od piątku do niedzieli.", "tr": "Üç gün kalacaksın, cuma'dan pazar'a kadar."}, {"role": "Ty", "pl": "A jak będziemy się poruszać po mieście -- pieszo czy autobusem?", "tr": "Şehirde nasıl dolaşacağız -- yürüyerek mi yoksa otobüsle mi?"}, {"role": "Koleżanka", "pl": "Głównie pieszo, ale czasami możemy jechać tramwajem.", "tr": "Genelde yürüyerek, ama bazen tramvayla gidebiliriz."}, {"role": "Ty", "pl": "Czy odwiedzimy też jakieś muzea albo galerie sztuki?", "tr": "Müzelere ya da sanat galerilerine de gidecek miyiz?"}, {"role": "Koleżanka", "pl": "Tak, w sobotę pójdziemy do Muzeum Narodowego.", "tr": "Evet, cumartesi günü Ulusal Müze'ye gideceğiz."}, {"role": "Ty", "pl": "A gdzie będę mógł kupić pamiątki?", "tr": "Hediyelik eşyaları nereden alabilirim?"}, {"role": "Koleżanka", "pl": "Na Rynku jest dużo sklepów z pamiątkami. Możesz tam kupić coś dla rodziny.", "tr": "Meydanda birçok hediyelik eşya dükkânı var. Oradan ailene bir şeyler alabilirsin."}, {"role": "Ty", "pl": "Czy będziemy mieć czas na zakupy w centrum handlowym?", "tr": "Alışveriş merkezine gitmeye vaktimiz olacak mı?"}, {"role": "Koleżanka", "pl": "Tak, w niedzielę rano pójdziemy do galerii handlowej.", "tr": "Evet, pazar sabahı alışveriş merkezine gideceğiz."}, {"role": "Ty", "pl": "A co robimy wieczorem?", "tr": "Peki akşamları ne yapacağız?"}, {"role": "Koleżanka", "pl": "Możemy iść do kina albo na koncert, jeśli chcesz.", "tr": "İstersen sinemaya ya da konsere gidebiliriz."}, {"role": "Ty", "pl": "Świetnie! To będą bardzo ciekawe trzy dni.", "tr": "Harika! Bu çok ilginç üç gün olacak."}, {"role": "Koleżanka", "pl": "Tak, na pewno będzie fajnie!", "tr": "Evet, kesinlikle güzel olacak!"}], "roles": ["Ty", "Koleżanka"]}, {"topic": "Boli Panią/Pana ząb. Proszę zadzwonić do gabinetu dentystycznego DentalMed, zapytać o terminy i ceny usług oraz umówić się na wizytę.", "turns": [{"role": "Pacjent", "pl": "Dzień dobry, nazywam się Anna Kowalska. Dzwonię, bo boli mnie ząb i chciałabym umówić się na wizytę.", "tr": "Günaydın, benim adım Anna Kowalska. Arıyorum çünkü dişim ağrıyor ve randevu almak istiyorum."}, {"role": "Recepcjonistka", "pl": "Dzień dobry. Rozumiem. Kiedy chciałaby Pani przyjść?", "tr": "Günaydın. Anladım. Ne zaman gelmek istersiniz?"}, {"role": "Pacjent", "pl": "Chciałabym jak najszybciej. Jakie są wolne terminy w tym tygodniu?", "tr": "En kısa zamanda. Bu hafta boş günleriniz var mı?"}, {"role": "Recepcjonistka", "pl": "Mamy termin jutro o 14:00, w czwartek o 9:00 i w piątek o 16:00.", "tr": "Yarın 14:00'te, perşembe 9:00'da ve cuma 16:00'da yerimiz var."}, {"role": "Pacjent", "pl": "A czy mogę przyjść w sobotę?", "tr": "Cumartesi gelebilir miyim?"}, {"role": "Recepcjonistka", "pl": "Niestety, w soboty gabinet jest zamknięty.", "tr": "Maalesef, cumartesi günleri kapalıyız."}, {"role": "Pacjent", "pl": "Rozumiem. A czy przyjmujecie pacjentów bez rejestracji?", "tr": "Anladım. Kayıtsız hasta kabul ediyor musunuz?"}, {"role": "Recepcjonistka", "pl": "Czasami tak, ale lepiej wcześniej zadzwonić i się zapisać.", "tr": "Bazen evet, ama önceden arayıp kayıt yaptırmak daha iyi."}, {"role": "Pacjent", "pl": "Dobrze. Proszę mi jeszcze powiedzieć, kto będzie mnie leczył?", "tr": "Peki, bana lütfen söyleyin, beni kim tedavi edecek?"}, {"role": "Recepcjonistka", "pl": "Będzie Panią leczył doktor Nowak, nasz doświadczony dentysta.", "tr": "Doktor Nowak, deneyimli diş hekimimiz, sizi tedavi edecek."}, {"role": "Pacjent", "pl": "A czy dentysta mówi po angielsku?", "tr": "Peki doktor İngilizce konuşuyor mu?"}, {"role": "Recepcjonistka", "pl": "Tak, doktor Nowak zna angielski na poziomie komunikatywnym.", "tr": "Evet, doktor Nowak iletişim kuracak kadar İngilizce biliyor."}, {"role": "Pacjent", "pl": "Bardzo dobrze. A jak długo trwa wizyta?", "tr": "Çok iyi. Muayene ne kadar sürüyor?"}, {"role": "Recepcjonistka", "pl": "Zazwyczaj około 30 minut.", "tr": "Genellikle yaklaşık 30 dakika."}, {"role": "Pacjent", "pl": "Czy będzie potrzebne zdjęcie rentgenowskie?", "tr": "Röntgen çekilecek mi?"}, {"role": "Recepcjonistka", "pl": "To zależy od sytuacji, ale często robimy takie zdjęcie.", "tr": "Duruma bağlı, ama genellikle çekiyoruz."}, {"role": "Pacjent", "pl": "Ile kosztuje wizyta i leczenie zęba?", "tr": "Muayene ve tedavi fiyatı ne kadar?"}, {"role": "Recepcjonistka", "pl": "Wizyta kontrolna kosztuje 150 zł. Leczenie od 200 zł, a leczenie kanałowe od 400 zł.", "tr": "Muayene 150 zł, tedavi 200 zł'den başlıyor, kanal tedavisi ise 400 zł'den."}, {"role": "Pacjent", "pl": "Rozumiem. Czy mogę płacić kartą?", "tr": "Anladım. Kartla ödeme yapabilir miyim?"}, {"role": "Recepcjonistka", "pl": "Tak, można płacić gotówką i kartą.", "tr": "Evet, nakit ve kart kabul ediyoruz."}, {"role": "Pacjent", "pl": "A jeśli nie będę mogła przyjść, czy mogę przełożyć wizytę?", "tr": "Peki gelemezsem randevuyu erteleyebilir miyim?"}, {"role": "Recepcjonistka", "pl": "Tak, proszę tylko zadzwonić dzień wcześniej.", "tr": "Evet, sadece bir gün önce aramanız yeterli."}, {"role": "Pacjent", "pl": "Dobrze. Czy dostanę potwierdzenie wizyty SMS-em?", "tr": "Peki randevu teyidini SMS ile alabilir miyim?"}, {"role": "Recepcjonistka", "pl": "Tak, wysyłamy SMS dzień przed wizytą.", "tr": "Evet, bir gün önce SMS gönderiyoruz."}, {"role": "Pacjent", "pl": "Świetnie. W takim razie proszę zapisać mnie na piątek o 16:00.", "tr": "Harika. O zaman beni cuma günü 16:00'ya yazın lütfen."}, {"role": "Recepcjonistka", "pl": "Dobrze, zapisałam Panią. Proszę przyjść 10 minut wcześniej.", "tr": "Tamamdır, kaydınızı yaptım. Lütfen 10 dakika erken gelin."}, {"role": "Pacjent", "pl": "Bardzo dziękuję za pomoc. Do zobaczenia w piątek.", "tr": "Çok teşekkür ederim. Cuma görüşmek üzere."}, {"role": "Recepcjonistka", "pl": "Do zobaczenia, życzę miłego dnia!", "tr": "Görüşmek üzere, iyi günler dilerim!"}], "roles": ["Pacjent", "Recepcjonistka"]}, {"topic": "Pani/Pana koleżanka była na urlopie za granica. proszę zapytać o miejsce i termin pobytu oraz o to, jak spędziła urlop i co robiła.", "turns": [{"role": "Anna", "pl": "Cześć Marta! Słyszałam, że byłaś na urlopie za granicą.", "tr": "Merhaba Marta! Duydum ki yurt dışında tatildeydin."}, {"role": "Marta", "pl": "Cześć Anna! Tak, byłam w Hiszpanii.", "tr": "Merhaba Anna! Evet, İspanya'daydım."}, {"role": "Anna", "pl": "Super! Kiedy wyjechałaś i jak długo tam byłaś?", "tr": "Harika! Ne zaman gittin ve ne kadar kaldın?"}, {"role": "Marta", "pl": "Wyjechałam dwa tygodnie temu i byłam tam dziesięć dni.", "tr": "İki hafta önce gittim ve orada on gün kaldım."}, {"role": "Anna", "pl": "A gdzie dokładnie byłaś w Hiszpanii?", "tr": "Peki, İspanya'nın neresindeydin tam tam olarak?"}, {"role": "Marta", "pl": "Byłam w Barcelonie i trochę w okolicznych miasteczkach.", "tr": "Barselona'daydım ve biraz da çevredeki küçük kasabalarda."}, {"role": "Anna", "pl": "Brzmi wspaniale! Jak spędzałaś czas na urlopie?", "tr": "Harika görünüyor! Tatilde zamanını nasıl geçirdin?"}, {"role": "Marta", "pl": "Zwiedzałam zabytki, chodziłam na plażę i jadłam lokalne jedzenie.", "tr": "Tarihi yerleri gezdim, plaja gittim ve yerel yemekler yedim."}, {"role": "Anna", "pl": "Czy robiłaś też jakieś zakupy lub prezenty dla rodziny?", "tr": "Ailen için alışveriş veya hediyeler de yaptın mı?"}, {"role": "Marta", "pl": "Tak, kupiłam trochę pamiątek dla mojej rodziny i przyjaciół.", "tr": "Evet, ailem ve arkadaşlarım için birkaç hatıra aldım."}, {"role": "Anna", "pl": "Co kupiłaś dokładnie?", "tr": "Tam olarak ne aldın?"}, {"role": "Marta", "pl": "Kupiłam magnesy, pocztówki, trochę słodyczy i ręcznie robione ubrania.", "tr": "Mıknatıslar, kartpostallar, biraz şeker ve el yapımı kıyafetler aldım."}, {"role": "Anna", "pl": "Super! A ludzie w Hiszpanii byli przyjaźni?", "tr": "Harika! Peki İspanya'daki insanlar dostoydu mu?"}, {"role": "Marta", "pl": "Tak, bardzo mili i pomocni. Wszyscy byli uśmiechnięci.", "tr": "Evet, çok nazik ve yardımseverlerdi. Herkes güleryüzlüydü."}, {"role": "Anna", "pl": "A jak było z pogodą?", "tr": "Peki hava nasıldı?"}, {"role": "Marta", "pl": "Pogoda była piękna, słońce świeciło prawie codziennie. Tylko jeden dzień padał deszcz.", "tr": "Hava harikaydı, neredeyse her gün güneş vardı. Sadece bir gün yağmur yağdı."}, {"role": "Anna", "pl": "Fantastycznie! A co robiłaś wieczorami?", "tr": "Harika! Akşamları ne yapıyordun?"}, {"role": "Marta", "pl": "Chodziłam na spacery po mieście, oglądałam zachody słońca i czasem chodziłam do małych restauracji.", "tr": "Şehirde yürüyüşe çıkıyordum, gün batımlarını izliyordum ve bazen küçük restoranlara gidiyordum."}, {"role": "Anna", "pl": "Czy próbowałaś typowego hiszpańskiego jedzenia?", "tr": "Tipik İspanyol yemeklerini denedin mi?"}, {"role": "Marta", "pl": "Tak, jadłam paellę, tapas i churros. Wszystko było pyszne!", "tr": "Evet, paella, tapas ve churros yedim. Hepsi çok lezzetliydi!"}, {"role": "Anna", "pl": "To musiał być bardzo miły urlop!", "tr": "O zaman çok güzel bir tatil olmalıydı!"}, {"role": "Marta", "pl": "Tak, naprawdę odpoczęłam i miałam dużo zabawy.", "tr": "Evet, gerçekten dinlendim ve çok eğlendim."}, {"role": "Anna", "pl": "Cieszę się! Może w przyszłym roku też pojadę do Hiszpanii.", "tr": "Sevindim! Belki gelecek yıl ben de İspanya'ya giderim."}, {"role": "Marta", "pl": "Powinnaś! Naprawdę warto tam pojechać.", "tr": "Gitmelisin! Gerçekten gitmeye değer."}], "roles": ["Anna", "Marta"]}, {"topic": "Pani/pana koleżanka planuje przeprowadzkę za granice, ale trochę się jej boi. Pyta ja pani/pana o powód decyzji i zachęca do wyjazdu.", "turns": [{"role": "Anna", "pl": "Cześć Marta! Słyszałam, że planujesz przeprowadzkę za granicę.", "tr": "Merhaba Marta! Duydum ki yurt dışına taşınmayı planlıyorsun."}, {"role": "Marta", "pl": "Tak, ale trochę się boję. Nie wiem, czy to dobry pomysł.", "tr": "Evet, ama biraz korkuyorum. Bilmiyorum, bu iyi bir fikir mi."}, {"role": "Anna", "pl": "Rozumiem. A dlaczego zdecydowałaś się wyjechać?", "tr": "Anlıyorum. Peki, neden gitmeye karar verdin?"}, {"role": "Marta", "pl": "Chcę znaleźć lepszą pracę i poznać nowych ludzi. Ale martwię się, czy sobie poradzę w nowym kraju.", "tr": "Daha iyi bir iş bulmak ve yeni insanlarla tanışmak istiyorum. Ama yeni ülkede başarılı olabilir miyim diye endişeliyim."}, {"role": "Anna", "pl": "Na pewno dasz sobie radę! Masz dużo umiejętności i jesteś odważna.", "tr": "Kesinlikle başaracaksın! Çok yeteneğin var ve cesursun."}, {"role": "Marta", "pl": "Tak, ale myślę o wszystkim: mieszkanie, język, znajomi...", "tr": "Evet, ama her şeyi düşünüyorum: ev, dil, arkadaşlar..."}, {"role": "Anna", "pl": "To normalne, że się boisz. Ale wyjazd może być wspaniałą przygodą. Możesz dużo zobaczyć i poznać ciekawych ludzi.", "tr": "Korkman normaldir. Ama gitmek harika bir macera olabilir. Çok şey görebilir ve ilginç insanlarla tanışabilirsin."}, {"role": "Marta", "pl": "Masz rację... A co jeśli nie znajdę pracy od razu?", "tr": "Haklısın... Peki ya hemen iş bulamazsam?"}, {"role": "Anna", "pl": "Nie martw się. Możesz najpierw zrobić kurs językowy albo pracować na krótszy etat. To pomoże Ci się oswoić z nowym miejscem.", "tr": "Endişelenme. Önce bir dil kursu yapabilir veya kısa süreli bir işte çalışabilirsin. Bu, yeni ortama alışmana yardımcı olur."}, {"role": "Marta", "pl": "To dobry pomysł. A co z mieszkaniem? Ceny są pewnie wysokie...", "tr": "İyi fikir. Peki ya ev? Fiyatlar muhtemelen yüksek..."}, {"role": "Anna", "pl": "Możesz poszukać pokoju do wynajęcia lub mieszkania z kimś. Na początku nie musisz mieć dużego mieszkania.", "tr": "Bir oda ya da birisiyle paylaşımlı bir daire bulabilirsin. Başlangıçta büyük bir daireye ihtiyacın yok."}, {"role": "Marta", "pl": "Dziękuję za rady, Anna. Trochę się uspokoiłam.", "tr": "Tavsiyelerin için teşekkür ederim Anna. Biraz rahatladım."}, {"role": "Anna", "pl": "Cieszę się! Wiesz, że zawsze możesz na mnie liczyć.", "tr": "Sevindim! Biliyorsun, her zaman bana güvenebilirsin."}, {"role": "Marta", "pl": "Tak, to bardzo ważne. A pogoda tam jest pewnie inna niż w Polsce?", "tr": "Evet, bu çok önemli. Peki, oradaki hava muhtemelen Polonya'dan farklıdır değil mi?"}, {"role": "Anna", "pl": "Tak, zwykle jest cieplej i słonecznie. Możesz nawet chodzić na spacery codziennie!", "tr": "Evet, genellikle daha sıcak ve güneşli. Hatta her gün yürüyüşe çıkabilirsin!"}, {"role": "Marta", "pl": "Brzmi pięknie. Chciałabym, żeby wszystko poszło dobrze.", "tr": "Harika görünüyor. Umarım her şey yolunda gider."}, {"role": "Anna", "pl": "Na pewno wszystko się uda. Musisz być odważna i spróbować. To będzie niezapomniane doświadczenie.", "tr": "Kesinlikle her şey yoluna girecek. Cesur olmalı ve denemelisin. Bu unutulmaz bir deneyim olacak."}, {"role": "Marta", "pl": "Dziękuję, Anna. Teraz czuję się pewniej i mam więcej odwagi.", "tr": "Teşekkür ederim Anna. Şimdi daha kendime güveniyorum ve daha cesurum."}, {"role": "Anna", "pl": "Wspaniale! Nie mogę się doczekać, aż opowiesz mi o swoim nowym życiu za granicą.", "tr": "Harika! Yurt dışındaki yeni hayatını bana anlatmanı dört gözle bekliyorum."}], "roles": ["Anna", "Marta"]}, {"topic": "Pani/pana kolega je fast foody i pije kilka kaw dziennie. proszę go przekonać, ze warto zdrowo się odżywiać.", "turns": [{"role": "Anna", "pl": "Cześć Tomek! Słyszałam, że jesz dużo fast foodów i pijesz kilka kaw dziennie.", "tr": "Merhaba Tomek! Duydum ki çok fast food yiyorsun ve günde birkaç kahve içiyorsun."}, {"role": "Tomek", "pl": "Tak, lubię szybkie jedzenie i kawę, bo jestem zajęty w pracy.", "tr": "Evet, hızlı yemekleri ve kahveyi seviyorum çünkü işte meşgulüm."}, {"role": "Anna", "pl": "Rozumiem, ale to nie jest zdrowe. Możesz mieć problemy z sercem i żołądkiem.", "tr": "Anlıyorum, ama bu sağlıklı değil. Kalp ve mide sorunları yaşayabilirsin."}, {"role": "Tomek", "pl": "Wiem, ale czasem nie mam czasu gotować ani przygotować zdrowego jedzenia.", "tr": "Biliyorum, ama bazen yemek yapmak veya sağlıklı yiyecek hazırlamak için zamanım olmuyor."}, {"role": "Anna", "pl": "Możesz jeść zdrowo nawet szybko. Na przykład możesz zrobić sałatkę, kanapki z warzywami albo owoce.", "tr": "Hızlı olsa bile sağlıklı yiyebilirsin. Örneğin salata, sebzeli sandviçler veya meyve yapabilirsin."}, {"role": "Tomek", "pl": "Hmm... to prawda, ale kawa daje mi energię i pomagą skupić się w pracy.", "tr": "Hmm... doğru, ama kahve bana enerji veriyor ve işte odaklanmamı sağlıyor."}, {"role": "Anna", "pl": "Możesz pić mniej kawy i więcej wody. Woda też daje energię i pomaga myśleć lepiej.", "tr": "Daha az kahve içip daha çok su içebilirsin. Su da enerji verir ve daha iyi düşünmene yardımcı olur."}, {"role": "Tomek", "pl": "A fast food... trudno się oprzeć, szczególnie kiedy jestem zmęczony.", "tr": "Fast food... ona direnmek zor, özellikle yorgunken."}, {"role": "Anna", "pl": "Rozumiem, ale spróbuj zamienić fast food na zdrowsze opcje. Na przykład kanapki z warzywami, jogurt lub sałatki.", "tr": "Anlıyorum, ama fast food'u daha sağlıklı seçeneklerle değiştirmeyi dene. Örneğin sebzeli sandviçler, yoğurt veya salatalar."}, {"role": "Tomek", "pl": "Masz rację... może powinienem spróbować. Czasem czuję się po fast foodzie zmęczony i ospały.", "tr": "Haklısın... belki denemeliyim. Bazen fast food yedikten sonra yorgun ve uykulu hissediyorum."}, {"role": "Anna", "pl": "Tak! Zdrowe jedzenie daje więcej energii, a ciało lepiej funkcjonuje. Możesz też planować posiłki z wyprzedzeniem.", "tr": "Evet! Sağlıklı yiyecek daha fazla enerji verir ve vücut daha iyi çalışır. Ayrıca yemekleri önceden planlayabilirsin."}, {"role": "Tomek", "pl": "To dobry pomysł. Może zacznę od małych zmian, na przykład jedna zdrowa przekąska dziennie.", "tr": "İyi fikir. Belki küçük değişikliklerle başlarım, örneğin günde bir sağlıklı atıştırmalık."}, {"role": "Anna", "pl": "Świetnie! Małe zmiany codziennie naprawdę pomagają. Możesz też spróbować przygotować obiady w domu i zabrać je do pracy.", "tr": "Harika! Her gün küçük değişiklikler gerçekten yardımcı olur. Evde öğle yemeği hazırlayıp iş yerine götürebilirsin."}, {"role": "Tomek", "pl": "Tak, to łatwe i na pewno zdrowsze niż fast food.", "tr": "Evet, bu kolay ve kesinlikle fast food'dan daha sağlıklı."}, {"role": "Anna", "pl": "Dokładnie! A jeśli chodzi o kawę, możesz spróbować herbaty zielonej albo wody z cytryną.", "tr": "Kesinlikle! Kahve yerine yeşil çay veya limonlu su deneyebilirsin."}, {"role": "Tomek", "pl": "Dobrze... spróbuję. Dziękuję za rady, Anna. Czuję się bardziej zmotywowany.", "tr": "Tamam... deneyeceğim. Tavsiyelerin için teşekkürler Anna. Daha motive olmuş hissediyorum."}, {"role": "Anna", "pl": "Super! Pamiętaj, że zdrowe nawyki pomagają czuć się lepiej każdego dnia.", "tr": "Harika! Unutma, sağlıklı alışkanlıklar her gün kendini daha iyi hissetmene yardımcı olur."}, {"role": "Tomek", "pl": "Masz rację. Zacznę od małych kroków i zobaczę, jak to działa.", "tr": "Haklısın. Küçük adımlarla başlayacağım ve nasıl gittiğini göreceğim."}], "roles": ["Anna", "Tomek"]}, {"topic": "Chce pani/pan kupić eleganckie ubranie na rozmowę kwalifikacyjną. Proszę porozmawiać ze sprzedawca sklepie odzieżowym, poprosić o rade oraz zapytać o cenę zaproponowanych ubrań.", "turns": [{"role": "Klientka", "pl": "Dzień dobry! Chcę kupić eleganckie ubranie na rozmowę kwalifikacyjną.", "tr": "Merhaba! İş görüşmesi için şık bir kıyafet almak istiyorum."}, {"role": "Sprzedawca", "pl": "Dzień dobry! Oczywiście, mogę Pani pomóc. Czy woli Pani sukienkę, garnitur czy może spodnie z żakietem?", "tr": "Merhaba! Tabii ki, size yardımcı olabilirim. Elbise, takım elbise mi yoksa pantolon ve ceket takımı mı tercih edersiniz?"}, {"role": "Klientka", "pl": "Myślę, że sukienkę. Chcę coś eleganckiego, ale też wygodnego.", "tr": "Sanırım elbise. Hem şık hem de rahat bir şey istiyorum."}, {"role": "Sprzedawca", "pl": "Proszę spojrzeć na tę granatową sukienkę. Jest klasyczna i elegancka.", "tr": "Bu lacivert elbiseye bir bakın lütfen. Klasik ve şık."}, {"role": "Klientka", "pl": "Bardzo ładna! Czy macie też jaśniejsze kolory?", "tr": "Çok güzel! Daha açık renkleri de var mı?"}, {"role": "Sprzedawca", "pl": "Tak, mamy beżową i jasno szarą sukienkę. Obie są eleganckie i pasują na rozmowę kwalifikacyjną.", "tr": "Evet, bej ve açık gri elbiselerimiz var. İkisi de şık ve iş görüşmesi için uygun."}, {"role": "Klientka", "pl": "A jaka jest cena tych sukienek?", "tr": "Peki, bu elbiselerin fiyatı ne kadar?"}, {"role": "Sprzedawca", "pl": "Granatowa kosztuje 250 zł, beżowa 270 zł, a jasno szara 260 zł.", "tr": "Lacivert 250 zł, bej 270 zł ve açık gri 260 zł."}, {"role": "Klientka", "pl": "Rozumiem. Czy są dostępne różne rozmiary?", "tr": "Anladım. Farklı bedenleri mevcut mu?"}, {"role": "Sprzedawca", "pl": "Tak, mamy wszystkie rozmiary od 36 do 42.", "tr": "Evet, 36'dan 42'ye kadar tüm bedenler mevcut."}, {"role": "Klientka", "pl": "A jaki materiał mają te sukienki?", "tr": "Peki, bu elbiseler hangi kumaştan yapılmış?"}, {"role": "Sprzedawca", "pl": "Granatowa jest z bawełny i elastanu, beżowa z lnu, a jasno szara z poliestru.", "tr": "Lacivert pamuk ve elastan, bej keten ve açık gri poliester."}, {"role": "Klientka", "pl": "Hmm... myślę, że granatowa będzie najlepsza. Czy macie też pasujące żakiety?", "tr": "Hmm... Sanırım lacivert en iyisi olacak. Peki, uyumlu ceketleriniz var mı?"}, {"role": "Sprzedawca", "pl": "Tak, mamy czarny żakiet z lekkiego materiału i granatowy, bardziej elegancki. Cena to 150--180 zł.", "tr": "Evet, hafif kumaştan siyah ceket ve daha şık lacivert ceket var. Fiyatları 150--180 zł."}, {"role": "Klientka", "pl": "Dobrze, chciałabym przymierzyć granatową sukienkę i czarny żakiet.", "tr": "Tamam, lacivert elbiseyi ve siyah ceketi denemek istiyorum."}, {"role": "Sprzedawca", "pl": "Oczywiście! Przymierzalnia jest tam z lewej strony.", "tr": "Tabii ki! Kabin orada, sol tarafta."}, {"role": "Klientka", "pl": "Sukienka jest wygodna, ale żakiet trochę za ciasny. Macie większy rozmiar?", "tr": "Elbise rahat ama ceket biraz dar. Daha büyük beden var mı?"}, {"role": "Sprzedawca", "pl": "Tak, mamy większy żakiet. Proszę spróbować tego rozmiaru.", "tr": "Evet, daha büyük bir ceketimiz var. Bu bedeni deneyin lütfen."}, {"role": "Klientka", "pl": "Idealnie! A jakie buty będą pasować do sukienki?", "tr": "Mükemmel! Peki, elbiseye hangi ayakkabılar uyum sağlar?"}, {"role": "Sprzedawca", "pl": "Polecam czarne lub granatowe czółenka. Są eleganckie i pasują do każdej sukienki.", "tr": "Siyah veya lacivert topuklu ayakkabıları öneririm. Şık ve her elbiseye uyar."}, {"role": "Klientka", "pl": "Dobrze, wezmę sukienkę, czarny żakiet i czarne buty.", "tr": "Tamam, elbise, siyah ceket ve siyah ayakkabıları alacağım."}, {"role": "Sprzedawca", "pl": "Świetnie! Wszystko razem kosztuje 580 zł.", "tr": "Harika! Hepsi birlikte 580 zł."}, {"role": "Klientka", "pl": "Dziękuję! Mam nadzieję, że w tym ubraniu dobrze wypadnę na rozmowie kwalifikacyjnej.", "tr": "Teşekkürler! Umarım bu kıyafetle iş görüşmesinde iyi görünürüm."}, {"role": "Sprzedawca", "pl": "Na pewno tak! Powodzenia na rozmowie!", "tr": "Kesinlikle! İş görüşmesinde başarılar!"}], "roles": ["Klientka", "Sprzedawca"]}, {"topic": "Jest pani/pan świadkiem wypadku drogowego. Proszę zadzwonić na policje i przekazać informacje o miejscu i czasie zdarzenia oraz opisać, co się stało.", "turns": [{"role": "Anna", "pl": "Dzień dobry! Chciałabym zgłosić wypadek drogowy.", "tr": "Merhaba! Bir trafik kazası bildirmek istiyorum."}, {"role": "Policjant", "pl": "Oczywiście. Gdzie się to stało?", "tr": "Tabii. Nerede oldu?"}, {"role": "Anna", "pl": "Na ulicy Krakowskiej, przy skrzyżowaniu z ulicą Słoneczną.", "tr": "Krakowska Caddesi'nde, Słoneczna Caddesi ile kesiştiği yerde."}, {"role": "Policjant", "pl": "Kiedy to się wydarzyło?", "tr": "Ne zaman oldu?"}, {"role": "Anna", "pl": "Kilka minut temu, około godziny 15:30.", "tr": "Birkaç dakika önce, yaklaşık 15:30 civarında."}, {"role": "Policjant", "pl": "Rozumiem. Co dokładnie się stało?", "tr": "Anladım. Tam olarak ne oldu?"}, {"role": "Anna", "pl": "Samochód osobowy uderzył w rowerzystę. Rowerzysta upadł na ziemię.", "tr": "Bir otomobil bisikletliye çarptı. Bisikletli yere düştü."}, {"role": "Policjant", "pl": "Czy ktoś jest ranny?", "tr": "Birisi yaralandı mı?"}, {"role": "Anna", "pl": "Tak, rowerzysta ma siniaki i skarży się na ból nogi. Kierowca samochodu wysiadł i stoi obok pojazdu.", "tr": "Evet, bisikletli morarmış ve bacağını ağrıyor. Otomobil sürücüsü indi ve aracın yanında duruyor."}, {"role": "Policjant", "pl": "Czy są świadkowie?", "tr": "Tanıklar var mı?"}, {"role": "Anna", "pl": "Tak, ja jestem świadkiem, a kilka osób zatrzymało się i patrzy.", "tr": "Evet, ben bir tanığım ve birkaç kişi durup bakıyor."}, {"role": "Policjant", "pl": "Czy pojazdy blokują drogę?", "tr": "Araçlar yolu kapatıyor mu?"}, {"role": "Anna", "pl": "Tak, samochód stoi w połowie ulicy, rower leży obok.", "tr": "Evet, otomobil caddenin ortasında duruyor, bisiklet yanında yatıyor."}, {"role": "Policjant", "pl": "Dobrze, wysyłamy patrol na miejsce. Proszę czekać na ulicy Krakowskiej.", "tr": "Tamam, ekibi olay yerine gönderiyoruz. Krakowska Caddesi'nde bekleyin lütfen."}, {"role": "Anna", "pl": "Dziękuję. Czy mogę jeszcze coś zrobić?", "tr": "Teşekkürler. Başka bir şey yapabilir miyim?"}, {"role": "Policjant", "pl": "Proszę tylko pozostać na miejscu i nie przesuwać rowerzysty ani samochodu. Policja wszystko załatwi.", "tr": "Sadece olay yerinde kalın ve bisikletliyi veya otomobili taşımayın. Polis her şeyi halledecek."}, {"role": "Anna", "pl": "Rozumiem. Będę czekać.", "tr": "Anladım. Bekleyeceğim."}, {"role": "Policjant", "pl": "Dziękujemy za zgłoszenie. Patrol będzie za kilka minut.", "tr": "Bildiriminiz için teşekkürler. Ekip birkaç dakika içinde gelecek."}, {"role": "Anna", "pl": "Dziękuję bardzo.", "tr": "Çok teşekkür ederim."}], "roles": ["Anna", "Policjant"]}, {"topic": "Wybiera się pani/pan z rodzina do restauracji Smacznego z okazji urodzin córki. Proszę zadzwonić do lokalu, zapytać o ceny, ustalić menu oraz zarezerwować stolik.", "turns": [{"role": "Anna", "pl": "Dzień dobry! Chciałabym zarezerwować stolik na urodziny mojej córki.", "tr": "Merhaba! Kızımın doğum günü için bir masa ayırtmak istiyorum."}, {"role": "Kelner", "pl": "Oczywiście! Na kiedy i o której godzinie?", "tr": "Tabii! Ne zaman ve saat kaçta?"}, {"role": "Anna", "pl": "Na sobotę, o godzinie 18:00. Będziemy w sumie cztery osoby -- ja, mąż, córka i syn.", "tr": "00'de. Toplam dört kişiyiz -- ben, eşim, kızım ve oğlum."}, {"role": "Kelner", "pl": "Dobrze. Czy chcą Państwo zamówić menu z góry, czy wybiorą Państwo w restauracji?", "tr": "Tamam. Menü önceden sipariş etmek ister misiniz, yoksa restoranda mı seçeceksiniz?"}, {"role": "Anna", "pl": "Chciałabym zapytać o ceny i propozycje menu, proszę.", "tr": "Fiyatları ve menü önerilerini sormak istiyorum, lütfen."}, {"role": "Kelner", "pl": "Oczywiście. Przystawki kosztują od 15 do 25 zł, dania główne od 30 do 50 zł, a desery około 20 zł.", "tr": "Tabii. Başlangıçlar 15--25 zł, ana yemekler 30--50 zł, tatlılar ise yaklaşık 20 zł."}, {"role": "Anna", "pl": "Dobrze. Może trzy dania główne: kurczak z ryżem, ryba z ziemniakami i spaghetti. I dwa desery: lody i ciasto czekoladowe.", "tr": "Tamam. Belki üç ana yemek: pilavlı tavuk, patatesli balık ve spagetti. Ve iki tatlı: dondurma ve çikolatalı kek."}, {"role": "Kelner", "pl": "Doskonale. Czy chcą Państwo również napoje?", "tr": "Harika. İçecekler de ister misiniz?"}, {"role": "Anna", "pl": "Tak, proszę wodę mineralną, sok pomarańczowy i herbatę dla dzieci.", "tr": "Evet, lütfen maden suyu, portakal suyu ve çocuklar için çay."}, {"role": "Anna", "pl": "Czy mają Państwo stolik przy oknie?", "tr": "Pencere kenarında masa var mı?"}, {"role": "Kelner", "pl": "Tak, mamy wolny stolik przy oknie.", "tr": "Evet, pencere kenarında boş masa var."}, {"role": "Anna", "pl": "Czy przygotowują Państwo tort urodzinowy?", "tr": "Doğum günü pastası hazırlıyor musunuz?"}, {"role": "Kelner", "pl": "Tak, możemy przygotować tort i dekoracje na stół.", "tr": "Evet, pastayı ve masa dekorlarını hazırlayabiliriz."}, {"role": "Anna", "pl": "A czy możemy przynieść własny tort? I czy możecie go Państwo podać?", "tr": "Peki, kendi pastamızı getirebilir miyiz? Ve servis yapabilir misiniz?"}, {"role": "Kelner", "pl": "Tak, oczywiście. Możecie przynieść swój tort, a my przygotujemy serwis na stół.", "tr": "Evet, tabii ki. Kendi pastanızı getirebilirsiniz ve biz masada servis yaparız."}, {"role": "Anna", "pl": "A czy musimy zapłacić wcześniej? Czy wymagana jest zaliczka?", "tr": "Peki, önceden ödeme yapmamız gerekiyor mu? Kapora vermemiz gerekli mi?"}, {"role": "Kelner", "pl": "Nie, płatność będzie przy stoliku w dniu przyjęcia. Zaliczka nie jest wymagana.", "tr": "Hayır, ödeme doğum günü günü masada yapılacak. Kapora gerekli değil."}, {"role": "Anna", "pl": "Fantastycznie! Dziękuję bardzo za pomoc.", "tr": "Harika! Yardımınız için çok teşekkürler."}, {"role": "Kelner", "pl": "Proszę bardzo! Stolik będzie gotowy w sobotę o 18:00. Do zobaczenia!", "tr": "Bir şey değil! Masa Cumartesi saat 18:00'de hazır olacak. Görüşürüz!"}, {"role": "Anna", "pl": "Do widzenia!", "tr": "Görüşürüz!"}], "roles": ["Anna", "Kelner"]}, {"topic": "Pani/pana koleżanka żali się, że wydaje za dużo pieniędzy i nie umie oszczędzać. proszę jej doradzić, jak lepiej kontrolować wydatki.", "turns": [{"role": "Kasia", "pl": "Cześć Anna... Wydaję za dużo pieniędzy i nie potrafię oszczędzać.", "tr": "Merhaba Anna... Çok para harcıyorum ve tasarruf edemiyorum."}, {"role": "Anna", "pl": "Spróbuj robić listę zakupów przed pójściem do sklepu!", "tr": "Mağazaya gitmeden önce alışveriş listesi yapmayı dene!"}, {"role": "Kasia", "pl": "Hmm... To dobry pomysł, ale czy naprawdę pomoże?", "tr": "Hımm... İyi fikir, ama gerçekten işe yarar mı?"}, {"role": "Anna", "pl": "Tak, lista pomaga kupować tylko to, co potrzebne. Nie kupuj rzeczy impulsywnie.", "tr": "Evet, liste sadece gerekli olanları almana yardımcı olur. Anlık isteklerle alışveriş yapma."}, {"role": "Kasia", "pl": "A co z drobnymi zakupami, jak kawa i słodycze?", "tr": "Peki ya küçük alışverişler, kahve ve tatlılar gibi?"}, {"role": "Anna", "pl": "Zapisuj też te wydatki i ustal limit tygodniowy.", "tr": "Bu harcamaları da yaz ve haftalık bir limit belirle."}, {"role": "Kasia", "pl": "Dobrze... A co z kartami kredytowymi?", "tr": "Tamam... Peki kredi kartlarıyla ne yapmalı?"}, {"role": "Anna", "pl": "Lepiej używaj gotówki zamiast karty. Trudniej kontrolować wydatki, gdy płacisz kartą.", "tr": "Kart yerine nakit kullan. Kartla ödeme yaptığında harcamaları kontrol etmek zor oluyor."}, {"role": "Kasia", "pl": "Czy mogę używać aplikacji do śledzenia wydatków?", "tr": "Harcamaları takip etmek için uygulama kullanabilir miyim?"}, {"role": "Anna", "pl": "Tak, to bardzo dobre! Wprowadzaj wszystkie zakupy i sprawdzaj budżet codziennie.", "tr": "Evet, bu çok iyi! Tüm alışverişlerini gir ve bütçeni her gün kontrol et."}, {"role": "Kasia", "pl": "A co z nagłymi wydatkami?", "tr": "Peki ya ani bir harcama gerekiyorsa?"}, {"role": "Anna", "pl": "Najpierw poczekaj jeden dzień i przemyśl, czy naprawdę potrzebujesz tej rzeczy.", "tr": "Önce bir gün bekle ve gerçekten buna ihtiyacın olup olmadığını düşün."}, {"role": "Kasia", "pl": "Masz rację... A co jeszcze mogę zrobić, żeby oszczędzać?", "tr": "Haklısın... Tasarruf etmek için başka ne yapabilirim?"}, {"role": "Anna", "pl": "Możesz odkładać trochę pieniędzy co tydzień i sprawdzać, ile zaoszczędziłaś.", "tr": "Her hafta biraz para biriktir ve ne kadar tasarruf ettiğini kontrol et."}, {"role": "Kasia", "pl": "Dziękuję za wszystkie rady, Anna! Czuję się teraz pewniej.", "tr": "Tüm tavsiyelerin için teşekkürler Anna! Şimdi kendime daha çok güveniyorum."}, {"role": "Anna", "pl": "Super! Pamiętaj, że oszczędzanie to małe kroki każdego dnia.", "tr": "Harika! Unutma, tasarruf küçük adımlarla yapılır."}], "roles": ["Kasia", "Anna"]}, {"topic": "Chce Pani/Pan pojechać z dziećmi do zoo. Proszę zadzwonić do ogrodu zoologicznego we Wrocławiu, zapytać o ceny biletów i godziny otwarcia oraz dodatkowe atrakcje.", "turns": [{"role": "Anna", "pl": "Dzień dobry! Chciałabym przyjechać do zoo z moimi dziećmi. Chcę zapytać o ceny biletów i godziny otwarcia.", "tr": "Merhaba! Çocuklarımla hayvanat bahçesine gelmek istiyorum. Bilet fiyatlarını ve açılış saatlerini sormak istiyorum."}, {"role": "Pracownik", "pl": "Dzień dobry! Bilet normalny kosztuje 40 zł, ulgowy dla dzieci i seniorów 25 zł. Zoo jest otwarte codziennie od 9:00 do 18:00.", "tr": "Merhaba! Normal bilet 40 zł, çocuklar ve yaşlılar için indirimli bilet 25 zł. Hayvanat bahçesi her gün 09:00--18:00 arası açık."}, {"role": "Anna", "pl": "Dziękuję. A czy są dodatkowe atrakcje dla dzieci?", "tr": "Teşekkürler. Peki, çocuklar için ekstra aktiviteler var mı?"}, {"role": "Pracownik", "pl": "Tak, mamy plac zabaw, karmienie zwierząt o godzinie 11:00 i 15:00 oraz mini zoo.", "tr": "Evet, oyun alanı, saat 11:00 ve 15:00'te hayvanları besleme ve mini hayvanat bahçesi var."}, {"role": "Anna", "pl": "Super! Czy można kupić bilety online?", "tr": "Harika! Biletleri online alabilir miyiz?"}, {"role": "Pracownik", "pl": "Tak, na naszej stronie internetowej można kupić bilety i wybrać godzinę wejścia.", "tr": "Evet, internet sitemizden bilet alabilir ve giriş saatini seçebilirsiniz."}, {"role": "Anna", "pl": "A czy w zoo są restauracje lub miejsca, gdzie można coś zjeść?", "tr": "Peki, hayvanat bahçesinde restoran veya bir şeyler yiyebileceğimiz yerler var mı?"}, {"role": "Pracownik", "pl": "Tak, mamy kawiarnię i kilka punktów z przekąskami.", "tr": "Evet, bir kafe ve birkaç atıştırmalık noktası var."}, {"role": "Anna", "pl": "Dobrze. A czy można przyprowadzić własny prowiant?", "tr": "Peki. Kendi yiyeceklerimizi getirebilir miyiz?"}, {"role": "Pracownik", "pl": "Tak, można, ale prosimy o nie karmienie zwierząt własnym jedzeniem.", "tr": "Evet, getirebilirsiniz ama hayvanları kendi yiyeceğinizle beslemeyin lütfen."}, {"role": "Anna", "pl": "Rozumiem. Czy są też przewodnicy, którzy oprowadzają po zoo?", "tr": "Anladım. Rehberler eşliğinde tur da var mı?"}, {"role": "Pracownik", "pl": "Tak, codziennie o godzinie 10:00 i 14:00 są wycieczki z przewodnikiem.", lecek birkaç tavsiyem var."}, {"role": "Koleżanka", "pl": "Naprawdę? Jakie?", "tr": "Gerçekten mi? Hangileri?"}, {"role": "Ty", "pl": "Po pierwsze, dobrze się wyśpij dzisiaj. Kiedy jesteś wypoczęta, lepiej myślisz na egzaminie.", "tr": "Öncelikle, bugün iyi uyu. Dinlenmiş olursan sınavda daha iyi düşünebilirsin."}, {"role": "Koleżanka", "pl": "Tak, postaram się. A co jeszcze?", "tr": "Evet, deneyeceğim. Başka ne yapabilirim?"}, {"role": "Ty", "pl": "Po drugie, zrób krótką powtórkę materiału. Nie ucz się za długo, tylko najważniejsze rzeczy.", "tr": "İkincisi, kısa bir tekrar yap. Çok uzun çalışma, sadece en önemli şeyleri tekrar et."}, {"role": "Koleżanka", "pl": "Dobrze, mogę tak zrobić.", "tr": "Tamam, bunu yapabilirim."}, {"role": "Ty", "pl": "Po trzecie, spróbuj kilka ćwiczeń oddechowych, kiedy poczujesz stres. Głęboki wdech i powolny wydech pomaga się uspokoić.", "tr": "Üçüncüsü, stres hissettiğinde birkaç nefes egzersizi yap. Derin nefes al ve yavaş ver, sakinleşmene yardımcı olur."}, {"role": "Koleżanka", "pl": "To brzmi dobrze. A jeśli się pomylę na egzaminie?", "tr": "Kulağa iyi geliyor. Peki sınavda hata yaparsam?"}, {"role": "Ty", "pl": "To normalne, każdy może się pomylić. Zachowaj spokój i idź dalej. Nie skupiaj się na jednej pomyłce.", "tr": "Bu normal, herkes hata yapabilir. Sakin ol ve devam et. Tek bir hataya takılma."}, {"role": "Koleżanka", "pl": "Dziękuję, to mnie uspokaja.", "tr": "Teşekkürler, bu beni sakinleştiriyor."}, {"role": "Ty", "pl": "Pamiętaj też o ogólnych radach na każdy egzamin: dobrze przygotuj się wcześniej, rób krótkie przerwy, pij wodę i nie pomijaj posiłku. A wieczorem obejrzyj swój ulubiony film, spróbuj się zrelaksować i spędź czas z bliskimi.", "tr": "Ayrıca her sınav için genel tavsiyeleri unutma: önceden iyi hazırlan, kısa molalar ver, su iç ve öğün atlama. Akşam ise sevdiğin bir filmi izle, rahatlamaya çalış ve sevdiklerinle vakit geçir."}, {"role": "Koleżanka", "pl": "Masz rację, powinnam tak zrobić.", "tr": "Haklısın, bunu yapmalıyım."}, {"role": "Ty", "pl": "I pamiętaj, stres jest normalny, ale nie przeszkadza. Wierzę w Ciebie i wiem, że dasz radę!", "tr": "Ve unutma, stres normaldir ama engel değil. Sana güveniyorum ve başaracağını biliyorum!"}, {"role": "Koleżanka", "pl": "Dziękuję Ci bardzo! Czuję się teraz spokojniejsza.", "tr": "Çok teşekkürler! Şimdi daha sakin hissediyorum."}, {"role": "Ty", "pl": "Super! Powodzenia jutro!", "tr": "Harika! Yarın başarılar!"}], "roles": ["Koleżanka", "Ty"]}, {"topic": "Pani/Pana koleżanka jest chora. Proszę do niej zadzwonić, zapytać, jak się czuje, i zaproponować pomoc w zrobieniu i przyniesieniu zakupów.", "turns": [{"role": "Koleżanka", "pl": "Cześć! Niestety źle się czuję. Mam gorączkę i boli mnie gardło.", "tr": "Merhaba! Maalesef iyi hissetmiyorum. Ateşim var ve boğazım ağrıyor."}, {"role": "Ty", "pl": "Ojej, przykro mi to słyszeć. Mam nadzieję, że dojdzesz do siebie. Czy potrzebujesz czegoś do jedzenia lub picia?", "tr": "Ayy, bunu duyduğuma üzüldüm. Umarım iyileşirsin. Yemek ya da içecek bir şeye ihtiyacın var mı?"}, {"role": "Koleżanka", "pl": "Dziękuję, mam trochę jedzenia, ale brakuje mi owoców i chleba.", "tr": "Teşekkürler, biraz yiyeceğim var ama meyve ve ekmek eksik."}, {"role": "Ty", "pl": "Rozumiem. Mogę Ci kupić zakupy i przynieść do domu. Chcesz, żebym to zrobił dzisiaj czy jutro?", "tr": "Anladım. Alışverişini yapıp sana getirebilirim. Bunu bugün mü yoksa yarın mı yapmamı istersin?"}, {"role": "Koleżanka", "pl": "Jeśli możesz dzisiaj, byłoby wspaniale.", "tr": "Eğer bugün yapabilirsen harika olur."}, {"role": "Ty", "pl": "Okej, zrobię to dzisiaj. Czy jest coś jeszcze, co chciałabyś, żebym kupił? Może leki lub herbata?", "tr": "Tamam, bunu bugün yapacağım. Başka almak istediğin bir şey var mı? Belki ilaç ya da çay?"}, {"role": "Koleżanka", "pl": "Tak, proszę kup trochę herbaty i syropu na gardło.", "tr": "Evet, biraz çay ve boğaz şurubu al lütfen."}, {"role": "Ty", "pl": "Dobrze, zapamiętam. A czy chcesz, żebym zrobił listę zakupów razem z Tobą, żeby niczego nie zapomnieć?", "tr": "Tamam, hatırlayacağım. Ayrıca birlikte bir alışveriş listesi yapsak, eksik bir şey kalmasın ister misin?"}, {"role": "Koleżanka", "pl": "Tak, to dobry pomysł.", "tr": "Evet, bu iyi bir fikir."}, {"role": "Ty", "pl": "Super! Kiedy będę u Ciebie, możemy razem sprawdzić listę. Czy potrzebujesz też, żebym przygotował coś do jedzenia na szybko?", "tr": "Harika! Sana geldiğimde listeyi birlikte kontrol edebiliriz. Ayrıca hızlıca yemek hazırlamamı ister misin?"}, {"role": "Koleżanka", "pl": "Tak, jeśli to nie problem.", "tr": "Evet, eğer sorun değilse."}, {"role": "Ty", "pl": "Nie ma problemu. A jak się czujesz z gorączką? Masz termometr? Czy potrzebujesz lekarza?", "tr": "Sorun değil. Peki ateşin nasıl? Termometren var mı? Doktora gitmen gerekiyor mu?"}, {"role": "Koleżanka", "pl": "Mam termometr, ale jeszcze nie byłam u lekarza. Może jutro pójdę.", "tr": "Termometrem var, ama doktora gitmedim. Belki yarın giderim."}, {"role": "Ty", "pl": "Dobrze, najpierw zrobimy zakupy, a potem odpoczniesz. Pamiętaj, żeby dużo pić i leżeć w łóżku.", "tr": "Tamam, önce alışverişi yaparız, sonra dinlenirsin. Bol bol içmeyi ve yatakta kalmayı unutma."}, {"role": "Koleżanka", "pl": "Dziękuję Ci bardzo! To dla mnie bardzo pomocne.", "tr": "Çok teşekkürler! Bu benim için çok yardımcı olacak."}, {"role": "Ty", "pl": "Nie ma sprawy! Mam nadzieję, że dojdzesz do siebie. Przyjdę dzisiaj z zakupami i herbatą. Do zobaczenia za chwilę!", "tr": "Sorun değil! Umarım iyileşirsin. Bugün alışveriş ve çay ile geleceğim. Görüşürüz birazdan!"}], "roles": ["Koleżanka", "Ty"]}, {"topic": "Pani/Pana współlokatorka nie sprząta. Proszę z nią o tym porozmawiać i ustalić nowe zasady.", "turns": [{"role": "Ty", "pl": "Cześć, Magda! Czy możemy porozmawiać chwilę o mieszkaniu?", "tr": "Merhaba, Magda! Ev hakkında biraz konuşabilir miyiz?"}, {"role": "Współlokatorka", "pl": "Cześć! Jasne, o co chodzi?", "tr": "Merhaba! Tabii, ne oldu?"}, {"role": "Ty", "pl": "Chciałam porozmawiać o sprzątaniu. Zauważyłam, że czasami nie sprzątasz po sobie w kuchni i w łazience.", "tr": "Temizlik hakkında konuşmak istiyorum. Bazen mutfakta ve banyoda işini bitirdikten sonra temizlemediğini fark ettim."}, {"role": "Współlokatorka", "pl": "Tak, wiem. Przepraszam, czasami zapominam.", "tr": "Evet, biliyorum. Özür dilerim, bazen unutuyorum."}, {"role": "Ty", "pl": "Rozumiem, ale musimy ustalić nowe zasady, żeby mieszkanie było czyste i przyjemne dla nas obu.", "tr": "Anlıyorum, ama yeni kurallar belirlemeliyiz ki ev ikimiz için temiz ve rahat olsun."}, {"role": "Współlokatorka", "pl": "Dobrze, jakie zasady masz na myśli?", "tr": "Tamam, hangi kuralları düşünüyorsun?"}, {"role": "Ty", "pl": "Na przykład, po każdym gotowaniu każda z nas sprząta swoje naczynia. I raz w tygodniu robimy większe sprzątanie razem.", "tr": "Mesela, her yemek yaptıktan sonra kendi bulaşıklarımızı temizleyeceğiz. Ve haftada bir büyük temizlik yapacağız."}, {"role": "Współlokatorka", "pl": "To brzmi rozsądnie. A co z łazienką?", "tr": "Mantıklı geliyor. Peki ya banyo?"}, {"role": "Ty", "pl": "Możemy ustalić, że każdy myje po sobie wannę i umywalkę po użyciu. I raz w tygodniu wspólne czyszczenie łazienki.", "tr": "Her kullanım sonrası herkes küveti ve lavaboyu temizleyecek. Ve haftada bir banyonun ortak temizliği olacak."}, {"role": "Współlokatorka", "pl": "Dobrze, mogę tak zrobić. Chcę, żeby mieszkanie było przyjemne dla nas obu.", "tr": "Tamam, bunu yapabilirim. Evimizin ikimiz için hoş olmasını istiyorum."}, {"role": "Ty", "pl": "Super! Możemy też zrobić harmonogram sprzątania, żeby łatwiej było pamiętać.", "tr": "Harika! Hatırlamayı kolaylaştırmak için bir temizlik programı da yapabiliriz."}, {"role": "Współlokatorka", "pl": "To świetny pomysł. Zróbmy harmonogram na przyszły tydzień.", "tr": "Harika bir fikir. Gelecek hafta için programı yapalım."}, {"role": "Ty", "pl": "Świetnie! Dzięki, że porozmawiałyśmy. Teraz mieszkanie będzie czyste i miłe dla nas obu.", "tr": "Harika! Konuştuğumuz için teşekkürler. Şimdi ev ikimiz için temiz ve hoş olacak."}, {"role": "Współlokatorka", "pl": "Tak, zgadzam się. Dziękuję, że o tym porozmawiałaś.", "tr": "Evet, katılıyorum. Bunun hakkında konuştuğun için teşekkürler."}], "roles": ["Ty", "Współlokatorka"]}, {"topic": "Pani/Pana znajomy ma niedługo urodziny. Proszę zaplanować z koleżanką, w jaki sposób będziecie obchodzić ten dzień.", "turns": [{"role": "Telefon", "pl": "Cześć, Marku! Chciałbym porozmawiać o urodzinach Tomka.", "tr": "Merhaba, Marek! Tomek'in doğum günü hakkında konuşmak istiyorum."}, {"role": "Koleżanka", "pl": "Cześć! Tak, oczywiście. Co masz na myśli?", "tr": "Merhaba! Evet, tabii. Ne düşünüyorsun?"}, {"role": "Koleżanka", "pl": "Myślę, że lepiej zrobić małe przyjęcie w domu. Możemy zaprosić kilku znajomych.", "tr": "Bence evde küçük bir kutlama yapalım. Birkaç arkadaşımızı davet edebiliriz."}, {"role": "Koleżanka", "pl": "Tak, to dobry pomysł. Kto kupi napoje?", "tr": "Evet, bu iyi bir fikir. İçecekleri kim alacak?"}, {"role": "Koleżanka", "pl": "Dobrze. A tort? Kupić czy upiec?", "tr": "Tamam. Peki pasta? Alalım mı yoksa yapalım mı?"}, {"role": "Koleżanka", "pl": "Zgoda. A o której godzinie zaczniemy przyjęcie?", "tr": "Anlaştık. Peki kutlama saat kaçta başlasın?"}, {"role": "Koleżanka", "pl": "Super! A czy powinniśmy zrobić dekoracje? Balony, girlandy?", "tr": "Harika! Peki dekorasyon yapalım mı? Balonlar, süslemeler?"}, {"role": "Koleżanka", "pl": "Dobrze. A czy kupimy jakiś prezent dla Tomka?", "tr": "Tamam. Peki Tomek için bir hediye alalım mı?"}, {"role": "Koleżanka", "pl": "Myślę, że książka będzie najlepsza.", "tr": "Bence kitap en iyisi olacak."}, {"role": "Koleżanka", "pl": "Tak, to będzie wspaniale. Dziękuję za rozmowę!", "tr": "Evet, harika olacak. Konuştuğun için teşekkürler!"}], "roles": ["Telefon", "Koleżanka"]}, {"topic": "Proszę zapytać w kasie kina o aktualny repertuar i kupić bilety na wybrany seans.", "turns": [{"role": "Ty", "pl": "Dzień dobry! Chc /* storage */
function jget(k,f){ try{ return JSON.parse(localStorage.getItem(k)) ?? f; }catch(e){ return f; } }
function jset(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

let di=null;            // current dialog index
let dlg=null;           // current dialog
let myRole=null;        // role the user practices (their lines hidden)
let showTR=jget('dlg_showtr',false);
let rate=jget('dlg_rate',0.9);   // tempo czytania (0.5–1.5)
let lineView={};        // ti -> 'full'|'letters' (base for your lines)
let wordOv={};          // ti -> Set of revealed/flipped word indices

function progKey(i,role){ return 'dlg_prog_'+i+'_'+role; }
let known=new Set();

/* ---------- list ---------- */
function renderList(){
  const host=document.getElementById('dlgList'); host.innerHTML='';
  DIALOGS.forEach((d,i)=>{
    const card=document.createElement('div'); card.className='dcard';
    const mine = jget('dlg_role_'+i, d.roles[0]);
    const kn = new Set(jget(progKey(i,mine),{known:[]}).known||[]);
    const myTurns = d.turns.filter(t=>t.role===mine).length;
    card.innerHTML=`<div class="dnum">${i+1}</div><div class="dbody">
      <div class="dtopic">${esc(d.topic)}</div>
      <div class="dmeta"><b>${esc(d.roles[0])}</b> ↔ <b>${esc(d.roles[1])}</b> · ${d.turns.length} kwestii${kn.size?` · <span class="dprog">${kn.size}/${myTurns} opanowane</span>`:''}</div>
    </div>`;
    card.onclick=()=>openDialog(i);
    host.appendChild(card);
  });
}
function esc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* ---------- open practice ---------- */
function openDialog(i){
  di=i; dlg=DIALOGS[i];
  myRole=jget('dlg_role_'+i, dlg.roles[0]);
  loadProg();
  lineView={}; wordOv={};
  document.getElementById('curTopic').textContent=dlg.topic;
  document.getElementById('listView').classList.add('hide');
  document.getElementById('practiceView').classList.remove('hide');
  document.getElementById('trBtn').classList.toggle('primary',showTR);
  playState='idle'; playIdx=0; setButtons();
  renderRoles(); renderChat(); updateProgress();
  window.scrollTo({top:0});
}
function loadProg(){ known=new Set(jget(progKey(di,myRole),{known:[]}).known||[]); }
function saveProg(){ jset(progKey(di,myRole),{known:[...known]}); }

function renderRoles(){
  const host=document.getElementById('roleBtns'); host.innerHTML='';
  dlg.roles.forEach(r=>{
    const b=document.createElement('button'); b.textContent=r; b.className=r===myRole?'sel':'';
    b.onclick=()=>{ stopPlay(); myRole=r; jset('dlg_role_'+di,r); loadProg(); lineView={}; wordOv={}; renderRoles(); renderChat(); updateProgress(); };
    host.appendChild(b);
  });
  const other=dlg.roles.find(r=>r!==myRole);
  document.getElementById('roleHint').textContent='Grasz jako „'+myRole+'”. Kwestie „'+other+'” są widoczne jako podpowiedź; swoje mów z pamięci i dotykaj słów, gdy potrzebujesz pomocy.';
}

/* ---------- word rendering ---------- */
function wordFL(w){ const rest=[...w].length-1; return '<span class="fl">'+w[0]+'</span>'+(rest>0?'<span class="dots">'+'·'.repeat(rest)+'</span>':''); }
function renderLine(el, text, ti){
  const base = lineView[ti] || 'letters';
  const baseLetters = base==='letters';
  const ov = wordOv[ti];
  const frag=document.createDocumentFragment();
  const re=/(\p{L}[\p{L}’'\-]*)|([^\p{L}]+)/gu; let m, wi=0;
  while((m=re.exec(text))){
    if(m[1]){
      const idx=wi++;
      const isLetters = ov&&ov.has(idx) ? !baseLetters : baseLetters;
      const sp=document.createElement('span'); sp.className='w'; sp.dataset.wi=idx;
      if(isLetters){ sp.innerHTML=wordFL(m[1]); sp.classList.add('masked'); } else sp.textContent=m[1];
      sp.onclick=()=>{ if(!wordOv[ti]) wordOv[ti]=new Set(); wordOv[ti].has(idx)?wordOv[ti].delete(idx):wordOv[ti].add(idx); renderChat(); };
      frag.appendChild(sp);
    } else frag.appendChild(document.createTextNode(m[2]));
  }
  el.appendChild(frag);
}

/* ---------- chat ---------- */
function renderChat(){
  const host=document.getElementById('chat'); host.innerHTML='';
  dlg.turns.forEach((t,ti)=>{
    const mine = t.role===myRole;
    const turn=document.createElement('div'); turn.className='turn '+(mine?'you':'them'); turn.id='turn'+ti;

    const lbl=document.createElement('div'); lbl.className='rolelbl';
    const name=document.createElement('span'); name.textContent=t.role; lbl.appendChild(name);
    // speak button
    const spk=document.createElementNS('http://www.w3.org/2000/svg','svg');
    spk.setAttribute('viewBox','0 0 24 24'); spk.setAttribute('fill','currentColor'); spk.classList.add('ico');
    spk.innerHTML='<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4z"/>';
    spk.onclick=(e)=>{ e.stopPropagation(); speak(t.pl,spk); };
    lbl.appendChild(spk);
    if(mine){
      const know=document.createElement('span'); know.className='mini'+(known.has(ti)?' on':''); know.textContent=known.has(ti)?'✓ umiem':'umiem';
      know.onclick=(e)=>{ e.stopPropagation(); known.has(ti)?known.delete(ti):known.add(ti); saveProg(); renderChat(); updateProgress(); };
      lbl.appendChild(know);
      // tap role name toggles whole line
      name.style.cursor='pointer';
      name.onclick=()=>{ const now=lineView[ti]||'letters'; lineView[ti]=now==='letters'?'full':'letters'; if(wordOv[ti])wordOv[ti].clear(); renderChat(); };
    }
    turn.appendChild(lbl);

    const bub=document.createElement('div'); bub.className='bubble';
    if(mine) renderLine(bub, t.pl, ti);
    else bub.textContent=t.pl;
    turn.appendChild(bub);

    if(showTR && t.tr){ const tr=document.createElement('div'); tr.className='tr'; tr.textContent=t.tr; turn.appendChild(tr); }
    host.appendChild(turn);
  });
}
function updateProgress(){
  const mine=dlg.turns.filter(t=>t.role===myRole).length;
  document.getElementById('ringT').textContent=mine;
  document.getElementById('ringN').textContent=known.size;
  document.getElementById('ringFill').style.strokeDashoffset=138.2*(1-(mine?known.size/mine:0));
}

/* ---------- toolbar ---------- */
document.getElementById('backBtn').onclick=()=>{ stopPlay(); document.getElementById('practiceView').classList.add('hide'); document.getElementById('listView').classList.remove('hide'); renderList(); window.scrollTo({top:0}); };
document.getElementById('revealAll').onclick=()=>{ dlg.turns.forEach((t,ti)=>{ if(t.role===myRole){ lineView[ti]='full'; if(wordOv[ti])wordOv[ti].clear(); } }); renderChat(); };
document.getElementById('hideAll').onclick=()=>{ dlg.turns.forEach((t,ti)=>{ if(t.role===myRole){ lineView[ti]='letters'; if(wordOv[ti])wordOv[ti].clear(); } }); renderChat(); };
document.getElementById('trBtn').onclick=()=>{ showTR=!showTR; jset('dlg_showtr',showTR); document.getElementById('trBtn').classList.toggle('primary',showTR); renderChat(); };

/* ---------- tempo ---------- */
const rateEl=document.getElementById('rate'), rateVal=document.getElementById('rateVal');
function showRate(){ rateVal.textContent=rate.toFixed(1).replace('.',',')+'×'; }
rateEl.value=rate; showRate();
rateEl.oninput=()=>{ rate=parseFloat(rateEl.value); jset('dlg_rate',rate); showRate(); };

/* ---------- speech ---------- */
let voices=[]; function loadVoices(){ voices=speechSynthesis.getVoices(); }
if('speechSynthesis'in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
let speakingEl=null;
function clearSpeak(){ if(speakingEl){ speakingEl.classList.remove('speaking'); speakingEl=null; } }
function plVoice(){ return voices.find(v=>(v.lang||'').toLowerCase().startsWith('pl')); }

/* ---- przerwy w ms (krótsze pauzy) — skalują się z tempem ----
   Zmniejsz/zwiększ te liczby, jeśli chcesz krótsze/dłuższe przerwy. */
const PAUSE_SENT   = 300;   // po . ! ? …  (koniec zdania)
const PAUSE_CLAUSE = 160;   // po , ; :    (przecinek)
const PAUSE_DASH   = 240;   // po —        (myślnik)
const PAUSE_TURN   = 520;   // zmiana osoby (inny rozmówca)
const PAUSE_SAME   = 240;   // ta sama osoba mówi dalej
/* wolniej mówisz -> pauzy trochę dłuższe; szybciej -> krótsze */
function pauseFor(ms){ return Math.max(0, Math.round(ms * 0.9 / rate)); }

/* Dzieli kwestię na fragmenty i ustala pauzę po każdym.
   Nie dzieli wewnątrz liczb: 15:30, 600-123-456, 200--300 zł. */
function splitSegments(text){
  const clean=(text||'').replace(/\bAI\b/g,'A I').replace(/\s--\s/g,' — ');
  const strong='.!?…', weak=',;:', dash='—–', close='"”»)';
  const isSp=c=>/\s/.test(c), isD=c=>/[0-9]/.test(c);
  const segs=[]; const n=clean.length; let start=0, i=0;
  while(i<n){
    const c=clean[i];
    if(strong.includes(c)||weak.includes(c)||dash.includes(c)){
      let j=i;
      while(j<n && (strong.includes(clean[j])||weak.includes(clean[j])||dash.includes(clean[j])||close.includes(clean[j]))) j++;
      const after=j<n?clean[j]:'', before=i>0?clean[i-1]:'';
      const numeric=(c===':'||c==='.'||c===',') && isD(before) && isD(after);
      if((after===''||isSp(after)) && !numeric){
        const run=clean.slice(i,j);
        const pause = /[.!?…]/.test(run) ? PAUSE_SENT : (/[—–]/.test(run) ? PAUSE_DASH : PAUSE_CLAUSE);
        const seg=clean.slice(start,j).trim();
        if(seg) segs.push({text:seg, pause});
        while(j<n && isSp(clean[j])) j++;
        start=j; i=j; continue;
      }
    }
    i++;
  }
  const tail=clean.slice(start).trim();
  if(tail) segs.push({text:tail, pause:0});
  if(segs.length) segs[segs.length-1].pause=0;   // brak pauzy po ostatnim fragmencie
  return segs;
}

/* pojedyncza kwestia (dotknięcie 🔊) — z pauzami na interpunkcji */
let singleTimer=null, speakGen=0;
function cancelSingle(){ speakGen++; if(singleTimer){ clearTimeout(singleTimer); singleTimer=null; } }
function speak(text, el){
  if(!('speechSynthesis'in window)){ alert('Brak syntezatora mowy.'); return; }
  stopPlay();                       // tapping a single line stops the sequence
  clearSpeak(); cancelSingle();
  const gen=speakGen, v=plVoice(), segs=splitSegments(text);
  if(el){ el.classList.add('speaking'); speakingEl=el; }
  let si=0;
  (function next(){
    if(gen!==speakGen) return;
    if(si>=segs.length){ clearSpeak(); return; }
    const seg=segs[si];
    const u=new SpeechSynthesisUtterance(seg.text); u.lang='pl-PL'; u.rate=rate; if(v)u.voice=v;
    const step=()=>{ if(gen!==speakGen) return; si++; singleTimer=setTimeout(next, pauseFor(seg.pause)); };
    u.onend=step; u.onerror=step;
    speechSynthesis.speak(u);
  })();
}

/* ---- play-all controller: play / pause / resume / stop ----
   Android Chrome ignores speechSynthesis.pause(), so Pauza fully cancels
   speech and remembers the current line; Wznów restarts from that line. */
let playState='idle';   // idle | playing | paused
let playIdx=0;
let segTimer=null;      // timer pauzy między fragmentami / osobami
function clearSegTimer(){ if(segTimer){ clearTimeout(segTimer); segTimer=null; } }
const ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
function setButtons(){
  const play=document.getElementById('playAll');
  const pause=document.getElementById('pauseBtn');
  if(playState==='paused'){ play.innerHTML=ICON_PLAY+'Wznów'; play.classList.add('primary'); }
  else { play.innerHTML=ICON_PLAY+'Odtwórz'; play.classList.remove('primary'); }
  pause.disabled = playState!=='playing';
  pause.style.opacity = playState==='playing' ? '1' : '.45';
}
function highlightPlaying(idx){
  document.querySelectorAll('.turn.playing').forEach(el=>el.classList.remove('playing'));
  if(idx>=0){ const el=document.getElementById('turn'+idx); if(el){ el.classList.add('playing'); el.scrollIntoView({behavior:'smooth',block:'center'}); } }
}
function speakTurn(idx){               // wypowiada jedną kwestię fragment po fragmencie
  const segs=splitSegments(dlg.turns[idx].pl), v=plVoice();
  let si=0;
  (function next(){
    if(playState!=='playing') return;
    if(si>=segs.length){                                   // koniec kwestii -> pauza przed następną
      const cur=dlg.turns[idx], nxt=dlg.turns[idx+1];
      const gap = nxt ? (nxt.role!==cur.role ? PAUSE_TURN : PAUSE_SAME) : 0;
      segTimer=setTimeout(()=>{ if(playState!=='playing') return; playIdx=idx+1; playNext(); }, pauseFor(gap));
      return;
    }
    const seg=segs[si];
    const u=new SpeechSynthesisUtterance(seg.text); u.lang='pl-PL'; u.rate=rate; if(v)u.voice=v;
    const step=()=>{ if(playState!=='playing') return; si++; segTimer=setTimeout(next, pauseFor(seg.pause)); };
    u.onend=step; u.onerror=step;
    speechSynthesis.speak(u);
  })();
}
function playNext(){
  if(playIdx>=dlg.turns.length){ stopPlay(); return; }
  highlightPlaying(playIdx);
  speakTurn(playIdx);
}
function playFrom(idx){
  if(!('speechSynthesis'in window)) return;
  playState='idle';                    // najpierw zdejmij stan, by zaległe onend się nie odpaliło
  cancelSingle();
  speechSynthesis.cancel();
  clearSegTimer(); clearSpeak();
  playIdx=Math.max(0,Math.min(idx,dlg.turns.length-1));
  playState='playing'; setButtons(); playNext();
}
function playClick(){                 // Odtwórz / Wznów
  if(playState==='playing') return;   // already playing; use Pauza
  playFrom(playState==='paused' ? playIdx : 0);
}
function pausePlay(){                  // Pauza — stop now, keep position
  if(playState!=='playing') return;
  playState='paused';                  // ustaw najpierw, żeby zaległy onend/timer się zatrzymał
  if('speechSynthesis'in window) speechSynthesis.cancel();
  clearSegTimer();
  setButtons();                        // keep highlight on the paused line
}
function stopPlay(){                   // Stop — cancel and reset to start
  playState='idle';
  if('speechSynthesis'in window) speechSynthesis.cancel();
  clearSegTimer();
  playIdx=0; setButtons(); highlightPlaying(-1);
}
document.getElementById('playAll').onclick=playClick;
document.getElementById('pauseBtn').onclick=pausePlay;
document.getElementById('stopBtn').onclick=stopPlay;

/* ---------- init ---------- */
renderList();
</script>
</body>
</html>
