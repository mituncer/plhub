<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polonca Sıfat & Zarf Testi</title>
<style>
  :root{
    --bg:#f4f7fb; --card:#ffffff; --ink:#1c2530; --muted:#64748b;
    --brand:#1f4e79; --brand2:#3b7dc4; --ok:#15803d; --okbg:#dcfce7;
    --bad:#b91c1c; --badbg:#fee2e2; --line:#e2e8f0; --gold:#b8860b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.4;padding:8px}
  .wrap{max-width:640px;margin:0 auto}
  header{text-align:center;margin-bottom:6px}
  h1{font-size:16px;margin:0;color:var(--brand);display:inline}
  .sub{color:var(--muted);font-size:11px;display:inline;margin-left:6px}

  .bar{display:flex;gap:8px;align-items:center;justify-content:space-between;
    background:var(--card);border:1px solid var(--line);border-radius:11px;
    padding:6px 12px;margin-bottom:7px;font-size:13px}
  .bar b{color:var(--brand)}
  .streak{color:var(--gold);font-weight:700}

  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:11px 12px;box-shadow:0 4px 18px rgba(20,40,80,.05)}
  .qtag{display:inline-block;font-size:10px;letter-spacing:.4px;text-transform:uppercase;
    color:var(--brand2);font-weight:700;margin-bottom:5px}
  .q{font-size:18px;font-weight:500;margin-bottom:9px}
  .q .hl{display:block;color:var(--ink);background:#f1f6fc;border:1px solid #dbe7f5;
    padding:8px 11px;border-radius:9px;font-weight:600;line-height:1.4}
  .q .hl b{color:var(--brand);background:#fff;border:1px dashed var(--brand2);
    padding:0 9px;border-radius:5px;letter-spacing:2px;font-weight:700}
  .q .tr{display:block;margin-top:5px;color:var(--muted);font-size:12.5px;font-weight:400;font-style:italic;line-height:1.35}

  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .opt{padding:13px 10px;border:1.5px solid var(--line);border-radius:11px;
    background:#fff;font-size:18px;font-weight:500;cursor:pointer;text-align:center;transition:.12s}
  .opt:active{transform:scale(.99)}
  .opt.correct{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
  .opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad);font-weight:600}
  .opt.dim{opacity:.5}

  .fb{margin-top:8px;font-size:13px;min-height:16px}
  .fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
  .fb .ex{display:block;color:var(--ink);margin-top:4px;font-size:12px;line-height:1.35}
  .fb .ex .full{color:var(--muted)}
  .fb .ex .forms{display:block;margin-top:3px;color:var(--muted);font-size:11px}

  .badge{display:inline-block;font-weight:800;padding:3px 10px;border-radius:8px;
    font-size:13.5px;margin:1px 0 3px;letter-spacing:.2px}
  .badge.adj{background:#e0edff;color:#1f4e79;border:1.5px solid #9cc0ea}
  .badge.adv{background:#fff1dc;color:#9a5b00;border:1.5px solid #e5b877}

  .next{margin-top:9px;width:100%;padding:11px;border:none;border-radius:11px;
    background:var(--brand);color:#fff;font-size:15px;font-weight:600;cursor:pointer;
    opacity:0;pointer-events:none;transition:.15s}
  .next.show{opacity:1;pointer-events:auto}

  footer{text-align:center;color:var(--muted);font-size:11px;margin-top:7px}
  .reset{background:none;border:none;color:var(--brand2);cursor:pointer;font-size:12px;text-decoration:underline}

  .progress{display:flex;gap:4px;justify-content:center;margin-bottom:8px}
  .progress .dot{width:15px;height:7px;border-radius:5px;background:#dde5ef;transition:.2s}
  .progress .dot.ok{background:var(--ok)}
  .progress .dot.bad{background:var(--bad)}
  .progress .dot.cur{background:var(--brand2);box-shadow:0 0 0 2px #bcd6f0}

  .eval{text-align:center;padding:4px 2px}
  .eval .score{font-size:38px;font-weight:800;color:var(--brand);line-height:1.05;margin:2px 0}
  .eval .score small{font-size:18px;color:var(--muted);font-weight:600}
  .eval .msg{font-size:15px;font-weight:600;margin:3px 0 8px}
  .evalbar{height:10px;border-radius:8px;background:#e9eef5;overflow:hidden;margin:0 0 4px}
  .evalbar>div{height:100%;background:linear-gradient(90deg,#3b7dc4,#1f4e79);width:0;transition:width .5s}
  .evalpct{font-size:11.5px;color:var(--muted);margin-bottom:8px}
  .review{text-align:left;margin-top:8px}
  .review h4{margin:0 0 6px;font-size:13px;color:var(--ink)}
  .review .item{font-size:12px;background:#f8fafc;border:1px solid var(--line);
    border-left:3px solid var(--bad);border-radius:8px;padding:6px 9px;margin-bottom:5px;line-height:1.4}
  .review .item .w{font-weight:700;color:var(--brand)}
  .review .item .tag{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:4px}
  .review .item .tag.adj{background:#e0edff;color:#1f4e79}
  .review .item .tag.adv{background:#fff1dc;color:#9a5b00}
  .review .item .s{display:block;color:var(--muted);margin-top:2px}
  .eval .allok{background:#dcfce7;border:1px solid #86efac;color:#15803d;
    border-radius:10px;padding:10px;font-weight:600;margin-top:6px}
  .cont{margin-top:10px;width:100%;padding:12px;border:none;border-radius:11px;
    background:var(--ok);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  .again{margin-top:6px;background:none;border:none;color:var(--brand2);
    text-decoration:underline;cursor:pointer;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Polonca Sıfat &amp; Zarf Testi</h1>
    <div class="sub">Cümledeki boşluğa hangi biçim gelir? · B1</div>
  </header>

  <div class="bar">
    <span>Soru: <b id="qnum">1</b></span>
    <span>Doğru: <b id="score">0</b> / <span id="total">0</span></span>
    <span class="streak" id="streak">🔥 0</span>
  </div>

  <div class="card">
    <div class="qtag">Boşluğa hangi biçim gelmeli?</div>
    <div class="progress" id="progress"></div>
    <div id="quiz">
      <div class="q" id="question"></div>
      <div class="opts" id="opts"></div>
      <div class="fb" id="fb"></div>
      <button class="next" id="next">Sonraki soru →</button>
    </div>
    <div id="eval" class="eval" style="display:none"></div>
  </div>

  <footer>
    <div><b id="poolsize">0</b> farklı cümle · eril / dişil / nötr / zarf ayrımı · karışık sırayla</div>
    <button class="reset" id="reset">Sıfırla</button>
  </footer>
</div>

/* ---------- YARDIMCILAR ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

const ALL_FORMS = [...new Set(DATA.flatMap(w=>[w.m,w.f,w.n,w.adv]))];
const TOTAL_SENTS = DATA.reduce((s,w)=>s+w.sents.length,0);

const GENDER_TR = {m:"eril (rodzaj męski)", f:"dişil (rodzaj żeński)", n:"nötr (rodzaj nijaki)"};
const GENDER_SHORT = {m:"eril", f:"dişil", n:"nötr"};

/* Şıklar: aynı kelimenin 4 biçimi (eril/dişil/nötr/zarf).
   Doğru cevap tek başına en uzun olursa, en kısa (zarf olmayan) çeldiriciyi
   başka bir kelimenin >= uzunluktaki biçimiyle değiştirip ipucu kırılır. */
function buildOptions(word, correct){
  let opts=[word.m, word.f, word.n, word.adv];
  const mx=Math.max(...opts.map(o=>o.length));
  const uniqueLongest = correct.length===mx && opts.filter(o=>o.length===mx).length===1;
  if(uniqueLongest){
    const pad = shuffle(ALL_FORMS.filter(f=>!opts.includes(f) && f.length>=correct.length));
    if(pad.length){
      const advCorrect = (correct===word.adv);
      let dropIdx=-1,min=Infinity;
      opts.forEach((o,i)=>{
        if(o===correct) return;
        if(!advCorrect && o===word.adv) return; // sıfat sorusunda zarf çeldiricisini koru
        if(o.length<min){min=o.length;dropIdx=i;}
      });
      if(dropIdx<0){ opts.forEach((o,i)=>{ if(o!==correct && o.length<min){min=o.length;dropIdx=i;} }); }
      if(dropIdx>=0) opts[dropIdx]=pad[0];
    }
  }
  return shuffle(opts);
}

/* ---------- SORU ÜRETİMİ ---------- */
let lastKey="";
function makeQuestion(){
  for(let tries=0; tries<25; tries++){
    const w=pick(DATA);
    const s=pick(w.sents);
    const correct = s.form==="m"?w.m : s.form==="f"?w.f : s.form==="n"?w.n : w.adv;
    const opts=buildOptions(w, correct);
    // güvenlik: hâlâ tek başına en uzunsa (ör. bezpiecznie) bu soruyu atla
    const mx=Math.max(...opts.map(o=>o.length));
    if(correct.length===mx && opts.filter(o=>o.length===mx).length===1) continue;

    const key=w.m+"|"+s.pl;
    if(key===lastKey && tries<12) continue;
    lastKey=key;

    const isAdv = (s.form==="adv");
    const blanked = s.pl.replace("{x}", "<b>____</b>");
    const full    = s.pl.replace("{x}", "<b>"+correct+"</b>");

    const badge = isAdv
      ? `<span class="badge adv">➡️ ZARF gerekir</span>`
      : `<span class="badge adj">➡️ SIFAT gerekir · ${GENDER_TR[s.form]}</span>`;
    const reason = isAdv
      ? "Boşluk bir <b>fiili/eylemi</b> niteliyor → <b>zarf</b>."
      : `Boşluk bir <b>ismi</b> niteliyor → ismin cinsine uyan <b>sıfat</b>.`;

    return {
      correct,
      options: opts,
      isAdv,
      formLabel: isAdv ? "ZARF" : ("SIFAT · " + GENDER_SHORT[s.form]),
      sentence: s.pl.replace("{x}", correct),
      html:`<span class="hl">${blanked}</span><span class="tr">🔸 ${s.tr}</span>`,
      ex: `${badge}<span class="ex">${reason}<br>`
        + `<span class="full">Doğru cümle: „${full}”</span>`
        + `<span class="forms">Biçimler → eril: <b>${w.m}</b> · dişil: <b>${w.f}</b> · nötr: <b>${w.n}</b> · zarf: <b>${w.adv}</b></span>`
        + `</span>`
    };
  }
  // teorik fallback
  const w=DATA[0], s=w.sents[0];
  return {correct:w.m, options:shuffle([w.m,w.f,w.n,w.adv]),
    html:`<span class="hl">${s.pl.replace("{x}","<b>____</b>")}</span><span class="tr">🔸 ${s.tr}</span>`, ex:""};
}

/* ---------- DURUM & UI ---------- */
const BATCH = 10; // her turda soru sayısı
let state={n:0,score:0,total:0,streak:0,answered:false,cur:null,
           batch:[], wrong:[]}; // batch: bu turdaki sonuçlar (true/false), wrong: yanlışlar
const $=id=>document.getElementById(id);

function renderProgress(){
  const box=$("progress");box.innerHTML="";
  const cur=state.batch.length; // sıradaki (cevaplanmamış) sorunun indeksi
  for(let i=0;i<BATCH;i++){
    const d=document.createElement("div");
    d.className="dot";
    if(i<cur) d.classList.add(state.batch[i]?"ok":"bad");
    else if(i===cur && !state.evalOpen) d.classList.add("cur");
    box.appendChild(d);
  }
}

function loadQuestion(){
  state.answered=false;
  state.cur=makeQuestion();
  state.n++;
  $("qnum").textContent=state.n;
  $("question").innerHTML=state.cur.html;
  $("fb").innerHTML="";$("fb").className="fb";
  const nx=$("next");
  nx.classList.remove("show");
  nx.textContent="Sonraki soru →";
  const box=$("opts");box.innerHTML="";
  state.cur.options.forEach(opt=>{
    const b=document.createElement("button");
    b.className="opt";b.textContent=opt;
    b.onclick=()=>choose(b,opt);
    box.appendChild(b);
  });
  renderProgress();
}

function choose(btn,opt){
  if(state.answered)return;
  state.answered=true;state.total++;
  const correct=state.cur.correct;
  const isRight=(opt===correct);
  [...document.querySelectorAll(".opt")].forEach(b=>{
    if(b.textContent===correct)b.classList.add("correct");
    else if(b===btn)b.classList.add("wrong");
    else b.classList.add("dim");
    b.style.pointerEvents="none";
  });
  const fb=$("fb");
  if(isRight){
    state.score++;state.streak++;
    fb.className="fb ok";
    fb.innerHTML="✔ Doğru!<br>"+state.cur.ex;
  } else {
    state.streak=0;
    fb.className="fb bad";
    fb.innerHTML="✘ Yanlış. Doğrusu: <b>"+correct+"</b><br>"+state.cur.ex;
    state.wrong.push({word:correct, label:state.cur.formLabel,
                      isAdv:state.cur.isAdv, sent:state.cur.sentence, chosen:opt});
  }
  state.batch.push(isRight);
  $("score").textContent=state.score;
  $("total").textContent=state.total;
  $("streak").textContent="🔥 "+state.streak;
  renderProgress();

  const nx=$("next");
  if(state.batch.length>=BATCH){
    nx.textContent="📊 "+BATCH+" sorunun sonucunu gör";
  }
  nx.classList.add("show");
}

function showEval(){
  state.evalOpen=true;
  const right=state.batch.filter(Boolean).length;
  const pct=Math.round(100*right/BATCH);
  let msg;
  if(right===10) msg="Mükemmel! 🎉 Hepsi doğru.";
  else if(right>=8) msg="Çok iyi! 👏 Neredeyse kusursuz.";
  else if(right>=6) msg="İyi gidiyorsun. 🙂 Biraz daha pratik işe yarar.";
  else if(right>=4) msg="Fena değil. Yanlışları gözden geçir.";
  else msg="Bu biçimleri biraz daha çalışmak iyi olur. Pes etme! 💪";

  let review;
  if(state.wrong.length===0){
    review=`<div class="allok">Bu turda hiç hata yok — tebrikler! ✅</div>`;
  } else {
    const items=state.wrong.map(w=>{
      const tagCls=w.isAdv?"adv":"adj";
      const sent=w.sent.replace(w.word, "<b>"+w.word+"</b>");
      return `<div class="item"><span class="w">${w.word}</span>`
           + `<span class="tag ${tagCls}">${w.label}</span>`
           + `<span class="s">„${sent}”</span></div>`;
    }).join("");
    review=`<div class="review"><h4>Gözden geçir (${state.wrong.length} yanlış):</h4>${items}</div>`;
  }

  $("quiz").style.display="none";
  const ev=$("eval");
  ev.style.display="block";
  ev.innerHTML =
      `<div class="score">${right} <small>/ ${BATCH}</small></div>`
    + `<div class="msg">${msg}</div>`
    + `<div class="evalbar"><div id="evbar"></div></div>`
    + `<div class="evalpct">%${pct} başarı · toplam ${state.n} soruda ${state.score} doğru</div>`
    + review
    + `<button class="cont" id="cont">Devam et → sonraki ${BATCH} soru</button>`
    + `<br><button class="again" id="againBtn">Baştan başla (sayaçları sıfırla)</button>`;
  // animasyonlu bar
  setTimeout(()=>{const b=$("evbar"); if(b) b.style.width=pct+"%";},50);
  $("cont").onclick=nextBatch;
  $("againBtn").onclick=fullReset;
  renderProgress();
}

function nextBatch(){
  state.batch=[]; state.wrong=[]; state.evalOpen=false;
  $("eval").style.display="none";
  $("quiz").style.display="block";
  loadQuestion();
}

function fullReset(){
  state={n:0,score:0,total:0,streak:0,answered:false,cur:null,batch:[],wrong:[],evalOpen:false};
  $("score").textContent=0;$("total").textContent=0;$("streak").textContent="🔥 0";
  $("eval").style.display="none";
  $("quiz").style.display="block";
  loadQuestion();
}

$("next").onclick=()=>{
  if(state.batch.length>=BATCH) showEval();
  else loadQuestion();
};
$("reset").onclick=fullReset;

$("poolsize").textContent = TOTAL_SENTS;
loadQuestion();
</script>
