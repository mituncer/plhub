<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trener gramatyki B1</title>
<style>
:root{
  --paper:#F4F6F9;--ink:#141C28;--soft:#4A5666;--line:#C7CED7;--rule:#DDE2E8;
  --band:#DCE0E6;--blue:#1F4E8C;--blue-bg:#EAF0F8;
  --green:#186E52;--green-bg:#D8F0E4;--red:#B32B24;--red-bg:#F6E7E6;--amber:#8A6100;--amber-bg:#FBF0D6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
.app{max-width:840px;margin:0 auto;padding:14px 12px 70px}
.masthead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.title{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:700;font-size:20px}
.title small{display:block;font-family:inherit;font-weight:400;font-size:12.5px;color:var(--soft);letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px}
.total{font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.total b{color:var(--ink)}
.mast-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
#pdfBtn{font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;border:1.5px solid var(--ink);
  background:var(--ink);color:#fff;border-radius:3px;padding:6px 11px;display:inline-flex;align-items:center;
  gap:6px;white-space:nowrap;line-height:1}
#pdfBtn svg{display:block}
#pdfBtn:active{opacity:.85}
#pdfBtn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* sekmeler */
.tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-ms-overflow-style:none;scrollbar-width:thin}
.tab{flex:0 0 auto;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--soft);
     border-radius:3px;padding:8px 12px;font:inherit;font-size:13.5px;font-weight:700;white-space:nowrap}
.tab .rn{display:inline-block;font-size:11px;opacity:.7;margin-right:5px}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.sheet{background:#fff;border:1px solid var(--line);border-radius:3px;
  box-shadow:0 1px 0 var(--line),0 10px 26px rgba(20,28,40,.06);padding:20px 18px 22px}
.panel{display:none}
.panel.on{display:block}
.instr{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:16px;line-height:1.45;font-weight:700;margin:0 0 4px}
.uwaga{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:14.5px;margin:0;font-weight:700;color:var(--soft)}
.pts{text-align:right;font-family:"Iowan Old Style",Palatino,Georgia,serif;font-weight:700;font-size:14px;margin:8px 0 10px}
.pts span{border-bottom:1px solid var(--ink);padding:0 20px;margin-right:6px}
.meta{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding:7px 0;margin-bottom:16px;font-size:12.5px;color:var(--soft);flex-wrap:wrap}
.meta b{color:var(--ink)}

/* metin + boşluk (podkreślanie) */
.text{font-size:16.5px;line-height:2.2;text-align:justify;hyphens:auto}
.text p{margin:0 0 6px}
.ex{background:var(--band);padding:1px 3px;white-space:nowrap}
.ex b{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.ex i{font-style:italic;font-weight:400}
sup.tg{font-size:9px;font-weight:700;letter-spacing:.04em;vertical-align:super;margin-left:1px}
sup.nm{font-size:11px;font-weight:700;color:var(--blue);vertical-align:super}
.blank{display:inline-block;min-width:92px;text-align:center;border-bottom:1.5px dotted var(--soft);
  font-weight:700;color:var(--blue);padding:0 4px;position:relative;top:1px}
.blank.empty{color:transparent}
.blank.ok{color:var(--green);border-bottom-color:var(--green)}
.blank.fix{color:var(--green);border-bottom-color:var(--green)}
.inf{font-style:italic;color:var(--soft);font-weight:400}

/* ramka */
.ramka{background:var(--band);display:flex;flex-wrap:wrap;justify-content:center;gap:4px 0;padding:11px 8px;margin-bottom:16px}
.word{flex:1 1 auto;text-align:center;min-width:78px;padding:2px 6px;font-size:16px;font-weight:600;position:relative}
.word.used,.word.example{color:var(--soft);opacity:.6}
.word.used::after,.word.example::after{content:"";position:absolute;left:10%;right:10%;top:52%;height:2px;background:var(--ink);transform:rotate(-3deg)}

/* sorular */
.qz{margin-top:22px;border-top:1px solid var(--rule);padding-top:4px}
.q{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px dashed var(--rule);flex-wrap:wrap}
.q:last-child{border-bottom:none}
.qn{width:24px;height:24px;flex:0 0 24px;border:1.5px solid var(--ink);border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:12px;font-weight:700;align-self:flex-start;margin-top:1px}
.chip{font-style:italic;color:var(--soft);font-size:14.5px;min-width:118px}
.opts{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.opt{font:inherit;font-size:15px;font-weight:600;cursor:pointer;background:#fff;border:1.5px solid var(--line);
  color:var(--ink);padding:7px 13px;border-radius:2px}
.opt:hover{border-color:var(--soft)}
.opt.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.locked .opt{cursor:default}
.opt.right{background:var(--green);border-color:var(--green);color:#fff}
.opt.right::after{content:" ✓";font-size:12px}
.opt.wrong{background:var(--red-bg);border-color:var(--red);color:var(--red);text-decoration:line-through}
.opt.reveal{background:var(--green-bg);border-color:var(--green);color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.opt.reveal::after{content:" ✓";font-size:12px}

input.ans{font:inherit;font-size:16px;padding:9px 11px;border:1.5px solid var(--line);border-radius:2px;
  width:180px;flex:0 1 220px;background:#fff;color:var(--ink)}
input.ans:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(31,78,140,.15)}
input.ans.ok{border-color:var(--green);background:var(--green-bg);color:var(--green);font-weight:700}
input.ans.bad{border-color:var(--red);background:var(--red-bg);color:var(--red)}
input.ans.near{border-color:var(--amber);background:var(--amber-bg);color:var(--amber)}
input.ans:disabled{opacity:1}

.why{flex:1 1 100%;font-size:13.5px;line-height:1.55;color:var(--soft);padding:8px 10px 8px 12px;
  margin:5px 0 0 34px;display:none;background:var(--green-bg);border-left:3px solid var(--green)}
.why.show{display:block}
.why.bad{background:var(--red-bg);border-left-color:var(--red)}
.why b{color:var(--ink)}
.corr{font-weight:700;color:var(--green)}
.yours{color:var(--red);text-decoration:line-through;margin-left:6px}
.tcz{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
  background:#E5E9EE;color:var(--soft);padding:1px 6px;border-radius:2px;margin-right:8px}

/* stopniowanie select */
select.sel{appearance:none;-webkit-appearance:none;background:#F1F4F8;border:1.5px solid #93A0B0;border-radius:5px;
  padding:3px 26px 3px 9px;font:inherit;font-size:15px;font-weight:600;color:var(--blue);cursor:pointer;margin:0 2px;
  background-image:url("data:image/svg+xml;utf8,<svg fill='%231F4E8C' height='15' viewBox='0 0 24 24' width='15' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
  background-repeat:no-repeat;background-position:right 5px center}
select.sel:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(31,78,140,.18)}
select.sel.ok{background-color:var(--green-bg);border-color:var(--green);color:var(--green)}
select.sel.bad{background-color:var(--red-bg);border-color:var(--red);color:var(--red)}

/* zaimki / stopniowanie karty */
.card{background:#fff;border:1px solid var(--rule);border-radius:4px;padding:16px;margin-bottom:14px}
.card .ctx{font-size:16px;margin-bottom:8px}
.hl{background:#FFF2C2;padding:0 3px;border-radius:2px;font-weight:600}
.card .fill{font-size:16px;font-weight:600;margin-bottom:10px}
.card .ans-ctx{font-size:14px;color:var(--soft);margin-top:8px;display:none}
.card .ans-ctx.show{display:block}

/* przekształcanie */
.modebar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:8px 0}
.modebar .lbl{font-size:12.5px;color:var(--soft)}
.segbtn{font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--soft);padding:6px 12px;border-radius:2px}
.segbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.item{padding:15px 0;border-bottom:1px solid var(--rule)}
.item:last-of-type{border-bottom:none}
.qhead{display:flex;gap:9px;align-items:flex-start}
.src{font-size:16.5px;font-weight:600}
.cue{display:inline-block;font-style:italic;color:var(--blue);background:var(--blue-bg);border:1px solid #CBD9EC;
  border-radius:2px;padding:1px 8px;margin:6px 0 10px 33px;font-size:14.5px}
.writewrap,.build,.fb{margin-left:33px}
.assembled{font-size:16.5px;font-weight:700;min-height:24px;margin-bottom:10px;padding:8px 10px;background:#F4F6F9;border:1px dashed var(--rule);border-radius:2px}
.assembled .ph{color:var(--soft);font-weight:400;font-style:italic}
.assembled .done{color:var(--blue)}
.slot{margin:8px 0}.slotlab{font-size:11.5px;color:var(--soft);margin-bottom:4px}
.fb{font-size:14px;display:none}.fb.show{display:block}
.fb .model{font-weight:700;color:var(--green)}.fb .yours{color:var(--red);margin-left:6px}
.fb .rule{color:var(--soft);font-size:13.5px;line-height:1.55;margin-top:4px}.fb .rule b{color:var(--ink)}
.verdict{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;padding:1px 7px;border-radius:2px;margin-right:8px}
.verdict.good{background:var(--green-bg);color:var(--green)}.verdict.bad{background:var(--red-bg);color:var(--red)}
input.ans.full{width:100%;flex:1 1 100%}

.result{margin-top:18px;padding:14px 16px;background:#fff;border:1px solid var(--rule);border-left:4px solid var(--ink);display:none}
.result.show{display:block}
.score{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:23px;font-weight:700;margin:0}
.score small{font-size:14px;font-weight:400;color:var(--soft)}
.subnote{font-size:13px;color:var(--amber);margin:6px 0 0}
.leftover{font-size:13.5px;color:var(--soft);margin:6px 0 0}.leftover b{color:var(--ink)}

.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{font:inherit;font-size:15px;font-weight:700;cursor:pointer;border-radius:2px;padding:12px 20px;
  border:1.5px solid var(--ink);background:var(--ink);color:#fff;flex:1 1 170px}
.btn.ghost{background:#fff;color:var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.opt:focus-visible,.segbtn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

@media (max-width:480px){
  .app{padding:10px 8px 60px}.sheet{padding:16px 12px 18px}
  .text{font-size:16px;line-height:2.3;text-align:left}
  .chip{min-width:0;flex:1}.cue,.writewrap,.build,.fb{margin-left:0}
  input.ans{width:100%;flex:1 1 100%}.word{min-width:64px;font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== PDF / druk — sadece aktif sekmeyi, cevap ve düzeltmelerle bas ===== */
@media print{
  @page{margin:12mm}
  html,body{background:#fff !important}
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
  .app{max-width:none;margin:0;padding:0}
  .tabs,.actions,#pdfBtn,.total,.modebar,[id^="sess-"]{display:none !important}
  .sheet{box-shadow:none;border:none;border-radius:0;padding:0}
  .panel{display:none !important}
  .panel.on{display:block !important}
  .masthead{margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:8px}
  .q,.item,.card,.result,.why,.slot,.cue,.ramka{break-inside:avoid;page-break-inside:avoid}
  .text p{orphans:2;widows:2}
  input.ans,.opt,select.sel{border:1px solid #888 !important}
}
</style>
</head>
<body>
<div class="app">
  <div class="masthead">
    <div class="title"><small>Język polski &middot; poziom B1</small>Trener gramatyki</div>
    <div class="mast-right">
      <button id="pdfBtn" type="button" title="Zapisz / drukuj bieżący test jako PDF" aria-label="Zapisz jako PDF">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
        PDF
      </button>
      <div class="total" id="total"></div>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="sheet"><div id="panels"></div></div>
</div>
<script>

}, {"o": ["piosenki", "piosenek", "piosenkach"], "c": 0, "p": "Biernik", "w": "Çoğul Biernik: <i>piosenki</i>.", "e": "Poprawna forma: <b>piosenki</b>. Przypadek: Biernik. Przykład: <i>piosenki</i>."}, {"o": ["oni", "im", "nimi"], "c": 1, "p": "Celownik", "w": "<b>pomagać</b> + Celownik → <i>pomagam im</i>.", "e": "Poprawna forma: <b>im</b>. Przypadek: Celownik. Przykład: <i>pomagam im</i>."}, {"o": ["nich", "ich", "nimi"], "c": 0, "p": "Dopełniacz", "w": "<b>dla</b> + Dopełniacz; edattan sonra <i>n-</i> biçimi → <b>dla nich</b>.", "e": "Poprawna forma: <b>nich</b>. Przypadek: Dopełniacz. Przykład: <i>n-</i>."}, {"o": ["zadowolony", "zadowoleni", "zadowolonych"], "c": 1, "p": "Mianownik", "w": "<i>będą</i> + sıfat → yalın hal, eril şahıs çoğul: <b>zadowoleni</b>.", "e": "Poprawna forma: <b>zadowoleni</b>. Przypadek: Mianownik. Przykład: <i>będą</i>."}]}, {"id": 10, "topic": "Basen, dieta i lepsze samopoczucie", "ex": [{"o": ["regularnych", "regularne", "regularnymi"], "c": 1}, {"o": ["treningi", "treningów", "treningach"], "c": 0}, {"o": ["mi", "mnie", "mną"], "c": 0}], "text": "Lekarz zalecił @E3@ @E1@ @E2@, bo od kilku lat prawie się nie ruszałem.\nZapisałem się na basen i chodzę tam z {1} {2} trzy razy w tygodniu. Na początku po każdym treningu bolały mnie {3} {4}.\nTrener powiedział {5}, żebym zaczynał spokojnie i nie porównywał się z {6}. Teraz pływam bez {7} problemu przez całą godzinę.\nZmieniłem też dietę: jem dużo {8} i piję znacznie mniej kawy. Czuję się {9} i mam o wiele więcej {10}.", "g": [{"o": ["mój", "mojego", "moim"], "c": 2, "p": "Narzędnik", "w": "<b>z</b> + Narzędnik → <i>z moim kolegą</i>.", "e": "Poprawna forma: <b>moim</b>. Przypadek: Narzędnik. Przykład: <i>z moim kolegą</i>."}, {"o": ["kolega", "kolegą", "koledze"], "c": 1, "p": "Narzędnik", "w": "Sıfat/zamirle uyumlu Narzędnik: <i>kolegą</i>.", "e": "Poprawna forma: <b>kolegą</b>. Przypadek: Narzędnik. Przykład: <i>kolegą</i>."}, {"o": ["wszystkie", "wszystkich", "wszystkimi"], "c": 0, "p": ożliwy. „Niemy Chór Uniwersytetu Śląskiego” istnieje już od kilku lat i pokazuje piosenki tym, którzy nie słyszą. Podczas koncertów studenci używają języka migowego, {1} języka osób niesłyszących. W chórze występują osoby po kursach tego języka {2} tacy, którzy go nie znają, {3} bardzo chcą się go nauczyć. Utwory w języku migowym są tak ciekawe, {4} wszyscy mogą się czegoś nowego dowiedzieć. Z roku na rok zainteresowanie chórem wśród studentów rośnie, {5} spotkania muszą odbywać się coraz częściej.", "g": [{"a": "czyli", "f": "wyjaśnienie", "w": "<b>czyli</b> = yani. Az önce söylenen şeyi başka kelimelerle açıklar: <i>języka migowego, czyli języka osób niesłyszących</i>.", "e": "Poprawny spójnik: <b>czyli</b>. Funkcja: wyjaśnienie. Przykład: <i>języka migowego, czyli języka osób niesłyszących</i>."}, {"a": "oraz", "f": "łączenie", "w": "<b>oraz</b> = ve (yazı dilinde <i>i</i>'nin daha resmi karşılığı). İki grubu ekler.", "e": "Poprawny spójnik: <b>oraz</b>. Funkcja: łączenie. Przykład: <i>i</i>."}, {"a": "ale", "f": "przeciwstawienie", "w": "<b>ale</b> = ama. Zıtlık: bilmiyorlar <i>ama</i> öğrenmek istiyorlar.", "e": "Poprawny spójnik: <b>ale</b>. Funkcja: przeciwstawienie. Przykład: <i>ama</i>."}, {"a": "że", "f": "skutek", "w": "<b>tak … że</b> kalıbı = o kadar … ki. <i>tak ciekawe, że wszyscy mogą…</i>", "e": "Poprawny spójnik: <b>że</b>. Funkcja: skutek. Przykład: <i>tak ciekawe, że wszyscy mogą…</i>."}, {"a": "więc", "f": "wniosek", "w": "<b>więc</b> = bu yüzden/dolayısıyla. Sonuç bildirir.", "e": "Poprawny spójnik: <b>więc</b>. Funkcja: wniosek."}]}, {"id": 2, "topic": "Zwierzęta a nasze samopoczucie", "bank": ["ponieważ", "jeśli", "czy", "żeby", "którzy", "że", "lecz"], "example": "którzy", "unused": "jeśli", "text": "Podobno ludzie, @E@ mają zwierzęta, częściej są uśmiechnięci i żyją dłużej. Psychologowie twierdzą, {1} kontakt z psem, kotem {2} królikiem dobrze wpływa na człowieka i jego samopoczucie. Wydaje się to oczywiste, {3} nie wszyscy o tym wiedzą. Wniosek jest prosty: {4} lepiej się czuć, zaproś do swojego domu zwierzę, {5} ono z pewnością poprawi ci nastrój.", "g": [{"a": "że", "f": "zdanie dopełnieniowe", "w": "<b>twierdzić / mówić / myśleć + że</b>. Türkçedeki „-dığını” yapısının karşılığı.", "e": "Poprawny spójnik: <b>że</b>. Funkcja: zdanie dopełnieniowe."}, {"a": "czy", "f": "alternatywa", "w": "Burada <b>czy</b> soru değil, <i>albo</i> anlamında „ya da”: <i>z psem, kotem czy królikiem</i>.", "e": "Poprawny spójnik: <b>czy</b>. Funkcja: alternatywa. Przykład: <i>albo</i>."}, {"a": "lecz", "f": "przeciwstawienie", "w": "<b>lecz</b> = ama (<i>ale</i>'nin edebî/resmî biçimi).", "e": "Poprawny spójnik: <b>lecz</b>. Funkcja: przeciwstawienie. Przykład: <i>ale</i>."}, {"a": "żeby", "f": "cel", "w": "<b>żeby</b> + mastar = -mek için. <i>żeby lepiej się czuć</i>.", "e": "Poprawny spójnik: <b>żeby</b>. Funkcja: cel. Przykład: <i>żeby lepiej się czuć</i>."}, {"a": "ponieważ", "f": "przyczyna", "w": "<b>ponieważ</b> = çünkü (<i>bo</i>'nun resmî biçimi). Sebep cümlesi.", "e": "Poprawny spójnik: <b>ponieważ</b>. Funkcja: przyczyna. Przykład: <i>bo</i>."}]}, {"id": 3, "topic": "Rowerem do pracy", "bank": ["chociaż", "dlatego", "bo", "ani", "kiedy", "że", "albo"], "example": "chociaż", "unused": "albo", "text": "Coraz więcej Polaków jeździ do pracy rowerem, @E@ pogoda w naszym kraju nie zawsze na to pozwala. W dużych miastach powstaje coraz więcej ścieżek rowerowych, {1} jazda stała się dużo bezpieczniejsza. Rower jest tańszy niż samochód, {2} nie trzeba płacić za paliwo {3} za parking. Rano można dojechać nim znacznie szybciej niż autobusem, {4} w centrum stoją długie korki. Wielu pracodawców wie już, {5} pracownik, który rano trochę poćwiczy, pracuje potem lepiej.", "g": [{"a": "dlatego", "f": "skutek", "w": "<b>dlatego</b> = bu nedenle. Önceki cümle sebep, sonraki sonuçtur.", "e": "Poprawny spójnik: <b>dlatego</b>. Funkcja: skutek."}, {"a": "bo", "f": "przyczyna", "w": "<b>bo</b> = çünkü (günlük dilde en sık kullanılan biçim). Cümle başında kullanılmaz.", "e": "Poprawny spójnik: <b>bo</b>. Funkcja: przyczyna."}, {"a": "ani", "f": "podwójne przeczenie", "w": "<b>ani</b> yalnızca <b>olumsuz</b> cümlede işler: <i>nie trzeba płacić za paliwo ani za parking</i>.", "e": "Poprawny spójnik: <b>ani</b>. Funkcja: podwójne przeczenie. Przykład: <i>nie trzeba płacić za paliwo ani za parking</i>."}, {"a": "kiedy", "f": "czas / warunek", "w": "<b>kiedy</b> = -diği zaman. Burada trafiğin olduğu durumu belirtir.", "e": "Poprawny spójnik: <b>kiedy</b>. Funkcja: czas / warunek."}, {"a": "że", "f": "zdanie dopełnieniowe", "w": "<b>wiedzieć + że</b>. <i>Wie, że pracownik pracuje lepiej.</i>", "e": "Poprawny spójnik: <b>że</b>. Funkcja: zdanie dopełnieniowe. Przykład: <i>Wie, że pracownik pracuje lepiej.</i>."}]}, {"id": 4, "topic": "Praca zdalna — plusy i minusy", "bank": ["ponieważ", "więc", "jednak", "który", "jeśli", "żeby", "ani"], "example": "ponieważ", "unused": "ani", "text": "Wiele firm pozwala dziś pracować z domu, @E@ oszczędza to czas i pieniądze. Pracownik nie musi codziennie dojeżdżać do biura, {1} może zacząć dzień znacznie spokojniej. Trzeba {2} pamiętać, że praca zdalna ma też swoje minusy. Człowiek, {3} pracuje sam w domu, po kilku miesiącach często czuje się samotny. {4} chcemy uniknąć takiego problemu, warto raz w tygodniu spotkać się z całym zespołem. Dobrze jest też ustalić stałe godziny pracy, {5} wieczorem naprawdę odpocząć.", "g": [{"a": "więc", "f": "wniosek", "w": "<b>więc</b> = dolayısıyla. Mantıklı sonucu bağlar.", "e": "Poprawny spójnik: <b>więc</b>. Funkcja: wniosek."}, {"a": "jednak", "f": "przeciwstawienie", "w": "<b>jednak</b> = ancak/yine de. Cümlenin <b>içine</b> girer: <i>Trzeba jednak pamiętać…</i>", "e": "Poprawny spójnik: <b>jednak</b>. Funkcja: przeciwstawienie. Przykład: <i>Trzeba jednak pamiętać…</i>."}, {"a": "który", "f": "zdanie względne", "w": "<b>który</b> = ilgi zamiri; <i>człowiek</i> eril tekil olduğu için <b>który</b>.", "e": "Poprawny spójnik: <b>który</b>. Funkcja: zdanie względne. Przykład: <i>człowiek</i>."}, {"a": "Jeśli", "f": "warunek", "w": "<b>jeśli</b> = eğer. Şart cümlesi kurar.", "e": "Poprawny spójnik: <b>Jeśli</b>. Funkcja: warunek."}, {"a": "żeby", "f": "cel", "w": "<b>żeby</b> + mastar = -mek için: <i>żeby wieczorem odpocząć</i>.", "e": "Poprawny spójnik: <b>żeby</b>. Funkcja: cel. Przykład: <i>żeby wieczorem odpocząć</i>."}]}, {"id": 5, "topic": "Jak uczyć się języka obcego", "bank": ["kiedy", "bo", "że", "a", "żeby", "dlatego", "czyli"], "example": "kiedy", "unused": "czyli", "text": "Najlepiej uczyć się języka obcego wtedy, @E@ mamy konkretny cel. Ktoś, kto chce pracować za granicą, uczy się szybciej, {1} dokładnie wie, po co to robi. Wielu dorosłych mówi, {2} nie ma talentu do języków. To zwykle nieprawda — problemem jest brak czasu, {3} nie brak zdolności. Warto uczyć się codziennie po dwadzieścia minut, {4} zapamiętać słowa naprawdę trwale. Regularność jest ważniejsza niż długie weekendowe sesje, {5} nauczyciele powtarzają to na prawie każdej lekcji.", "g": [{"a": "bo", "f": "przyczyna", "w": "<b>bo</b> = çünkü. Neden bildirir.", "e": "Poprawny spójnik: <b>bo</b>. Funkcja: przyczyna."}, {"a": "że", "f": "zdanie dopełnieniowe", "w": "<b>mówić + że</b>. Aktarım cümlesi.", "e": "Poprawny spójnik: <b>że</b>. Funkcja: zdanie dopełnieniowe."}, {"a": "a", "f": "przeciwstawienie", "w": "<b>a</b> = ise/oysa. İki şeyi karşı karşıya koyar: <i>brak czasu, a nie brak zdolności</i>.", "e": "Poprawny spójnik: <b>a</b>. Funkcja: przeciwstawienie. Przykład: <i>brak czasu, a nie brak zdolności</i>."}, {"a": "żeby", "f": "cel", "w": "<b>żeby</b> + mastar = -mek için.", "e": "Poprawny spójnik: <b>żeby</b>. Funkcja: cel."}, {"a": "dlatego", "f": "skutek", "w": "<b>dlatego</b> = bu yüzden. Öğretmenlerin tekrarlamasının sebebi önceki cümledir.", "e": "Poprawny spójnik: <b>dlatego</b>. Funkcja: skutek."}]}, {"id": 6, "topic": "Zakupy przez internet", "bank": ["ponieważ", "albo", "bo", "jeśli", "gdzie", "że", "ani"], "example": "ponieważ", "unused": "ani", "text": "Zakupy przez internet są dziś bardzo popularne, @E@ można je zrobić o każdej porze dnia i nocy. Wystarczy telefon {1} komputer i kilka minut wolnego czasu. Sklepy internetowe są zwykle tańsze, {2} nie muszą płacić za duże lokale w centrum miasta. Trzeba jednak uważać: {3} kupujemy ubrania, nie możemy ich wcześniej przymierzyć. Dlatego warto wybierać sklepy, {4} zwrot towaru jest darmowy. Pamiętajmy też, {5} opinie innych klientów są często najlepszą informacją o produkcie.", "g": [{"a": "albo", "f": "alternatywa", "w": "<b>albo</b> = veya. İki seçenekten biri.", "e": "Poprawny spójnik: <b>albo</b>. Funkcja: alternatywa."}, {"a": "bo", "f": "przyczyna", "w": "<b>bo</b> = çünkü. (<i>ponieważ</i> zaten örnek olarak kullanıldı.)", "e": "Poprawny spójnik: <b>bo</b>. Funkcja: przyczyna. Przykład: <i>ponieważ</i>."}, {"a": "jeśli", "f": "warunek", "w": "<b>jeśli</b> = eğer. Şart cümlesi.", "e": "Poprawny spójnik: <b>jeśli</b>. Funkcja: warunek."}, {"a": "gdzie", "f": "zdanie względne (miejsce)", "w": "<b>gdzie</b> = -diği yer. Bir mekânı niteler: <i>sklepy, gdzie zwrot jest darmowy</i>.", "e": "Poprawny spójnik: <b>gdzie</b>. Funkcja: zdanie względne (miejsce). Przykład: <i>sklepy, gdzie zwrot jest darmowy</i>."}, {"a": "że", "f": "zdanie dopełnieniowe", "w": "<b>pamiętać + że</b>.", "e": "Poprawny spójnik: <b>że</b>. Funkcja: zdanie dopełnieniowe."}]}, {"id": 7, "topic": "Dzieci i ekrany", "bank": ["że", "żeby", "lecz", "które", "jeśli", "a", "ani"], "example": "że", "unused": "ani", "text": "Rodzice często martwią się, @E@ ich dzieci spędzają zbyt dużo czasu przed ekranem. Specjaliści radzą, {1} ustalić jasne zasady już od pierwszych lat. Telefon nie jest zły sam w sobie, {2} sposób jego używania może naprawdę szkodzić. Dziecko, {3} ma stałe godziny na zabawę i naukę, dużo łatwiej akceptuje ograniczenia. {4} rodzice sami siedzą cały wieczór w telefonie, trudno wymagać czegoś innego od dzieci. Najlepiej więc zacząć od siebie, {5} dopiero potem rozmawiać o zasadach.", "g": [{"a": "żeby", "f": "cel / rada", "w": "<b>radzić + żeby</b> = -mesini tavsiye etmek.", "e": "Poprawny spójnik: <b>żeby</b>. Funkcja: cel / rada."}, {"a": "lecz", "f": "przeciwstawienie", "w": "<b>lecz</b> = ama (resmî). <i>nie … , lecz …</i> kalıbı çok yaygındır.", "e": "Poprawny spójnik: <b>lecz</b>. Funkcja: przeciwstawienie. Przykład: <i>nie … , lecz …</i>."}, {"a": "które", "f": "zdanie względne", "w": "<i>dziecko</i> nötr tekil olduğu için ilgi zamiri <b>które</b> olur (<i>który</i> değil).", "e": "Poprawny spójnik: <b>które</b>. Funkcja: zdanie względne. Przykład: <i>dziecko</i>."}, {"a": "Jeśli", "f": "warunek", "w": "<b>jeśli</b> = eğer.", "e": "Poprawny spójnik: <b>Jeśli</b>. Funkcja: warunek."}, {"a": "a", "f": "kolejność / przeciwstawienie", "w": "<b>a</b> burada „ve ancak sonra” anlamı taşır: <i>zacząć od siebie, a dopiero potem rozmawiać</i>.", "e": "Poprawny spójnik: <b>a</b>. Funkcja: kolejność / przeciwstawienie. Przykład: <i>zacząć od siebie, a dopiero potem rozmawiać</i>."}]}, {"id": 8, "topic": "Zieleń w mieście", "bank": ["dlatego", "oraz", "gdzie", "ponieważ", "gdy", "że", "żeby"], "example": "dlatego", "unused": "żeby", "text": "Mieszkańcy dużych miast coraz częściej proszą o więcej zieleni, @E@ władze sadzą tysiące nowych drzew. Drzewa dają cień {1} czystsze powietrze, a latem obniżają temperaturę nawet o kilka stopni. Parki są też miejscem, {2} ludzie odpoczywają po pracy i spotykają sąsiadów. Niestety w centrum brakuje wolnego miejsca, {3} nowe budynki powstają bardzo szybko. Warto o tym pamiętać, {4} planujemy kolejne inwestycje. Naukowcy nie mają dziś żadnych wątpliwości, {5} zielone miasto jest po prostu zdrowsze.", "g": [{"a": "oraz", "f": "łączenie", "w": "<b>oraz</b> = ve. İki nesneyi ekler (<i>i</i> ile aynı işlev, daha resmî).", "e": "Poprawny spójnik: <b>oraz</b>. Funkcja: łączenie. Przykład: <i>i</i>."}, {"a": "gdzie", "f": "zdanie względne (miejsce)", "w": "<b>gdzie</b> = -diği yer: <i>miejscem, gdzie ludzie odpoczywają</i>.", "e": "Poprawny spójnik: <b>gdzie</b>. Funkcja: zdanie względne (miejsce). Przykład: <i>miejscem, gdzie ludzie odpoczywają</i>."}, {"a": "ponieważ", "f": "przyczyna", "w": "<b>ponieważ</b> = çünkü. Yer kalmamasının nedeni.", "e": "Poprawny spójnik: <b>ponieważ</b>. Funkcja: przyczyna."}, {"a": "gdy", "f": "czas", "w": "<b>gdy</b> = -diği zaman (<i>kiedy</i> ile eş anlamlı).", "e": "Poprawny spójnik: <b>gdy</b>. Funkcja: czas. Przykład: <i>kiedy</i>."}, {"a": "że", "f": "zdanie dopełnieniowe", "w": "<b>nie mieć wątpliwości + że</b> = -dığından şüphesi olmamak.", "e": "Poprawny spójnik: <b>że</b>. Funkcja: zdanie dopełnieniowe."}]}, {"id": 9, "topic": "Marta — wolontariat w schronisku", "bank": ["które", "chociaż", "oraz", "że", "jeśli", "żeby", "czyli"], "example": "które", "unused": "czyli", "text": "Marta jest jedną z tych osób, @E@ potrafią pomagać innym bez rozgłosu. Od trzech lat pracuje w schronisku dla zwierząt, {1} nikt jej za to nie płaci. Wychodzi z psami na spacer, sprząta boksy {2} pomaga nowym właścicielom w adopcjach. Mówi, {3} zwierzęta dają jej dużo więcej energii, niż zabierają. {4} ktoś chce zostać wolontariuszem, wystarczy przyjść i porozmawiać z opiekunem. Warto spróbować choćby raz, {5} przekonać się, czy to zajęcie dla nas.", "g": [{"a": "chociaż", "f": "przyzwolenie", "w": "<b>chociaż</b> = -mesine rağmen. Beklenmedik durumu bağlar: para almıyor <i>ama yine de</i> çalışıyor.", "e": "Poprawny spójnik: <b>chociaż</b>. Funkcja: przyzwolenie. Przykład: <i>ama yine de</i>."}, {"a": "oraz", "f": "łączenie", "w": "<b>oraz</b> = ve. Sıralanan üçüncü eylemi ekler.", "e": "Poprawny spójnik: <b>oraz</b>. Funkcja: łączenie."}, {"a": "że", "f": "zdanie dopełnieniowe", "w": "<b>mówić + że</b>.", "e": "Poprawny spójnik: <b>że</b>. Funkcja: zdanie dopełnieniowe."}, {"a": "Jeśli", "f": "warunek", "w": "<b>jeśli</b> = eğer.", "e": "Poprawny spójnik: <b>Jeśli</b>. Funkcja: warunek."}, {"a": "żeby", "f": "cel", "w": "<b>żeby</b> + mastar = -mek için: <i>żeby przekonać się</i>.", "e": "Poprawny spójnik: <b>żeby</b>. Funkcja: cel. Przykład: <i>żeby przekonać się</i>."}]}, {"id": 10, "topic": "Jak naprawdę poznać kraj", "bank": ["jeśli", "oraz", "gdzie", "ale", "bo", "że", "żeby"], "example": "jeśli", "unused": "żeby", "text": "@E@ chcemy naprawdę poznać jakiś kraj, nie wystarczy zobaczyć jego najsłynniejszych zabytków. Trzeba porozmawiać z mieszkańcami, spróbować lokalnej kuchni {1} pojechać tam, {2} nie jeżdżą turystyczne autokary. Wielu turystów wraca do domu z setkami zdjęć, {3} bez jednej ciekawej rozmowy. Warto więc nauczyć się przynajmniej kilku słów w miejscowym języku, {4} ludzie reagują wtedy zupełnie inaczej. Przewodnicy powtarzają, {5} najlepsze wspomnienia z podróży to zawsze ludzie, a nie budynki.", "g": [{"a": "oraz", "f": "łączenie", "w": "<b>oraz</b> = ve. Sıralamadaki son öğeyi ekler.", "e": "Poprawny spójnik: <b>oraz</b>. Funkcja: łączenie."}, {"a": "gdzie", "f": "zdanie względne (miejsce)", "w": "<b>gdzie</b> = -diği yer: <i>tam, gdzie nie jeżdżą autokary</i>.", "e": "Poprawny spójnik: <b>gdzie</b>. Funkcja: zdanie względne (miejsce). Przykład: <i>tam, gdzie nie jeżdżą autokary</i>."}, {"a": "ale", "f": "przeciwstawienie", "w": "<b>ale</b> = ama. Beklenen ile gerçek arasındaki zıtlık.", "e": "Poprawny spójnik: <b>ale</b>. Funkcja: przeciwstawienie."}, {"a": "bo", "f": "przyczyna", "w": "<b>bo</b> = çünkü. Birkaç kelime öğrenmenin nedeni.", "e": "Poprawny spójnik: <b>bo</b>. Funkcja: przyczyna."}, {"a": "że", "f": "zdanie dopełnieniowe", "w": "<b>powtarzać + że</b>.", "e": "Poprawny spójnik: <b>że</b>. Funkcja: zdanie dopełnieniowe."}]}], "czasowniki": [{"id": 1, "topic": "Sara z Anglii — dom w Polsce", "ex": [{"f": "planowałam", "inf": "planować"}, {"f": "mówi", "inf": "mówić"}], "text": "„W roku 1997 odwiedziłam Polskę po raz pierwszy i nie @E1@ tu zostać” – @E2@ Sara, inżynier z Anglii.\n„Kiedy, po sześciu latach pracy w Tajlandii, {1} do Polski, była z e": "Poprawna forma: <b>kupił</b>. Czas przeszły. Przykład: <i>dziadek</i>."}, {"h": "jeździć", "a": ["jeździł"], "t": "przeszły", "w": "Özne <i>samochód</i> (eril tekil) → <b>jeździł</b>.", "e": "Poprawna forma: <b>jeździł</b>. Czas przeszły. Przykład: <i>samochód</i>."}, {"h": "psuć się", "a": ["psuł się", "psuł"], "t": "przeszły", "w": "<i>prawie nigdy nie psuł się</i> → geçmiş 3. tekil eril: <b>psuł się</b>.", "e": "Poprawna forma: <b>psuł się</b>. Czas przeszły. Przykład: <i>prawie nigdy nie psuł się</i>."}, {"h": "dbać", "a": ["dbał"], "t": "przeszły", "w": "Özne <i>dziadek</i> → <b>dbał</b>.", "e": "Poprawna forma: <b>dbał</b>. Czas przeszły. Przykład: <i>dziadek</i>."}, {"h": "my – jeździć", "a": ["jeździliśmy"], "t": "przeszły", "w": "1. çoğul eril şahıs geçmiş → <b>jeździliśmy</b>.", "e": "Poprawna forma: <b>jeździliśmy</b>. Czas przeszły."}, {"h": "przestać", "a": ["przestał"], "t": "przeszły", "w": "Özne <i>silnik</i> (eril tekil) → <b>przestał</b>.", "e": "Poprawna forma: <b>przestał</b>. Czas przeszły. Przykład: <i>silnik</i>."}, {"h": "stać", "a": ["stoi"], "t": "teraźniejszy", "w": "<i>Teraz</i> → şimdiki 3. tekil: <b>stoi</b> (stać: stoję, stoisz, stoi).", "e": "Poprawna forma: <b>stoi</b>. Czas teraźniejszy. Przykład: <i>Teraz</i>."}, {"h": "czekać", "a": ["czeka"], "t": "teraźniejszy", "w": "Özne <i>samochód</i> → şimdiki 3. tekil: <b>czeka</b>.", "e": "Poprawna forma: <b>czeka</b>. Czas teraźniejszy. Przykład: <i>samochód</i>."}, {"h": "chcieć", "a": ["chce"], "t": "teraźniejszy", "w": "Özne <i>tata</i> (3. tekil) → <b>chce</b>.", "e": "Poprawna forma: <b>chce</b>. Czas teraźniejszy. Przykład: <i>tata</i>."}, {"h": "brakować", "a": ["brakuje"], "t": "teraźniejszy", "w": "<i>ciągle brakuje mu czasu</i> → 3. tekil: <b>brakuje</b>.", "e": "Poprawna forma: <b>brakuje</b>. Czas teraźniejszy. Przykład: <i>ciągle brakuje mu czasu</i>."}]}, {"id": 9, "topic": "Dzień pani Anny", "ex": [{"f": "pracuje", "inf": "pracować"}, {"f": "mieszka", "inf": "mieszkać"}], "text": "Pani Anna @E1@ w banku i @E2@ na przedmieściach z rodziną.\nAnna {1} codziennie o wpół do siódmej. Najpierw {2} i {3}, a potem {4} śniadanie dla całej rodziny. Jej dzieci {5} do szkoły niedaleko domu.\nO ósmej Anna {6} do pracy i {7} dopiero po piątej. Wczoraj jednak {8} w domu, bo źle się czuła. Cały dzień {9} w łóżku i {10} gorącą herbatę z cytryną.", "g": [{"h": "wstawać", "a": ["wstaje"], "t": "teraźniejszy", "w": "<i>codziennie</i> → şimdiki 3. tekil: <b>wstaje</b> (wstawać: wstaję, wstajesz, wstaje).", "e": "Poprawna forma: <b>wstaje</b>. Czas teraźniejszy. Przykład: <i>codziennie</i>."}, {"h": "myć się", "a": ["myje się", "myje"], "t": "teraźniejszy", "w": "3. tekil şimdiki → <b>myje się</b>.", "e": "Poprawna forma: <b>myje się</b>. Czas teraźniejszy."}, {"h": "ubierać się", "a": ["ubiera się", "ubiera"], "t": "teraźniejszy", "w": "3. tekil şimdiki → <b>ubiera się</b>.", "e": "Poprawna forma: <b>ubiera się</b>. Czas teraźniejszy."}, {"h": "przygotowywać", "a": ["przygotowuje"], "t": "teraźniejszy", "w": "3. tekil şimdiki → <b>przygotowuje</b> (‑uje).", "e": "Poprawna forma: <b>przygotowuje</b>. Czas teraźniejszy."}, {"h": "chodzić", "a": ["chodzą"], "t": "teraźniejszy", "w": "Özne <i>dzieci</i> (eril olmayan çoğul) → <b>chodzą</b>.", "e": "Poprawna forma: <b>chodzą</b>. Czas teraźniejszy. Przykład: <i>dzieci</i>."}, {"h": "wychodzić", "a": ["wychodzi"], "t": "teraźniejszy", "w": "3. tekil şimdiki → <b>wychodzi</b>.", "e": "Poprawna forma: <b>wychodzi</b>. Czas teraźniejszy."}, {"h": "wracać", "a": ["wraca"], "t": "teraźniejszy", "w": "3. tekil şimdiki → <b>wraca</b>.", "e": "Poprawna forma: <b>wraca</b>. Czas teraźniejszy."}, {"h": "ona – zostać", "a": ["została"], "t": "przeszły", "w": "<i>Wczoraj</i> + Anna (dişil) → geçmiş 3. tekil: <b>została</b>.", "e": "Poprawna forma: <b>została</b>. Czas przeszły. Przykład: <i>Wczoraj</i>."}, {"h": "ona – leżeć", "a": ["leżała"], "t": "przeszły", "w": "<i>Cały dzień</i> + dişil → geçmiş: <b>leżała</b>.", "e": "Poprawna forma: <b>leżała</b>. Czas przeszły. Przykład: <i>Cały dzień</i>."}, {"h": "pić", "a": ["piła"], "t": "przeszły", "w": "Özne Anna (dişil) → geçmiş 3. tekil: <b>piła</b>.", "e": "Poprawna forma: <b>piła</b>. Czas przeszły."}]}, {"id": 10, "topic": "Szkolna wycieczka do Krakowa", "ex": [{"f": "organizuje", "inf": "organizować"}, {"f": "lubią", "inf": "lubić"}], "text": "Nasza szkoła co roku @E1@ wycieczki, a uczniowie bardzo je @E2@.\nW maju cała nasza klasa {1} na wycieczkę do Krakowa. Rano {2} przed szkołą i {3} do autokaru. Podróż {4} prawie trzy godziny.\nW Krakowie najpierw {5} Wawel, a potem {6} po Rynku. Nasza nauczycielka {7} nam o historii miasta. Niektórzy uczniowie {8} pamiątki, a inni {9} zdjęcia.\nWieczorem wszyscy {10} bardzo zmęczeni, ale zadowoleni.", "g": [{"h": "pojechać", "a": ["pojechała"], "t": "przeszły", "w": "Özne <i>klasa</i> (dişil tekil) → <b>pojechała</b>.", "e": "Poprawna forma: <b>pojechała</b>. Czas przeszły. Przykład: <i>klasa</i>."}, {"h": "my – spotkać się", "a": ["spotkaliśmy się", "spotkaliśmy"], "t": "przeszły", "w": "1. çoğul eril şahıs geçmiş → <b>spotkaliśmy się</b>.", "e": "Poprawna forma: <b>spotkaliśmy się</b>. Czas przeszły."}, {"h": "my – wsiąść", "a": ["wsiedliśmy"], "t": "przeszły", "w": "Düzensiz: 1. çoğul → <b>wsiedliśmy</b> (wsiąść: wsiadł, wsiedli).", "e": "Poprawna forma: <b>wsiedliśmy</b>. Czas przeszły."}, {"h": "trwać", "a": ["trwała"], "t": "przeszły", "w": "Özne <i>podróż</i> (dişil) → <b>trwała</b>.", "e": "Poprawna forma: <b>trwała</b>. Czas przeszły. Przykład: <i>podróż</i>."}, {"h": "my – zwiedzać", "a": ["zwiedzaliśmy"], "t": "przeszły", "w": "1. çoğul geçmiş → <b>zwiedzaliśmy</b>.", "e": "Poprawna forma: <b>zwiedzaliśmy</b>. Czas przeszły."}, {"h": "my – spacerować", "a": ["spacerowaliśmy"], "t": "przeszły", "w": "1. çoğul geçmiş → <b>spacerowaliśmy</b>.", "e": "Poprawna forma: <b>spacerowaliśmy</b>. Czas przeszły."}, {"h": "opowiadać", "a": ["opowiadała"], "t": "przeszły", "w": "Özne <i>nauczycielka</i> (dişil) → <b>opowiadała</b>.", "e": "Poprawna forma: <b>opowiadała</b>. Czas przeszły. Przykład: <i>nauczycielka</i>."}, {"h": "kupować", "a": ["kupowali"], "t": "przeszły", "w": "Özne <i>uczniowie</i> (eril şahıs çoğul) → <b>kupowali</b>.", "e": "Poprawna forma: <b>kupowali</b>. Czas przeszły. Przykład: <i>uczniowie</i>."}, {"h": "robić", "a": ["robili"], "t": "przeszły", "w": "Özne <i>inni</i> (eril şahıs çoğul) → <b>robili</b>.", "e": "Poprawna forma: <b>robili</b>. Czas przeszły. Przykład: <i>inni</i>."}, {"h": "być", "a": ["byli"], "t": "przeszły", "w": "Özne <i>wszyscy</i> (eril şahıs çoğul) → <b>byli</b>.", "e": "Poprawna forma: <b>byli</b>. Czas przeszły. Przykład: <i>wszyscy</i>."}]}], "aspekt": [{"id": 1, "topic": "Adam i Piotr — gdyby mieć dużo pieniędzy", "ex": [{"o": ["Próbowałbym", "Spróbuj", "Spróbuje"], "c": 1}, {"o": ["mógłbyś", "mógłby", "może"], "c": 0}], "text": "Adam: @E1@ sobie wyobrazić, co @E2@ zrobić, gdybyś miał dużo pieniędzy! {1}, czy wtedy ty i twoja żona od razu {2} wszystko, o czym marzycie?\nPiotr: Nie wiem, {3} się dłużej nad tym zastanowić. Myślę jednak, że często byśmy {4} innym.\nAdam: W jaki sposób?\nPiotr: Moja córka pewnie {5}, żeby kupić jedzenie dla bezdomnych zwierząt, a syn by {6} dać pieniądze na nowe ubrania sportowe dla szkolnej drużyny piłkarskiej. I już słyszę głos żony: „Kochani! Proszę was, {7} o naszym dziadku. Trzeba mu pomóc wyremontować dom. {8} w nim wygodnie resztę życia”. Jestem pewien, że właśnie tam {9} w pierwszej kolejności.\nAdam: Wiele osób, wiele pomysłów. Może niech każdy z was {10} swój pomysł na kartce, a potem zrobicie losowanie.\nPiotr: Dziękuję za radę, ale to tylko piękne marzenia.", "g": [{"o": ["Powiedziałbyś", "Mówcie", "Powiedz"], "c": 2, "w": "Adam tek kişiye (<i>ty</i>) sesleniyor → <b>tryb rozkazujący</b>, 2. tekil: <i>Powiedz</i>. <i>Mówcie</i> çoğul, <i>Powiedziałbyś</i> şart kipi.", "e": "Poprawna forma: <b>Powiedz</b>. To tryb rozkazujący."}, {"o": ["kupujcie", "kupilibyście", "kupiliby"], "c": 1, "w": "<i>ty i twoja żona</i> = <b>wy</b> ve cümle varsayımsal (<i>gdybyś miał…</i>) → <b>tryb przypuszczający</b>, 2. çoğul: <i>kupilibyście</i>.", "e": "Poprawna forma: <b>kupilibyście</b>. To tryb przypuszczający."}, {"o": ["musiałem", "musiałbym", "musiałybyśmy"], "c": 1, "w": "<i>Ja</i> (Piotr, eril) + varsayım → <b>musiałbym</b>. <i>musiałem</i> düz geçmiş, <i>musiałybyśmy</i> dişil çoğul.", "e": "Poprawna forma: <b>musiałbym</b>."}, {"o": ["pomogli", "pomagaliśmy", "pomagali"], "c": 2, "w": "<b>byśmy</b> zaten şahıs ekini taşıyor → fiil yalın geçmiş biçimde kalır. <i>często</i> = tekrar → <b>aspekt niedokonany</b>: <i>pomagali</i>.", "e": "Poprawna forma: <b>pomagali</b>. To aspekt niedokonany."}, {"o": ["proponowałabym", "proponuje", "zaproponowałaby"], "c": 2, "w": "<i>Moja córka</i> = 3. tekil dişil + <i>pewnie</i> (varsayım) → <b>zaproponowałaby</b>.", "e": "Poprawna forma: <b>zaproponowałaby</b>."}, {"o": ["wolałby", "wolał", "woli"], "c": 1, "w": "<b>by</b> cümlede ayrı yazılmış (<i>syn by…</i>), bu yüzden fiil yalın kalır: <i>wolał</i>. <i>wolałby</i> olsaydı <i>by</i> iki kez geçerdi.", "e": "Poprawna forma: <b>wolał</b>."}, {"o": ["pamiętajcie", "pamiętalibyśmy", "zapamiętajcie"], "c": 0, "w": "<i>Proszę was</i> → 2. çoğul emir. <i>pamiętać o kimś</i> (niedokonany) = birini unutmamak; <i>zapamiętać</i> = ezberlemek.", "e": "Poprawna forma: <b>pamiętajcie</b>."}, {"o": ["Niech spędzi", "Spędzałby", "Spędziłaby"], "c": 0, "w": "3. kişi için emir <b>niech + fiil</b> ile kurulur: <i>Niech spędzi</i> (dziadek).", "e": "Poprawna forma: <b>Niech spędzi</b>."}, {"o": ["pojechalibyśmy", "jedźmy", "pojechaliby"], "c": 0, "w": "<i>my</i> (aile) + varsayım → <b>pojechalibyśmy</b>. <i>jedźmy</i> emir, <i>pojechaliby</i> 3. çoğul.", "e": "Poprawna forma: <b>pojechalibyśmy</b>."}, {"o": ["piszcie", "napiszcie", "napisze"], "c": 2, "w": "<i>niech każdy…</i> → 3. <b>tekil</b> ve tek seferlik iş → dokonany: <i>napisze</i>.", "e": "Poprawna forma: <b>napisze</b>."}]}, {"id": 2, "topic": "Tomek i Mateusz — rada dziadka", "ex": [{"o": ["pamiętajmy", "zapamiętajmy", "niech pamiętają"], "c": 0}, {"o": ["gdybym", "gdybyś", "gdybyśmy"], "c": 2}, {"o": ["słuchali", "posłuchał", "posłuchali"], "c": 2}], "text": "Tomek i Mateusz są braćmi. Tomek często wspomina ich wspólną decyzję sprzed lat: „I ty, i ja @E1@, że @E2@ 10 lat temu @E3@ rady dziadka, dziś {1} pilotami”. Mateusz odpowiedział: „Gdybym tylko wtedy {2}, co planuje dziadek…”.\nChłopcy dopiero zaczynali liceum i bardzo interesowali się lotnictwem. Gdyby {3}, spędzaliby całe dnie na lotnisku, {4} samoloty i pilotów. Pewnego dnia dziadek powiedział do nich obu: „{5} jak najlepiej liceum i {6} na studia do Kanady. Ja wam dam pieniądze”. Chłopcy roześmiali się i powiedzieli: „Dziadku, nie {7}! Skąd {8} tyle pieniędzy?”. Gdyby wtedy {9} słowa dziadka poważnie, to dziś ich kariery zawodowe {10} inaczej. Dużo później okazało się, że dziadek całe życie oszczędzał, żeby zrealizować ich marzenia.", "g": [{"o": ["byliśmy", "bylibyśmy", "byli"], "c": 1, "w": "Gerçek dışı sonuç cümlesi (<i>gdybyśmy… , dziś…</i>) → <b>bylibyśmy</b>.", "e": "Poprawna forma: <b>bylibyśmy</b>."}, {"o": ["wiedział", "wiedziałem", "wiedzieli"], "c": 0, "w": "<b>Gdybym</b> zaten <i>by + m</i> içeriyor → fiil yalın: <i>wiedział</i>.", "e": "Poprawna forma: <b>wiedział</b>."}, {"o": ["mogli", "mogły", "mogliby"], "c": 0, "w": "<b>Gdyby</b> + yalın geçmiş; özne <i>chłopcy</i> = eril şahıs çoğul → <i>mogli</i>.", "e": "Poprawna forma: <b>mogli</b>."}, {"o": ["poznawałyby", "poznaj", "poznawaliby"], "c": 2, "w": "<i>spędzaliby…</i> ile paralel: eril şahıs çoğul şart → <b>poznawaliby</b>.", "e": "Poprawna forma: <b>poznawaliby</b>."}, {"o": ["Kończyliby", "Skończcie", "Skończ"], "c": 1, "w": "Dede <b>ikisine birden</b> sesleniyor (<i>do nich obu</i>) → 2. çoğul emir: <i>Skończcie</i>.", "e": "Poprawna forma: <b>Skończcie</b>."}, {"o": ["pojedź", "jedźcie", "pojechaliby"], "c": 1, "w": "Aynı şekilde 2. çoğul emir: <i>jedźcie</i>. <i>pojedź</i> tekil.", "e": "Poprawna forma: <b>jedźcie</b>."}, {"o": ["żartuj", "zażartowałbyś", "zażartujcie"], "c": 0, "w": "Dedeye tekil hitap + <b>olumsuz emir</b> → niedokonany: <i>nie żartuj</i>.", "e": "Poprawna forma: <b>żartuj</b>."}, {"o": ["weź", "brałby", "wziąłbyś"], "c": 2, "w": "<i>Skąd wziąłbyś…?</i> = nereden bulurdun? 2. tekil şart kipi.", "e": "Poprawna forma: <b>wziąłbyś</b>."}, {"o": ["traktowaliśmy", "potraktowali", "potraktowaliby"], "c": 1, "w": "<b>Gdyby</b> zaten <i>by</i> içeriyor → yalın geçmiş: <i>potraktowali</i>.", "e": "Poprawna forma: <b>potraktowali</b>."}, {"o": ["wyglądajmy", "wyglądałby", "wyglądałyby"], "c": 2, "w": "Özne <i>kariery</i> = eril şahıs olmayan çoğul → <b>wyglądałyby</b>.", "e": "Poprawna forma: <b>wyglądałyby</b>."}]}, {"id": 3, "topic": "Ewa i Marek — remont kuchni", "ex": [{"o": ["pomóż", "pomagajcie", "pomógłbym"], "c": 0}, {"o": ["miała", "miałam", "mieli"], "c": 0}], "text": "Ewa i Marek od miesiąca planują remont kuchni.\nEwa: „Marku, @E1@ mi wybrać kolor ścian! Gdybym @E2@ więcej czasu, poszłabym do sklepu sama”.\nMarek: „Dobrze, ale najpierw {1} dokładnie całą kuchnię, bo bez wymiarów niczego nie kupimy”.\nEwa: „Już to zrobiłam. {2} — wszystko zapisałam w zeszycie”.\nMarek: „Świetnie. Gdybyśmy {3} remont w marcu, dziś kuchnia {4} już gotowa”.\nEwa: „Nie narzekaj. W sobotę {5} całą kuchnię, a płytki położymy w przyszłym tygodniu”.\nMarek: „A stara lodówka? {6} w piwnicy, kupimy nową”.\nEwa: „Dobry pomysł. Tylko {7} starego stołu — babcia by się bardzo zdenerwowała”.\nMarek: „Oczywiście. Gdyby babcia {8} pusty pokój, na pewno by płakała”.\nEwa: „No właśnie. Ja bym {9} odnowić stare meble, niż kupować nowe”.\nMarek: „Zgoda. {10} sąsiada o pomoc, on zna się na drewnie”.", "g": [{"o": ["zmierz", "mierzcie", "zmierzyłby"], "c": 0, "w": "Ewa'ya tekil hitap + tek seferlik iş → dokonany emir: <i>zmierz</i>.", "e": "Poprawna forma: <b>zmierz</b>."}, {"o": ["Zobacz", "Oglądajcie", "Zobaczyłbyś"], "c": 0, "w": "Tek kişiye anlık davet: <b>Zobacz</b> (dokonany). <i>Oglądajcie</i> çoğul ve uzun süreli izleme.", "e": "Poprawna forma: <b>Zobacz</b>."}, {"o": ["zaczęli", "zaczynaliśmy", "zaczęliby"], "c": 0, "w": "<b>Gdybyśmy</b> zaten <i>by + śmy</i> içeriyor → yalın geçmiş: <i>zaczęli</i>.", "e": "Poprawna forma: <b>zaczęli</b>."}, {"o": ["byłaby", "byłyby", "bylibyśmy"], "c": 0, "w": "Özne <i>kuchnia</i> = dişil tekil → <b>byłaby</b>.", "e": "Poprawna forma: <b>byłaby</b>."}, {"o": ["malujmy", "pomalujmy", "pomalowaliby"], "c": 1, "w": "<i>całą kuchnię</i> = bir günde tamamlanacak iş → dokonany 1. çoğul emir: <b>pomalujmy</b>.", "e": "Poprawna forma: <b>pomalujmy</b>."}, {"o": ["Niech zostanie", "Niech zostaną", "Zostałabyś"], "c": 0, "w": "<i>lodówka</i> = 3. tekil → <b>niech zostanie</b>.", "e": "Poprawna forma: <b>Niech zostanie</b>."}, {"o": ["nie wyrzucaj", "nie wyrzuć", "nie wyrzucajcie"], "c": 0, "w": "<b>Olumsuz emir</b> kural olarak niedokonany, hitap tekil → <i>nie wyrzucaj</i>.", "e": "Poprawna forma: <b>nie wyrzucaj</b>."}, {"o": ["zobaczyła", "zobaczyłaby", "zobaczyli"], "c": 0, "w": "<b>Gdyby</b> + yalın geçmiş, özne <i>babcia</i> → <i>zobaczyła</i>.", "e": "Poprawna forma: <b>zobaczyła</b>."}, {"o": ["wolała", "wolałabym", "wolałyby"], "c": 0, "w": "<i>Ja <b>bym</b></i> ayrı yazıldığı için fiil yalın kalır: <i>wolała</i>. <i>wolałabym</i> olsaydı <i>bym</i> tekrarlanırdı.", "e": "Poprawna forma: <b>wolała</b>."}, {"o": ["Poprośmy", "Prosimy", "Poproszą"], "c": 0, "w": "Birlikte hareket önerisi → 1. çoğul emir: <b>Poprośmy</b>.", "e": "Poprawna forma: <b>Poprośmy</b>."}]}, {"id": 4, "topic": "Kuba i przyjaciele — wyjazd w góry", "ex": [{"o": ["planujmy", "zaplanujmy", "zaplanowaliby"], "c": 1}, {"o": ["czekali", "czekaliśmy", "czekaliby"], "c": 0}], "text": "Kuba pisze wiadomość do przyjaciół: „Kochani, @E1@ wreszcie ten wyjazd w góry! Gdybyśmy @E2@ jeszcze miesiąc, nie byłoby już wolnych pokoi.\n{1} proszę bilety do Zakopanego, ja z }, {"o": ["wybiorę", "wybieram", "wybrałbym"], "c": 0, "w": "<i>następnym razem</i> = gelecekte tek seçim → dokonany: <b>wybiorę</b>.", "e": "Poprawna forma: <b>wybiorę</b>."}, {"o": ["Proszę przeczytać", "Proszę czytać", "Przeczytaliby"], "c": 0, "w": "Belirli bir metni bir kez okumak → dokonany mastar: <b>przeczytać</b>.", "e": "Poprawna forma: <b>Proszę przeczytać</b>."}, {"o": ["straciłbym", "straciłem", "stracilibyśmy"], "c": 0, "w": "<i>Gdyby nie…</i> gerçek dışı şart, özne <i>ja</i> → <b>straciłbym</b>.", "e": "Poprawna forma: <b>straciłbym</b>."}]}, {"id": 8, "topic": "Nauczycielka i klasa — wycieczka do Wrocławia", "ex": [{"o": ["przynieście", "przynieś", "przynosiliby"], "c": 0}, {"o": ["mieli", "mieliśmy", "mieliby"], "c": 0}], "text": "Nauczycielka rozmawia z klasą o wycieczce do Wrocławia.\n„Drodzy uczniowie, @E1@ jutro zgody od rodziców. Gdybyśmy @E2@ więcej pieniędzy, pojechalibyśmy na trzy dni, a nie na jeden.\nGdyby ktoś nie mógł jechać, {1} mi o tym do piątku. W autokarze {2} spokojnie i nie chodźcie po schodach.\nWe Wrocławiu najpierw {3} Ostrów Tumski, a potem {4} dwie godziny wolnego czasu. Krzysiek, {5} młodszych kolegów, bo znasz miasto najlepiej.\nGdyby ktoś się zgubił, {6} pod mój numer — mam telefon cały czas przy sobie. Ja bym {7}, żebyście trzymali się razem.\nGdybyście {8} grzeczni, w przyszłym roku pojedziemy do Gdańska. {9} ze sobą kanapki i dużo wody.\nI jeszcze jedno: gdyby nie pan dyrektor, ta wycieczka nigdy by się {10}”.", "g": [{"o": ["niech powie", "niech mówi", "powiedzcie"], "c": 0, "w": "<i>ktoś</i> = 3. tekil + tek seferlik bilgi → <b>niech powie</b>.", "e": "Poprawna forma: <b>niech powie</b>."}, {"o": ["siedźcie", "usiądźcie", "siedziałby"], "c": 0, "w": "Yolculuk boyunca süren durum → niedokonany çoğul emir: <b>siedźcie</b>. <i>usiądźcie</i> = tek anlık oturma.", "e": "Poprawna forma: <b>siedźcie</b>."}, {"o": ["zwiedzimy", "zwiedzamy", "zwiedzalibyśmy"], "c": 0, "w": "Planlanmış, tamamlanacak gelecek → dokonany: <b>zwied Już zamykam. Gdybyśmy {7} ze sobą częściej, nie byłoby takich problemów”.\nPani Kowalska: „Ma pan rację. {8} czasem do mnie na kawę”.\nPan Adam: „Chętnie. Moja żona bardzo by się {9}”.\nPani Kowalska: „To {10} w niedzielę o piątej”.", "g": [{"o": ["zaraz to zrobię", "zaraz to robię", "zaraz bym to zrobił"], "c": 0, "w": "Söz verme, tek seferlik eylem → dokonany gelecek: <b>zrobię</b>.", "e": "Poprawna forma: <b>zaraz to zrobię</b>."}, {"o": ["Niech pan pamięta", "Niech pan zapamięta", "Pamiętajcie"], "c": 0, "w": "Nazik hitap + sürekli hatırda tutma → <b>Niech pan pamięta</b>.", "e": "Poprawna forma: <b>Niech pan pamięta</b>."}, {"o": ["świętowałem", "świętowałbym", "świętujmy"], "c": 0, "w": "Dün olan gerçek olay → düz geçmiş: <b>świętowałem</b>.", "e": "Poprawna forma: <b>świętowałem</b>."}, {"o": ["zaprosił", "zaprosiłby", "zaprosili"], "c": 0, "w": "<b>Gdyby</b> + yalın geçmiş, özne <i>pan</i> → <i>zaprosił</i>.", "e": "Poprawna forma: <b>zaprosił</b>."}, {"o": ["zaproszę", "zapraszam", "zaprosiłbym"], "c": 0, "w": "<i>Następnym razem</i> = gelecekte tek davet → dokonany: <b>zaproszę</b>.", "e": "Poprawna forma: <b>zaproszę</b>."}, {"o": ["proszę zamknąć", "proszę zamykać", "zamknęliby"], "c": 0, "w": "Tek pencere, tek hareket → dokonany mastar: <b>zamknąć</b>.", "e": "Poprawna forma: <b>proszę zamknąć</b>."}, {"o": ["rozmawiali", "rozmawialiśmy", "rozmawialiby"], "c": 0, "w": "<b>Gdybyśmy</b> + yalın geçmiş → <i>rozmawiali</i>.", "e": "Poprawna forma: <b>rozmawiali</b>."}, {"o": ["Niech pan wpada", "Niech pan wpadnie", "Wpadaj"], "c": 0, "w": "<i>czasem</i> = tekrar eden davet → niedokonany: <b>Niech pan wpada</b>.", "e": "Poprawna forma: <b>Niech pan wpada</b>."}, {"o": ["ucieszyła", "ucieszyłaby się", "ucieszyli"], "c": 0, "w": "<i>bardzo by się…</i> — <i>by</i> ayrı → yalın geçmiş dişil: <i>ucieszyła</i>.", "e": "Poprawna forma: <b>ucieszyła</b>."}, {"o": ["niech państwo przyjdą", "przyszedłby", "przychodźcie"], "c": 0, "w": "Karı-kocaya nazik hitap → <b>niech państwo przyjdą</b> (3. çoğul, dokonany).", "e": "Poprawna forma: <b>niech państwo przyjdą</b>."}]}, {"id": 10, "topic": "Kasia i Piotr — marzenia o podróży", "ex": [{"o": ["wyobraź sobie", "wyobrażaj sobie", "wyobraziliby"], "c": 0}, {"o": ["mieli", "mielibyśmy", "mieliście"], "c": 0}], "text": "Kasia i Piotr często rozmawiają o wielkiej podróży dookoła świata.\nKasia: „Piotrze, @E1@, że wygrywamy milion złotych. Gdybyśmy @E2@ tyle pieniędzy, co byśmy zrobili?”\nPiotr: „Ja bym najpierw {1} pracę, bo nie mógłbym siedzieć w biurze”.\nKasia: „A ja {2} mały dom nad jeziorem”.\nPiotr: „Ale gdybyśmy {3} dom, nie moglibyśmy podróżować przez cały rok”.\nKasia: „Masz rację. {4} więc przez okrągły rok!”\nPiotr: „Najpierw {5} do Japonii”.\nKasia: „Tak! I {6} tamtejsze świątynie przez kilka tygodni, spokojnie, bez pośpiechu”.\nPiotr: „A potem {7} do Australii, żeby zobaczyć ocean”.\nKasia: „Tylko co z kotem? Niech Twoja mama {8} nim, ona go uwielbia”.\nPiotr: „Dobry pomysł. {9} jej o tym w niedzielę, kiedy będziemy u niej na obiedzie”.\nKasia: „Gdyby te marzenia się {10}, byłabym najszczęśliwszą osobą na świecie”.", "g": [{"o": ["rzucił", "rzuciłbym", "rzucili"], "c": 0, "w": "<i>Ja <b>bym</b></i> ayrı yazıldı → fiil yalın: <i>rzucił</i>.", "e": "Poprawna forma: <b>rzucił</b>."}, {"o": ["kupiłabym", "kupiłam", "kupiliby"], "c": 0, "w": "Burada <i>bym</i> ayrı değil → birleşik biçim: <b>kupiłabym</b>.", "e": "Poprawna forma: <b>kupiłabym</b>."}, {"o": ["kupili", "kupilibyśmy", "kupowaliśmy"], "c": 0, "w": "<b>Gdybyśmy</b> + yalın geçmiş → <i>kupili</i>.", "e": "Poprawna forma: <b>kupili</b>."}, {"o": ["Podróżujmy", "Podróżujcie", "Podróżowaliby"], "c": 0, "w": "Birlikte karar → 1. çoğul emir: <b>Podróżujmy</b>.", "e": "Poprawna forma: <b>Podróżujmy</b>."}, {"o": ["polecielibyśmy", "polecieliśmy", "polecieliby"], "c": 0, "w": "Hayal kurma, özne <i>my</i> → <b>polecielibyśmy</b>.", "e": "Poprawna forma: <b>polecielibyśmy</b>."}, {"o": ["zwiedzalibyśmy", "zwiedzilibyśmy", "zwiedzaliśmy"], "c": 0, "w": "<i>przez kilka tygodni, bez pośpiechu</i> = süren eylem → niedokonany: <b>zwiedzalibyśmy</b>.", "e": "Poprawna forma: <b>zwiedzalibyśmy</b>."}, {"o": ["pojechalibyśmy", "jedźmy", "pojechaliby"], "c": 0, "w": "Aynı hayal cümlesi, özne <i>my</i> → <b>pojechalibyśmy</b>.", "e": "Poprawna forma: <b>pojechalibyśmy</b>."}, {"o": ["zaopiekuje się", "opiekuje się", "zaopiekujcie się"], "c": 0, "w": "<i>Niech Twoja mama…</i> → 3. tekil, üstlenilen görev → dokonany: <b>zaopiekuje się</b>.", "e": "Poprawna forma: <b>zaopiekuje się</b>."}, {"o": ["Powiedz", "Mów", "Powiedzcie"], "c": 0, "w": "Tek kişiye, tek seferlik konuşma → dokonany tekil: <b>Powiedz</b>.", "e": "Poprawna forma: <b>Powiedz</b>."}, {"o": ["spełniły", "spełniłyby się", "spełnili"], "c": 0, "w": "<b>Gdyby</b> + yalın geçmiş; <i>marzenia</i> eril şahıs olmayan çoğul → <i>spełniły</i>.", "e": "Poprawna forma: <b>spełniły</b>."}]}], "przyimki": [{"id": 1, "topic": "Reklamy w telewizji", "bank": ["bez", "między", "za", "przez", "w", "około", "oprócz"], "example": "przez", "unused": "za", "text": "Badania marketingowe przeprowadzone @E@ znany instytut badawczy pokazują, że przeciętny Polak spędza {1} 5 godzin dziennie na oglądaniu telewizji. {2} tym czasie interesują go głównie programy informacyjne i rozrywkowe. {3} nich ogląda filmy fabularne i wiele reklam, bo {4} promowania najpopularniejszych produktów i usług nie ma dziś telewizji. Coraz dłuższe bloki reklam są emitowane przed każdym kolejnym programem, który pojawia się w danej stacji, a także {5} jego częściami. Polacy są coraz bardziej zmęczeni tak dużą liczbą reklam i chcieliby, żeby było ich o wiele mniej.", "gaps": [{"a": "około", "w": "<b>około</b> = yaklaşık. Sayı/miktar tahmininde kullanılır: <i>około 5 godzin</i>. (+ Dopełniacz)", "e": "Poprawny przyimek: <b>około</b>. Łączy się z: Dopełniacz. Przykład: <i>około 5 godzin</i>."}, {"a": "w", "w": "<b>w tym czasie</b> = bu süre içinde. Zaman dilimi için <i>w</i> + Miejscownik.", "e": "Poprawny przyimek: <b>w</b>. Przykład: <i>w</i>."}, {"a": "oprócz", "w": "<b>oprócz</b> = -in dışında / ayrıca. <i>oprócz nich</i> — bunların dışında. (+ Dopełniacz)", "e": "Poprawny przyimek: <b>oprócz</b>. Łączy się z: Dopełniacz. Przykład: <i>oprócz nich</i>."}, {"a": "bez", "w": "<b>bez</b> = -sız/-siz. <i>bez promowania</i> = tanıtım olmadan. (+ Dopełniacz)", "e": "Poprawny przyimek: <b>bez</b>. Łączy się z: Dopełniacz. Przykład: <i>bez promowania</i>."}, {"a": "między", "w": "<b>między</b> = arasında. <i>między jego częściami</i> — bölümleri arasında. (+ Narzędnik)", "e": "Poprawny przyimek: <b>między</b>. Łączy się z: Narzędnik. Przykład: <i>między jego częściami</i>."}]}, {"id": 2, "topic": "Wakacje Piotra i Oli", "bank": ["do", "w", "nad", "przed", "z", "na", "w"], "example": "w", "unused": "z", "text": "@E@ tym roku Piotr i Ola już kilka miesięcy {1} wakacjami szukali {2} internecie jakiegoś ładnego i niedrogiego domku kampingowego {3} polskim morzem. Chcieli wynająć go {4} trzy tygodnie. Niestety, wybór był niewielki, a ceny tak wysokie, że zdecydowali się na dwutygodniowy wyjazd {5} Grecji.", "gaps": [{"a": "przed", "w": "<b>przed</b> = -den önce. <i>przed wakacjami</i> — tatilden önce. (+ Narzędnik)", "e": "Poprawny przyimek: <b>przed</b>. Łączy się z: Narzędnik. Przykład: <i>przed wakacjami</i>."}, {"a": "w", "w": "<b>w internecie</b> — internette. (+ Miejscownik)", "e": "Poprawny przyimek: <b>w</b>. Łączy się z: Miejscownik."}, {"a": "nad", "w": "<b>nad</b> = (deniz/göl) kıyısında. <i>nad morzem</i> — deniz kenarında. (+ Narzędnik)", "e": "Poprawny przyimek: <b>nad</b>. Łączy się z: Narzędnik. Przykład: <i>nad morzem</i>."}, {"a": "na", "w": "<b>na</b> + Biernik = ne kadar süreliğine. <i>wynająć na trzy tygodnie</i> — üç haftalığına kiralamak.", "e": "Poprawny przyimek: <b>na</b>. Przykład: <i>wynająć na trzy tygodnie</i>."}, {"a": "do", "w": "<b>do</b> = -e/-a doğru (yön). <i>wyjazd do Grecji</i>. (+ Dopełniacz)", "e": "Poprawny przyimek: <b>do</b>. Łączy się z: Dopełniacz. Przykład: <i>wyjazd do Grecji</i>."}]}, {"id": 3, "topic": "Dzień pana Marka", "bank": ["w", "o", "do", "obok", "przy", "po", "dla"], "example": "w", "unused": "dla", "text": "Pan Marek pracuje @E@ dużej firmie informatycznej od pięciu lat. Codziennie wychodzi z domu {1} siódmej rano i jedzie {2} biura autobusem. Zawsze kupuje kawę w małej kawiarni {3} dworca, bo tam jest najlepsza w mieście. Siedzi {4} komputerze prawie osiem godzin dziennie, dlatego często boli go kręgosłup. {5} pracy chodzi na basen, bo lekarz powiedział mu, że musi więcej się ruszać.", "gaps": [{"a": "o", "w": "<b>o</b> + Miejscownik = saatte. <i>o siódmej rano</i> — sabah yedide.", "e": "Poprawny przyimek: <b>o</b>. Przykład: <i>o siódmej rano</i>."}, {"a": "do", "w": "<b>do</b> = -e (yön). <i>jedzie do biura</i> — ofise gidiyor. (+ Dopełniacz)", "e": "Poprawny przyimek: <b>do</b>. Łączy się z: Dopełniacz. Przykład: <i>jedzie do biura</i>."}, {"a": "obok", "w": "<b>obok</b> = yanında/bitişiğinde. <i>obok dworca</i> — garın yanında. (+ Dopełniacz)", "e": "Poprawny przyimek: <b>obok</b>. Łączy się z: Dopełniacz. Przykład: <i>obok dworca</i>."}, {"a": "przy", "w": "<b>przy</b> = başında. <i>siedzieć przy komputerze</i> — bilgisayar başında oturmak. (+ Miejscownik)", "e": "Poprawny przyimek: <b>przy</b>. Łączy się z: Miejscownik. Przykład: <i>siedzieć przy komputerze</i>."}, {"a": "Po", "w": "<b>po</b> = -den sonra. <i>po pracy</i> — işten sonra. (+ Miejscownik)", "e": "Poprawny przyimek: <b>Po</b>. Łączy się z: Miejscownik. Przykład: <i>po pracy</i>."}]}, {"id": 4, "topic": "Sobotnie zakupy", "bank": ["do", "bez", "według", "przed", "po", "z", "za"], "example": "do", "unused": "za", "text": "W sobotę rano Anna zawsze chodzi @E@ supermarketu niedaleko domu. Wcześniej robi listę produktów, bo {1} listy zawsze kupuje za dużo niepotrzebnych rzeczy. {2} tej listy kupuje warzywa, owoce, chleb i mleko. {3} kasą zwykle stoi długa kolejka, więc czasem trzeba czekać nawet piętnaście minut. {4} zakupach Anna wraca do domu {5} ciężkimi torbami i cieszy się, że ma wszystko na cały tydzień.", "gaps": [{"a": "bez", "w": "<b>bez</b> = -sız. <i>bez listy</i> — liste olmadan. (+ Dopełniacz)", "e": "Poprawny przyimek: <b>bez</b>. Łączy się z: Dopełniacz. Przykład: <i>bez listy</i>."}, {"a": "Według", "w": "<b>według</b> = -e göre. <i>według tej listy</i> — bu listeye göre. (+ Dopełniacz)", "e": "Poprawny przyimek: <b>Według</b>. Łączy się z: Dopełniacz. Przykład: <i>według tej listy</i>."}, {"a": "Przed", "w": "<b>przed</b> = önünde. <i>przed kasą</i> — kasanın önünde. (+ Narzędnik)", "e": "Poprawny przyimek: <b>Przed</b>. Łączy się z: Narzędnik. Przykład: <i>przed kasą</i>."}, {"a": "Po", "w": "<b>po</b> = -den sonra. <i>po zakupach</i> — alışverişten sonra. (+ Miejscownik)", "e": "Poprawny przyimek: <b>Po</b>. Łączy się z: Miejscownik. Przykład: <i>po zakupach</i>."}, {"a": "z", "w": "<b>z</b> = ile (beraberlik). <i>z ciężkimi torbami</i> — ağır torbalarla. (+ Narzędnik)", "e": "Poprawny przyimek: <b>z</b>. Łączy się z: Narzędnik. Przykład: <i>z ciężkimi torbami</i>."}]}, {"id": 5, "topic": "Wizyta u lekarza", "bank": ["do", "od", "na", "przez", "po", "z", "u"], "example": "do", "unused": "u", "text": "Wczoraj Tomek musiał iść @E@ lekarza. Gardło bolało go {1} trzech dni i miał wysoką gorączkę. W przychodni czekał {2} wizytę prawie godzinę. Lekarz zbadał go i powiedział, że to zwykła angina. Tomek musi brać antybiotyk {3} tydzień i dużo odpoczywać. {4} wizycie wrócił do domu, a wieczorem kolega przyniósł mu notatki {5} lekcji.", "gaps": [{"a": "od", "w": "<b>od</b> = -den beri. <i>od trzech dni</i> — üç gündür. (+ Dopełniacz)", "e": "Poprawny przyimek: <b>od</b>. Łączy się z: Dopełniacz. Przykład: <i>od trzech dni</i>."}, {"a": "na", "w": "<b>czekać na</b> + Biernik = beklemek. <i>czekać na wizytę</i>.", "e": "Poprawny przyimek: <b>na</b>. Przykład: <i>czekać na wizytę</i>."}, {"a": "przez", "w": "<b>przez</b> + Biernik = boyunca (süre). <i>przez tydzień</i> — bir hafta boyunca.", "e": "Poprawny przyimek: <b>przez</b>. Przykład: <i>przez tydzień</i>."}, {"a": "Po", "w": "<b>po</b> = -den sonra. <i>po wizycie</i> — muayeneden sonra. (+ Miejscownik)", "e": "Poprawny przyimek: <b>Po</b>. Łączy się z: Miejscownik. Przykład: <i>po wizycie</i>."}, {"a": "z", "w": "<b>z</b> = -den (kaynak). <i>notatki z lekcji</i> — dersten notlar. (+ Dopełniacz)", "e": "Poprawny przyimek: <b>z</b>. Łączy się z: Dopełniacz. Przykład: <i>notatki z lekcji</i>."}]}, {"id": 6, "topic": "Podróż pociągiem", "bank": ["z", "o", "w", "przez", "na", "za", "do"], "example": "z", "unused": "do", "text": "W zeszłym tygodniu wracałem @E@ Krakowa do domu pociągiem. Pociąg odjeżdżał {1} osiemnastej trzydzieści, dlatego musiałem być na dworcu kwadrans wcześniej. Bilet kupiłem wcześniej {2} internecie, więc nie stałem w kolejce. {3} całą drogę czytałem ciekawą książkę i patrzyłem przez okno. Pociąg zatrzymywał się {4} kilku małych stacjach, ale i tak przyjechał punktualnie. {5} bilet zapłaciłem tylko sześćdziesiąt złotych — to naprawdę niedrogo.", "gaps": [{"a": "o", "w": "<b>o</b> = saatte. <i>o osiemnastej trzydzieści</i> — 18:30'da. (+ Miejscownik)", "e": "Poprawny przyimek: <b>o</b>. Łączy się z: Miejscownik. Przykład: <i>o osiemnastej trzydzieści</i>."}, {"a": "w", "w": "<b>w internecie</b> — internetten/internette. (+ Miejscownik)", "e": "Poprawny przyimek: <b>w</b>. Łączy się z: Miejscownik."}, {"a": "Przez", "w": "<b>przez</b> = boyunca. <i>przez całą drogę</i> — yol boyunca. (+ Biernik)", "e": "Poprawny przyimek: <b>Przez</b>. Łączy się z: Biernik. Przykład: <i>przez całą drogę</i>."}, {"a": "na", "w": "<b>na</b> + Miejscownik = -de (yer). <i>zatrzymywać się na stacjach</i> — istasyonlarda durmak.", "e": "Poprawny przyimek: <b>na</b>. Przykład: <i>zatrzymywać się na stacjach</i>."}, {"a": "Za", "w": "<b>płacić za</b> + Biernik = bir şeyin karşılığında ödemek. <i>za bilet zapłaciłem…</i>", "e": "Poprawny przyimek: <b>Za</b>. Przykład: <i>za bilet zapłaciłem…</i>."}]}, {"id": 7, "topic": "Mieszkanie Kasi", "bank": ["na", "między", "pod", "obok", "do", "z", "o"], "example": "na", "unused": "o", "text": "Kasia mieszka @E@ trzecim piętrze w starej kamienicy w centrum miasta. Jej mieszkanie jest małe, ale bardzo wygodne. {1} kuchnią a salonem nie ma drzwi, dlatego przestrzeń wydaje się większa. {2} oknem rośnie duże drzewo, które latem daje przyjemny cień. {3} szkoły znajduje się mała piekarnia, więc rano zawsze czuć zapach świeżego chleba. Kasia często zaprasza znajomych {4} siebie i razem oglądają filmy. Za rok chce się jednak przeprowadzić {5} centrum na spokojne przedmieścia.", "gaps": [{"a": "Między", "w": "<b>między … a …</b> = arasında. <i>między kuchnią a salonem</i>. (+ Narzędnik)", "e": "Poprawny przyimek: <b>Między</b>. Łączy się z: Narzędnik. Przykład: <i>między kuchnią a salonem</i>."}, {"a": "Pod", "w": "<b>pod</b> = altında. <i>pod oknem</i> — pencerenin altında. (+ Narzędnik)", "e": "Poprawny przyimek: <b>Pod</b>. Łączy się z: Narzędnik. Przykład: <i>pod oknem</i>."}, {"a": "Obok", "w": "<b>obok</b> = yanında. <i>obok szkoły</i> — okulun yanında. (+ Dopełniacz)", "e": "Poprawny przyimek: <b>Obok</b>. Łączy się z: Dopełniacz. Przykład: <i>obok szkoły</i>."}, {"a": "do", "w": "<b>zapraszać do siebie</b> = kendi evine davet etmek. (+ Dopełniacz)", "e": "Poprawny przyimek: <b>do</b>. Łączy się z: Dopełniacz."}, {"a": "z", "w": "<b>z</b> = -den (çıkış noktası). <i>przeprowadzić się z centrum</i> — merkezden taşınmak. (+ Dopełniacz)", "e": "Poprawny przyimek: <b>z</b>. Łączy się z: Dopełniacz. Przykład: <i>przeprowadzić się z centrum</i>."}]}, {"id": 8, "topic": "Studia Magdy", "bank": ["na", "w", "o", "przed", "do", "przez", "od"], "example": "na", "unused": "od", "text": "Magda studiuje @E@ wydziale prawa i jest teraz na trzecim roku. Mieszka {1} akademiku razem z koleżanką z Litwy. Najbardziej lubi wykłady {2} historii prawa, bo profesor opowiada bardzo ciekawie. {3} sesją uczy się nawet po dziesięć godzin dziennie i prawie nie wychodzi z pokoju. Przygotowanie {4} egzaminu z prawa cywilnego zajęło jej trzy tygodnie. Na szczęście wszystko zdała za pierwszym razem i potem {5} cały tydzień nie otworzyła żadnej książki.", "gaps": [{"a": "w", "w": "<b>w akademiku</b> — yurtta. (+ Miejscownik)", "e": "Poprawny przyimek: <b>w</b>. Łączy się z: Miejscownik."}, {"a": "o", "w": "<b>o</b> = hakkında. <i>wykłady o historii prawa</i> — hukuk tarihi üzerine dersler. (+ Miejscownik)", "e": "Poprawny przyimek: <b>o</b>. Łączy się z: Miejscownik. Przykład: <i>wykłady o historii prawa</i>."}, {"a": "Przed", "w": "<b>przed</b> = -den önce. <i>przed sesją</i> — sınav dönemi öncesinde. (+ Narzędnik)", "e": "Poprawny przyimek: <b>Przed</b>. Łączy się z: Narzędnik. Przykład: <i>przed sesją</i>."}, {"a": "do", "w": "<b>przygotowanie do</b> = -e hazırlık. <i>do egzaminu</i>. (+ Dopełniacz)", "e": "Poprawny przyimek: <b>do</b>. Łączy się z: Dopełniacz. Przykład: <i>do egzaminu</i>."}, {"a": "przez", "w": "<b>przez</b> = boyunca. <i>przez cały tydzień</i> — bir hafta boyunca. (+ Biernik)", "e": "Poprawny przyimek: <b>przez</b>. Łączy się z: Biernik. Przykład: <i>przez cały tydzień</i>."}]}, {"id": 9, "topic": "Kolacja w restauracji", "bank": ["w", "na", "o", "z", "po", "do", "dla"], "example": "w", "unused": "dla", "text": "Wczoraj wieczorem byliśmy @E@ nowej włoskiej restauracji niedaleko rynku. Stolik zarezerwowałem tydzień wcześniej, bo {1} wolny stolik czeka się tam czasem nawet dwa tygodnie. Umówiliśmy się {2} dziewiętnastej, ale Marta spóźniła się dwadzieścia minut. Zamówiłem makaron {3} owocami morza, a ona pizzę i sałatkę grecką. {4} kolacji poszliśmy jeszcze {5} kawiarni obok, gdzie rozmawialiśmy prawie do północy.", "gaps": [{"a": "na", "w": "<b>czekać na</b> + Biernik = beklemek. <i>czekać na wolny stolik</i>.", "e": "Poprawny przyimek: <b>na</b>. Przykład: <i>czekać na wolny stolik</i>."}, {"a": "o", "w": "<b>o</b> = saatte. <i>umówić się o dziewiętnastej</i> — 19:00'da sözleşmek. (+ Miejscownik)", "e": "Poprawny przyimek: <b>o</b>. Łączy się z: Miejscownik. Przykład: <i>umówić się o dziewiętnastej</i>."}, {"a": "z", "w": "<b>z</b> = ile (içerik). <i>makaron z owocami morza</i> — deniz ürünlü makarna. (+ Narzędnik)", "e": "Poprawny przyimek: <b>z</b>. Łączy się z: Narzędnik. Przykład: <i>makaron z owocami morza</i>."}, {"a": "Po", "w": "<b>po</b> = -den sonra. <i>po kolacji</i> — akşam yemeğinden sonra. (+ Miejscownik)", "e": "Poprawny przyimek: <b>Po</b>. Łączy się z: Miejscownik. Przykład: <i>po kolacji</i>."}, {"a": "do", "w": "<b>do</b> = -e (yön). <i>pójść do kawiarni</i> — kafeye gitmek. (+ Dopełniacz)", "e": "Poprawny przyimek: <b>do</b>. Łączy się z: Dopełniacz. Przykład: <i>pójść do kawiarni</i>."}]}, {"id": 10, "topic": "Na siłowni", "bank": ["na", "bez", "z", "przez", "o", "od", "do"], "example": "na", "unused": "do", "text": "Trzy razy w tygodniu chodzę @E@ siłownię niedaleko domu. Zacząłem trenować, bo {1} ruchu czułem się coraz gorzej i szybko się męczyłem. Na początku ćwiczyłem {2} trenerem, który pokazał mi, jak robić wszystko poprawnie. Teraz trenuję sam {3} godzinę, zwykle wieczorem {4} dwudziestej. {5} pierwszego treningu minęło już pół roku i czuję się o wiele lepiej.", "gaps": [{"a": "bez", "w": "<b>bez</b> = -sız. <i>bez ruchu</i> — hareketsiz. (+ Dopełniacz)", "e": "Poprawny przyimek: <b>bez</b>. Łączy się z: Dopełniacz. Przykład: <i>bez ruchu</i>."}, {"a": "z", "w": "<b>z</b> = ile (birlikte). <i>ćwiczyć z trenerem</i> — antrenörle çalışmak. (+ Narzędnik)", "e": "Poprawny przyimek: <b>z</b>. Łączy się z: Narzędnik. Przykład: <i>ćwiczyć z trenerem</i>."}, {"a": "przez", "w": "<b>przez</b> = boyunca. <i>przez godzinę</i> — bir saat boyunca. (+ Biernik)", "e": "Poprawny przyimek: <b>przez</b>. Łączy się z: Biernik. Przykład: <i>przez godzinę</i>."}, {"a": "o", "w": "<b>o</b> = saatte. <i>o dwudziestej</i> — saat 20:00'de. (+ Miejscownik)", "e": "Poprawny przyimek: <b>o</b>. Łączy się z: Miejscownik. Przyk , "ważniejsza", "najważniejsza"], "correct": "najważniejsza", "e": "Stopień najwyższy, r.ż.: <i>najważniejsza zmiana</i>."}, {"options": ["mało", "mniej", "najmniej"], "correct": "mniej", "e": "Stopień wyższy nieregularny (mało → mniej): <i>o dziesięć kilogramów mniej</i>."}]}, {"title": "Egzamin w szkole", "textParts": ["Ten egzamin był ", ", niż się spodziewałem. Zadania z gramatyki były ", " od zadań ze słownictwa. Najbardziej bałem się części ustnej, bo mówię ", " niż piszę. Na szczęście dostałem ", " ocenę w klasie. To był ", " dzień w tym semestrze."], "gaps": [{"options": ["łatwy", "łatwiejszy", "najłatwiejszy"], "correct": "łatwiejszy", "e": "Stopień wyższy, r.m. + <b>niż</b>: <i>łatwiejszy niż się spodziewałem</i>."}, {"options": ["trudne", "trudniejsze", "najtrudniejsze"], "correct": "trudniejsze", "e": "Stopień wyższy, lm nmos. + <b>od</b> + Dopełniacz: <i>trudniejsze od zadań</i>."}, {"options": ["wolno", "wolniej", "najwolniej"], "correct": "wolniej", "e": "Przysłówek, stopień wyższy + <b>niż</b>: <i>mówię wolniej niż piszę</i>."}, {"options": ["dobra", "lepszą", "najlepszą"], "correct": "najlepszą", "e": "<b>dostać</b> + Biernik; stopień najwyższy r.ż.: <i>najlepszą ocenę</i>."}, {"options": ["szczęśliwy", "szczęśliwszy", "najszczęśliwszy"], "correct": "najszczęśliwszy", "e": "Stopień najwyższy (w tym semestrze): <i>najszczęśliwszy dzień</i>."}]}, {"title": "Świat zwierząt", "textParts": ["Gepard jest ", " zwierzęciem na lądzie. Słoń jest ", " od nosorożca, ale wieloryb jest ", " ze wszystkich. Małe ptaki śpiewają ", ", niż mogłoby się wydawać. Naukowcy odkrywają coraz ", " nowych gatunków."], "gaps": [{"options": ["szybkie", "szybszym", "najszybszym"], "correct": "najszybszym", "e": "<b>być</b> + Narzędnik; stopień najwyższy: <i>najszybszym zwierzęciem</i>."}, {"options": ["duży", "większy", "największy"], "correct": "większy", "e": "Stopień wyższy (duży → większy) + <b>od</b> + Dopełniacz: <i>większy od nosorożca</i>."}, {"options": ["duży", "większy", "największy"], "correct": "największy", "e": "Stopień najwyższy (ze wszystkich): <i>największy ze wszystkich</i>."}, {"options": ["głośno", "głośniej", "najgłośniej"], "correct": "głośniej", "e": "Przysłówek, stopień wyższy + <b>niż</b>: <i>śpiewają głośniej niż…</i>."}, {"options": ["dużo", "więcej", "najwięcej"], "correct": "więcej", "e": "Konstrukcja <b>coraz + stopień wyższy</b> + Dopełniacz: <i>coraz więcej gatunków</i>."}]}]};

<script>
/* ===== paylaşılan yardımcılar ===== */
function $(id){return document.getElementById(id)}
function ce(t){return document.createElement(t)}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function normW(s){return (s||'').toLowerCase().replace(/[.,;:!?"„”…()]/g,' ').replace(/\s+/g,' ').trim()}
function deDia(s){return s.replace(/ą/g,'a').replace(/ć/g,'c').replace(/ę/g,'e').replace(/ł/g,'l').replace(/ń/g,'n').replace(/ó/g,'o').replace(/ś/g,'s').replace(/ź/g,'z').replace(/ż/g,'z')}
function canon(s){return deDia(normW(s)).split(' ').filter(Boolean).sort().join('|')}
function endPunct(s){var m=s.match(/[.?!]+$/);return m?m[0]:''}
function stripEnd(s){return s.replace(/[.?!]+$/,'')}

/* tükenene kadar tekrar etmeyen seçici */
function Picker(n){this.n=n;this.order=[];this.i=0;this.last=-1}
Picker.prototype.reshuffle=function(){this.order=[];for(var k=0;k<this.n;k++)this.order.push(k);shuffle(this.order);
  if(this.n>1&&this.order[0]===this.last){var t=this.order[0];this.order[0]=this.order[1];this.order[1]=t}this.i=0};
Picker.prototype.next=function(){if(this.i>=this.order.length)this.reshuffle();var idx=this.order[this.i++];this.last=idx;return idx};

/* genel oturum toplamı */
var TOTAL={pts:0,max:0};
function addScore(mod,pts,max){TOTAL.pts+=pts;TOTAL.max+=max;
  $('total').innerHTML='Suma sesji: <b>'+fmt(TOTAL.pts)+'</b> / '+fmt(TOTAL.max);
  var s=MOD[mod];s.pts+=pts;s.max+=max;}
function fmt(x){return String(x).replace('.',',')}

/* ===== sekme tanımları ===== */
var TABS=[
 {key:'odmiana',kind:'under',rn:'I',name:'Odmiana',
  instr:'Proszę – zgodnie z przykładami – podkreślić poprawne formy wyrazów podanych w nawiasach (odmiana rzeczowników, przymiotników i zaimków).',uwaga:''},
 {key:'spojniki',kind:'ramka',rn:'II',name:'Spójniki',
  instr:'Proszę – zgodnie z przykładem – uzupełnić zdania wyrazami z ramki (wskaźniki zespolenia / spójniki).',uwaga:'Uwaga! Jeden wyraz w ramce jest niepotrzebny.'},
 {key:'stopniowanie',kind:'stopn',rn:'III',name:'Stopniowanie',
  instr:'Proszę uzupełnić tekst poprawnymi formami przymiotników i przysłówków (stopniowanie).',uwaga:'Uwaga! Zwróć uwagę na stopień: równy, wyższy czy najwyższy.'},
 {key:'czasowniki',kind:'verb',rn:'IV',name:'Czasowniki',
  instr:'Proszę – zgodnie z przykładami – uzupełnić tekst poprawnymi formami wyrazów podanych w nawiasach (czas teraźniejszy i przeszły).',uwaga:''},
 {key:'zaimki',kind:'qbank',rn:'V',name:'Pytania',
  instr:'Proszę wybrać właściwy zaimek pytajny, tak aby pasował do wyróżnionej części odpowiedzi.',uwaga:''},
 {key:'przeksztalcanie',kind:'trans',rn:'VI',name:'Przekształcanie',
  instr:'Proszę – zgodnie z przykładem – użyć wyrazu w nawiasie i przekształcić zdanie tak, by miało ten sam sens.',uwaga:''},
 {key:'aspekt',kind:'under',rn:'VII',name:'Aspekt i tryby',
  instr:'Proszę – zgodnie z przykładami – podkreślić poprawną formę wyrazów podanych w nawiasach (aspekt i tryby).',uwaga:''},
 {key:'przyimki',kind:'ramka',rn:'VIII',name:'Przyimki',
  instr:'Proszę – zgodnie z przykładem – uzupełnić zdania wyrazami z ramki (przyimki).',uwaga:'Uwaga! Jeden wyraz w ramce jest niepotrzebny.'}
];
var PTS={under:'5 p. (10 x 0,5 p.)',ramka:'2,5 p. (5 x 0,5 p.)',stopn:'5 p. (5 x 1 p.)',
         verb:'5 p. (10 x 0,5 p.)',qbank:'5 p. (10 x 0,5 p.)',trans:'5 p. (5 x 1 p.)'};

var MOD={}; // her modülün durumu

/* ===== iskele ===== */
function buildShell(){
  var nav=$('tabs'), body=$('panels');
  TABS.forEach(function(t,ti){
    var b=ce('button'); b.className='tab'+(ti===0?' on':''); b.type='button'; b.id='tab-'+t.key;
    b.innerHTML='<span class="rn">'+t.rn+'</span>'+t.name;
    b.onclick=function(){switchTab(t.key)};
    nav.appendChild(b);

    var p=ce('div'); p.className='panel'+(ti===0?' on':''); p.id='panel-'+t.key;
    p.innerHTML=
      '<p class="instr">'+t.rn+'. '+t.instr+'</p>'+
      (t.uwaga?'<p class="uwaga">'+t.uwaga+'</p>':'')+
      '<div class="pts"><span id="got-'+t.key+'">&nbsp;</span>/ '+PTS[t.kind]+'</div>'+
      '<div class="meta"><span id="meta-'+t.key+'"></span><span id="sess-'+t.key+'">Wynik sesji: 0 / 0</span></div>'+
      '<div id="mount-'+t.key+'"></div>'+
      '<div class="result" id="res-'+t.key+'"><p class="score" id="sc-'+t.key+'"></p><p class="subnote" id="sub-'+t.key+'"></p><p class="leftover" id="lo-'+t.key+'"></p></div>'+
      '<div class="actions" id="act-'+t.key+'"></div>';
    body.appendChild(p);

    MOD[t.key]={cfg:t,pts:0,max:0,picker:new Picker(bankLen(t.key)),locked:false,state:null};
  });
}
function bankLen(key){
  if(key==='stopniowanie')return DB.stopniowanie.length;
  if(key==='przeksztalcanie')return DB.przeksztalcanie.length;
  if(key==='zaimki')return DB.zaimki.length;
  return DB[key].length;
}
function switchTab(key){
  TABS.forEach(function(t){$('tab-'+t.key).classList.toggle('on',t.key===key);$('panel-'+t.key).classList.toggle('on',t.key===key)});
  if(!MOD[key].state) loadNew(key);
  window.scrollTo({top:0,behavior:'smooth'});
}
