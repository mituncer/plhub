  for(var sIdx=0;sIdx<=reveal&&sIdx<it.slots.length;sIdx++){ (function(si){ var slot=it.slots[si];
    if(!slot._ord){slot._ord=shuffle(slot.o.map(function(_,i){return i}))}
    var wrap=ce('div'); wrap.className='slot'; var lab=ce('div'); lab.className='slotlab'; lab.textContent=(si+1)+'. słowo';
    var opts=ce('div'); opts.className='opts';
    slot._ord.forEach(function(oi){ var b=ce('button'); b.className='opt'+(ans[si]===oi?' sel':''); b.type='button'; b.textContent=slot.o[oi];
      b.onclick=function(){ if(s.locked)return; s.ans[idx][si]=oi; var nx=si+1; transSlots(key,idx); transAsm(key,idx); transChk(key); }; opts.appendChild(b); });
    wrap.appendChild(lab); wrap.appendChild(opts); host.appendChild(wrap);
  })(sIdx); }
}
function transAsm(key,idx){ var s=MOD[key], it=s.state.items[idx], a=s.ans[idx], parts=[];
  for(var i=0;i<it.slots.length;i++){ parts.push(a[i]>=0?'<span class="done">'+it.slots[i].o[a[i]]+'</span>':'<span class="ph">___</span>'); }
  $(key+'-asm'+idx).innerHTML=parts.join(' ')+endPunct(it.model); }
function transChk(key){ var s=MOD[key], items=s.state.items, done=0;
  items.forEach(function(it,idx){ if(s.mode==='write'){if((s.ans[idx]||'').trim()!=='')done++;} else {if(s.ans[idx].every(function(v){return v>=0}))done++;} });
  $('chk-'+key).disabled=done<items.length; }
function checkTrans(key){
  var s=MOD[key]; s.locked=true; var items=s.state.items, pts=0;
  items.forEach(function(it,idx){ var ok=false, yours='';
    if(s.mode==='write'){ var inp=$(key+'-a'+idx); inp.disabled=true; yours=inp.value.trim();
      var accepts=[canon(it.model)].concat((it.accept||[]).map(canon)); ok=accepts.indexOf(canon(yours))>-1; inp.className='ans full '+(ok?'ok':'bad'); }
    else{ ok=true; it.slots.forEach(function(sl,si){if(s.ans[idx][si]!==sl.c)ok=false});
      transSlots(key,idx); var host=$(key+'-slots'+idx).getElementsByClassName('slot');
      for(var sIdx=0;sIdx<it.slots.length;sIdx++){ var slot=it.slots[sIdx], chosen=s.ans[idx][sIdx], btns=host[sIdx].getElementsByClassName('opt');
        for(var b=0;b<btns.length;b++){ var oi=slot._ord[b]; btns[b].classList.remove('sel');
          if(oi===slot.c&&oi===chosen)btns[b].classList.add('right'); else if(oi===chosen)btns[b].classList.add('wrong'); else if(oi===slot.c)btns[b].classList.add('reveal'); } }
      yours=it.slots.map(function(sl,si){return s.ans[idx][si]>=0?sl.o[s.ans[idx][si]]:'—'}).join(' ')+endPunct(it.model); }
    if(ok)pts++;
    var fb=$(key+'-fb'+idx); fb.innerHTML='<span class="verdict '+(ok?'good':'bad')+'">'+(ok?'Poprawnie':'Błąd')+'</span><span class="model">'+it.model+'</span>'+(ok?'':'<span class="yours">('+(yours||'—')+')</span>')+'<div class="rule">'+it.e+'</div>'; fb.className='fb show'; });
  finish(key,pts,5,5);
}

/* ===== ortak bitiş ===== */
function finish(key,pts,max,count){
  $('got-'+key).textContent=fmt(pts);
  var per = (MOD[key].cfg.kind==='trans'||MOD[key].cfg.kind==='stopn') ? (pts+' / '+count) : (fmt(pts)+' / '+fmt(max));
  var right = (MOD[key].cfg.kind==='trans'||MOD[key].cfg.kind==='stopn') ? pts : (pts/0.5);
  $('sc-'+key).innerHTML=per+' <small>&nbsp;('+right+' / '+count+' poprawnych)</small>';
  $('res-'+key).className='result show';
  var chk=$('chk-'+key); chk.disabled=false; chk.textContent='Reset'; chk.onclick=function(){resetCurrent(key)};
  addScore(key,pts,max); updSess(key);
}

/* ===== PDF / druk: aktif sekmeyi cevap ve düzeltmelerle bas ===== */
function activeTab(){
  for(var i=0;i<TABS.length;i++){ if($('panel-'+TABS[i].key).classList.contains('on')) return TABS[i]; }
  return TABS[0];
}
function exportPDF(){
  var t=activeTab();
  if(MOD[t.key] && !MOD[t.key].state) loadNew(t.key);   // güvenlik: içerik boşsa yükle
  var prev=document.title;
  document.title='Trener gramatyki B1 — '+t.rn+'. '+t.name;
  function restore(){ document.title=prev; window.removeEventListener('afterprint',restore); }
  window.addEventListener('afterprint',restore);
  setTimeout(function(){ window.print(); },60);
}

/* =================================================================
   ÜRETİM + ÖNBELLEK (havuz + online üretim hibriti)
   - Havuz (DB) olduğu gibi kalır.
   - Online + API anahtarı varsa yeni setler üretilir, localStorage'a
     önbelleğe alınır ve DB'ye eklenir.
   - Offline'da: havuz + önceden üretilip önbelleğe alınmış setler birlikte.
================================================================= */
function isArr(x){return Object.prototype.toString.call(x)==='[object Array]'}
function genCount(key){var a=DB[key]||[],n=0;for(var i=0;i<a.length;i++){if(a[i]&&a[i]._gen)n++}return n}
function currentGen(key){var s=MOD[key];if(!s||!s.state)return false;var it=s.state.item||s.state.p;return !!(it&&it._gen)}
function tagMeta(key){
  var m=$('meta-'+key); if(!m)return;
  var extra='';
  if(currentGen(key)) extra+=' <span class="genbadge">üretildi</span>';
  var g=genCount(key); if(g>0) extra+=' <span class="gennote">&middot; havuzda +'+g+' üretilmiş</span>';
  if(extra) m.innerHTML+=extra;
}

/* --- kategori -> tür eşlemesi --- */
var KINDOF={}; TABS.forEach(function(t){KINDOF[t.key]=t.kind});
/* kaç yeni birim üretilsin (küçük birimli kategoriler daha çok) */
var NPER={zaimki:6,przeksztalcanie:6};
var IDCATS=['odmiana','spojniki','czasowniki','aspekt','przyimki'];

/* --- yapı doğrulayıcıları (bozuk üretimi ele) --- */
function vUnder(it){
  if(!it||typeof it.text!=='string'||!isArr(it.ex)||!isArr(it.g)||!it.g.length)return false;
  for(var i=0;i<it.ex.length;i++){var e=it.ex[i];if(!e||!isArr(e.o)||e.o.length<2||typeof e.c!=='number')return false;if(it.text.indexOf('@E'+(i+1)+'@')<0)return false}
  for(var k=1;k<=it.g.length;k++){if(it.text.indexOf('{'+k+'}')<0)return false;var g=it.g[k-1];if(!g||!isArr(g.o)||g.o.length<2||typeof g.c!=='number'||g.c<0||g.c>=g.o.length||typeof g.e!=='string')return false}
  return true;
}
function vRamka(it){
  if(!it||typeof it.text!=='string'||!isArr(it.bank)||it.bank.length<6||typeof it.example!=='string'||typeof it.unused!=='string')return false;
  var gaps=it.g||it.gaps; if(!isArr(gaps)||gaps.length!==5)return false;
  if(it.text.indexOf('@E@')<0)return false;
  for(var k=1;k<=5;k++){if(it.text.indexOf('{'+k+'}')<0)return false;var g=gaps[k-1];if(!g||typeof g.a!=='string'||typeof g.e!=='string')return false}
  return true;
}
function vVerb(it){
  if(!it||typeof it.text!=='string'||!isArr(it.ex)||!isArr(it.g)||it.g.length!==10)return false;
  for(var i=0;i<it.ex.length;i++){var e=it.ex[i];if(!e||typeof e.f!=='string'||typeof e.inf!=='string')return false;if(it.text.indexOf('@E'+(i+1)+'@')<0)return false}
  for(var k=1;k<=10;k++){if(it.text.indexOf('{'+k+'}')<0)return false;var g=it.g[k-1];if(!g||!isArr(g.a)||!g.a.length||typeof g.h!=='string'||typeof g.t!=='string'||typeof g.e!=='string')return false}
  return true;
}
function vQ(it){return !!(it&&typeof it.q==='string'&&typeof it.fill==='string'&&typeof it.ansContext==='string'&&isArr(it.options)&&it.options.length>=3&&typeof it.correct==='number'&&it.correct>=0&&it.correct<it.options.length&&typeof it.e==='string')}
function vTrans(it){
  if(!it||typeof it.src!=='string'||typeof it.cue!=='string'||typeof it.model!=='string'||!isArr(it.slots)||!it.slots.length||typeof it.e!=='string')return false;
  for(var i=0;i<it.slots.length;i++){var sl=it.slots[i];if(!sl||!isArr(sl.o)||sl.o.length<2||typeof sl.c!=='number'||sl.c<0||sl.c>=sl.o.length)return false}
  return true;
}
function vStopn(it){
  if(!it||typeof it.title!=='string'||!isArr(it.textParts)||!isArr(it.gaps))return false;
  if(it.textParts.length!==it.gaps.length+1)return false;
  for(var i=0;i<it.gaps.length;i++){var g=it.gaps[i];if(!g||!isArr(g.options)||g.options.length<2||typeof g.correct!=='string'||g.options.indexOf(g.correct)<0||typeof g.e!=='string')return false}
  return true;
}
var VALID={under:vUnder,ramka:vRamka,verb:vVerb,qbank:vQ,trans:vTrans,stopn:vStopn};

function assignId(cat,it){ if(IDCATS.indexOf(cat)>-1){var mx=0;DB[cat].forEach(function(x){if(x.id&&x.id>mx)mx=x.id});it.id=mx+1;} }

var GEN={
  KEYK:'gtrener_key', MODK:'gtrener_model', CACHEK:'gtrener_gen', AUTOK:'gtrener_auto', ROTK:'gtrener_rot',
  cache:{},
  getKey:function(){return (localStorage.getItem(this.KEYK)||'').trim()},
  getModel:function(){return (localStorage.getItem(this.MODK)||'claude-sonnet-5').trim()},
  load:function(){
    try{this.cache=JSON.parse(localStorage.getItem(this.CACHEK)||'{}')||{}}catch(e){this.cache={}}
    for(var cat in this.cache){ if(DB[cat]&&isArr(this.cache[cat])){ for(var i=0;i<this.cache[cat].length;i++){ var it=this.cache[cat][i]; it._gen=true; DB[cat].push(it); } } }
  },
  save:function(){ try{localStorage.setItem(this.CACHEK,JSON.stringify(this.cache))}catch(e){} },
  buildPrompt:function(cat,kind,n,ex){
    var extra='';
    if(kind==='ramka') extra='8. "bank" 7 wyrazów; jeden zbędny podany w polu "unused"; "example" to jeden z wyrazów z banku.';
    else if(kind==='verb') extra='8. Dokładnie 10 luk {1}..{10}; pole "a" to tablica akceptowanych form.';
    else if(kind==='under') extra='8. Tyle luk {1}..{N}, ile obiektów w "g"; każde "o" ma 3 opcje.';
    else if(kind==='stopn') extra='8. "textParts" ma o jeden element więcej niż "gaps"; "correct" musi być jedną z "options".';
    else if(kind==='trans') extra='8. Każdy "slot" ma tablicę "o" i indeks poprawnej odpowiedzi "c".';
    return [
     'Jesteś ekspertem od polskiej gramatyki i autorem zadań na egzamin certyfikatowy B1.',
     'Wygeneruj '+n+' NOWYCH pozycji do kategorii "'+cat+'", w DOKŁADNIE takim samym formacie JSON jak przykłady.',
     '',
     'PRZYKŁADY (kopiuj tylko strukturę i styl, NIE treść):',
     JSON.stringify(ex),
     '',
     'ZASADY:',
     '1. Zwróć WYŁĄCZNIE tablicę JSON z '+n+' obiektami. Bez markdown, bez komentarzy, bez potrójnych apostrofów.',
     '2. Te same nazwy pól i ta sama struktura co w przykładach.',
     '3. Polszczyzna B1: krótkie, proste, poprawne zdania. Nowe, różne tematy.',
     '4. Gramatyka bezbłędna; formy zgodne z zaznaczonymi odpowiedziami.',
     '5. Objaśnienia (pola "w","e" itd.) w tym samym stylu i języku co w przykładach (polski + turecki).',
     '6. WAŻNE: poprawna opcja NIE może być najdłuższa; wyrównaj długości opcji, by długość nie zdradzała odpowiedzi.',
     '7. Zachowaj znaczniki @E@ / @E1@... oraz luki {1},{2}... jak w przykładach; liczba luk = liczbie odpowiedzi.',
     extra,
     'Teraz zwróć samą tablicę JSON.'
    ].join('\n');
  },
  generate:function(cat,cb){
    var self=this, key=this.getKey();
    if(!navigator.onLine){cb('Çevrimdışısın — üretim için internet gerekli.',false);return}
    if(!key){cb('Önce API anahtarını gir (⚙).',false);return}
    var kind=KINDOF[cat], n=NPER[cat]||2;
    var pool=DB[cat].filter(function(x){return !x._gen}); if(!pool.length)pool=DB[cat].slice();
    var ex=shuffle(pool.slice()).slice(0,2).map(function(x){var c=JSON.parse(JSON.stringify(x));delete c._gen;return c});
    cb('Üretiliyor… ('+cat+')',null);
    fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:this.getModel(),max_tokens:8000,messages:[{role:'user',content:this.buildPrompt(cat,kind,n,ex)}]})
    }).then(function(r){return r.json()}).then(function(data){
      if(data&&data.error){cb('API hatası: '+(data.error.message||data.error.type||'bilinmiyor'),false);return}
      var txt=((data&&data.content)||[]).filter(function(b){return b.type==='text'}).map(function(b){return b.text}).join('\n');
      txt=txt.replace(/```json/gi,'').replace(/```/g,'').trim();
      var m=txt.indexOf('['); if(m>0)txt=txt.slice(m);
      var arr; try{arr=JSON.parse(txt)}catch(e){cb('Yanıt JSON olarak okunamadı — tekrar dene.',false);return}
      if(!isArr(arr)){cb('Beklenen dizi gelmedi.',false);return}
      var ok=0, val=VALID[kind];
      arr.forEach(function(it){ if(val(it)){ it._gen=true; assignId(cat,it); DB[cat].push(it); (self.cache[cat]=self.cache[cat]||[]).push(it); ok++; } });
      if(!ok){cb('Gelen sorular yapı kontrolünden geçmedi, kaydedilmedi.',false);return}
      self.save();
      MOD[cat].picker=new Picker(DB[cat].length);
      cb('✓ '+ok+' yeni birim eklendi. Havuzda toplam +'+genCount(cat)+' üretilmiş.',true);
    }).catch(function(e){cb('Ağ hatası: '+e.message+' (CORS/anahtar?).',false)});
  },
  clearAll:function(){
    for(var cat in this.cache){ if(DB[cat]) DB[cat]=DB[cat].filter(function(x){return !x._gen}); }
    this.cache={}; this.save();
    TABS.forEach(function(t){ MOD[t.key].picker=new Picker(DB[t.key].length); MOD[t.key].state=null; });
  },
  autoRun:function(){
    if(localStorage.getItem(this.AUTOK)!=='1')return;
    if(!navigator.onLine||!this.getKey())return;
    var cats=TABS.map(function(t){return t.key});
    var i=parseInt(localStorage.getItem(this.ROTK)||'0',10)%cats.length; if(isNaN(i))i=0;
    localStorage.setItem(this.ROTK,String((i+1)%cats.length));
    this.generate(cats[i],function(){}); /* sessiz: yeni setler bir sonraki "Nowy zestaw"te gelir */
  },
  initUI:function(){
    var css='#genBtn{font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:3px;padding:6px 10px;line-height:1}'
      +'#genOv{position:fixed;inset:0;background:rgba(20,28,40,.45);display:none;align-items:flex-end;justify-content:center;z-index:60}'
      +'#genOv.on{display:flex}'
      +'#genPanel{background:#fff;width:100%;max-width:840px;border:1px solid var(--line);border-radius:12px 12px 0 0;padding:16px 16px 24px;box-shadow:0 -8px 26px rgba(20,28,40,.18)}'
      +'#genPanel h3{margin:0 0 6px;font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:17px}'
      +'#genPanel label{display:block;font-size:12.5px;color:var(--soft);font-weight:700;margin:12px 0 3px}'
      +'#genPanel input[type=password],#genPanel input[type=text]{width:100%;font:inherit;font-size:14px;padding:9px 10px;border:1.5px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink)}'
      +'.genrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.genrow .btn{flex:1 1 auto}'
      +'.genchk{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--soft)}'
      +'.genchk input{width:18px;height:18px}'
      +'#genStatus{font-size:12.5px;margin-top:12px;min-height:18px}'
      +'#genStatus.ok{color:var(--green)}#genStatus.err{color:var(--red)}#genStatus.busy{color:var(--amber)}'
      +'.genclose{float:right;cursor:pointer;border:none;background:transparent;font-size:22px;line-height:1;color:var(--soft)}'
      +'.gstat{font-size:12px;margin:2px 0 2px}.gon{color:var(--green);font-weight:700}.goff{color:var(--red);font-weight:700}'
      +'.genbadge{display:inline-block;font-size:10px;font-weight:700;color:#fff;background:var(--blue);border-radius:3px;padding:1px 5px;vertical-align:middle;margin-left:4px}'
      +'.gennote{font-size:11.5px;color:var(--soft)}'
      +'.ghelp{font-size:11.5px;color:var(--soft);margin-top:4px;line-height:1.4}';
    var st=ce('style'); st.textContent=css; document.head.appendChild(st);

    var btn=ce('button'); btn.id='genBtn'; btn.type='button'; btn.title='Soru üretimi / ayarlar'; btn.textContent='⚙';
    var mr=document.querySelector('.mast-right'); mr.insertBefore(btn,$('pdfBtn'));

    var ov=ce('div'); ov.id='genOv';
    ov.innerHTML='<div id="genPanel" role="dialog" aria-label="Soru üretimi">'
      +'<button class="genclose" id="genX" aria-label="Kapat">&times;</button>'
      +'<h3>⚙ Soru üretimi</h3>'
      +'<div class="gstat" id="genNet"></div>'
      +'<label>Anthropic API anahtarı <span style="font-weight:400">(sadece bu cihazda saklanır)</span></label>'
      +'<input id="genKey" type="password" placeholder="sk-ant-..." autocomplete="off" spellcheck="false">'
      +'<label>Model</label>'
      +'<input id="genModel" type="text" placeholder="claude-sonnet-5" autocomplete="off" spellcheck="false">'
      +'<div class="ghelp">Anahtar dosyaya değil, tarayıcı hafızasına yazılır. Bu dosyayı anahtar girildikten sonra kimseyle paylaşma. Her üretim küçük bir API ücreti doğurur.</div>'
      +'<div class="genchk"><input type="checkbox" id="genAuto"><label for="genAuto" style="margin:0;color:var(--soft)">Açılışta çevrimiçiysem sırayla bir kategori otomatik üret</label></div>'
      +'<div class="genrow"><button class="btn" id="genOne">Bu kategori için üret</button><button class="btn ghost" id="genClear">Üretilenleri sil</button></div>'
      +'<div id="genStatus"></div>'
      +'</div>';
    document.body.appendChild(ov);

    function stat(msg,ok){ var s=$('genStatus'); s.textContent=msg||''; s.className=(ok===true?'ok':ok===false?'err':'busy'); }
    function net(){ var on=navigator.onLine; $('genNet').innerHTML=on?'Durum: <span class="gon">çevrimiçi</span>':'Durum: <span class="goff">çevrimdışı</span>'; }
    function open(){ $('genKey').value=GEN.getKey(); $('genModel').value=GEN.getModel(); $('genAuto').checked=localStorage.getItem(GEN.AUTOK)==='1'; net(); stat('Etkin kategori: '+activeTab().name+' · havuzda +'+genCount(activeTab().key)+' üretilmiş.',null); $('genStatus').className=''; ov.classList.add('on'); }
    function close(){ ov.classList.remove('on'); }

    btn.onclick=open;
    $('genX').onclick=close;
    ov.onclick=function(e){ if(e.target===ov)close(); };
    $('genKey').oninput=function(){ localStorage.setItem(GEN.KEYK,this.value.trim()); };
    $('genModel').oninput=function(){ localStorage.setItem(GEN.MODK,this.value.trim()); };
    $('genAuto').onchange=function(){ localStorage.setItem(GEN.AUTOK,this.checked?'1':'0'); };
    $('genOne').onclick=function(){
      var cat=activeTab().key, b=this; b.disabled=true;
      GEN.generate(cat,function(msg,ok){ stat(msg,ok); if(ok!==null)b.disabled=false; if(ok){ if(activeTab().key===cat) loadNew(cat); } });
    };
    $('genClear').onclick=function(){
      if(!confirm('Üretilmiş tüm setler silinsin mi? (Havuz/orijinal sorular kalır.)'))return;
      GEN.clearAll(); loadNew(activeTab().key); stat('Üretilmiş setler silindi.',true);
    };
    window.addEventListener('online',net); window.addEventListener('offline',net);
  }
};

/* ===== start ===== */
GEN.load();
buildShell();
GEN.initUI();
loadNew('odmiana');
$('total').innerHTML='Suma sesji: <b>0</b> / 0';
$('pdfBtn').onclick=exportPDF;
GEN.autoRun();

</script>
